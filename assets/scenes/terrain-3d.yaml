# terrain3d.yaml
import:
    - elevation.yaml


global:
    terrain_3d_mixin: terrain-3d
    terrain_3d_scale: 1.0
    # clip-space depth bias factor pulling draped vector geometry toward the camera relative to the
    #  terrain mesh (position block below: depth_shift = -factor * u_proj[2][3])
    terrain_depth_shift: 0.08
    # extra depth shift per unit of terrain slope (rise/run, capped at 4) on the terrain mesh: near-
    #  vertical walls amplify any sub-meter xy/z disagreement between the terrain mesh and the
    #  draped polygons into visible tan slivers, increasingly so the closer the camera is
    terrain_depth_slope: 1.0
    elevation_sources: [elevation]
    fog_color: '#FFFFFF'
    #show_land_polygons: false  -- set in config updates


# need to add support for uniform appearing in multiple shaders
#application:
#    gui_variables:
#        u_fog_density:
#            style: hillshade
#            label: Fog density
#            min: 0
#            max: 100


styles:
    fog:
        shaders:
            uniforms:
                u_fog_color: global.fog_color
                u_fog_density: 0.1
            blocks:
                filter: |
                    #ifdef TANGRAM_TERRAIN_3D
                    // Aerial perspective, part 1: color mix toward the atmosphere color with distance.
                    //  Part 2 (shading-contrast attenuation with the same haze factor) lives in
                    //  hillshade.yaml's color block, which duplicates this formula because the filter
                    //  block runs after color - keep the two in sync (docs/terrain-illumination-plan.md).
                    // note v_position.z < 0
                    float cospitch = u_view[2][2];
                    float eyeh = -u_view[3][2];  // distance from eye to map center
                    float fog = exp(u_fog_density * v_position.z/eyeh/(cospitch + 0.5));
                    color.rgb = mix(u_fog_color.rgb, color.rgb, clamp(fog, 0.0, 1.0));
                    #endif

    terrain-3d:
        mix: [ get-elevation, fog ]
        # tile_edges == false is the default except for lines
        draw: { tile_edges: false }
        shaders:
            defines:
                TANGRAM_VERTEX_RASTERS: true
                TANGRAM_MIN_ELEVATION: 0.0
                TANGRAM_TERRAIN_SCALE: global.terrain_3d_scale
                # diagnostic knob (drape patches investigation): see the depth_shift line below
                TERRAIN_DEPTH_SHIFT: global.terrain_depth_shift
                TERRAIN_DEPTH_SLOPE: global.terrain_depth_slope
            blocks:
                position: |
                    #ifdef TANGRAM_TERRAIN_3D
                    // use larger depth delta near camera to prevent terrain from covering geometry
                    depth_shift = -float(TERRAIN_DEPTH_SHIFT)*u_proj[2][3];
                    #ifdef TANGRAM_RASTER_STYLE
                    // need sufficient offset for proxy levels to prevent terrain poking through level above
                    proxy *= 48.0;
                    #endif
                    #ifdef TANGRAM_RASTER_STYLE
                    // terrain-ground/hillshade mesh vertices ARE the terrain lattice nodes
                    //  (RasterStyle::build), so a single sample suffices and defines the surface
                    float elev3d = max(latticeNodeElevation(currentRasterUV(ELEVATION_INDEX)), TANGRAM_MIN_ELEVATION);
                    {
                        // slope-aware shift (terrain_depth_slope): 2 one-sided taps at 1 texel
                        vec2 sUv = currentRasterUV(ELEVATION_INDEX);
                    #ifdef ELEVATION_MOSAIC
                        vec2 sDuv = 1.0 / (rasterPixelSize(ELEVATION_INDEX) / float(ELEVATION_MOSAIC_SPAN) + float(ELEVATION_TILE_OVERLAP));
                    #else
                        vec2 sDuv = 1.0 / rasterPixelSize(ELEVATION_INDEX);
                    #endif
                        float sMpt = 2.0 * 3.141592 * 6378137.0 * exp2(-u_tile_origin.w) * sDuv.x
                                     / u_raster_offsets[ELEVATION_INDEX].z;
                        float sUn = exp(u_map_position.y / 6378137.0);
                        float sCos = 2.0 / (sUn + 1.0 / sUn);
                        float sH0 = getElevationAt(sUv);
                        float sSlope = max(abs(getElevationAt(sUv + vec2(sDuv.x, 0.0)) - sH0),
                                           abs(getElevationAt(sUv + vec2(0.0, sDuv.y)) - sH0)) / (sMpt * sCos);
                        depth_shift *= 1.0 + float(TERRAIN_DEPTH_SLOPE) * clamp(sSlope, 0.0, 4.0);
                    }
                    #else
                    // draped vector meshes must evaluate the terrain mesh's own piecewise-linear
                    //  surface, NOT resample the raster at their own vertices - see
                    //  getTerrainMeshElevation (elevation.yaml) for why ("white patches")
                    float elev3d = getTerrainMeshElevation(float(TANGRAM_MIN_ELEVATION));
                    #endif
                    position.z += float(TANGRAM_TERRAIN_SCALE) * elev3d;
                    v_world_position.z += elev3d;
                    #endif
