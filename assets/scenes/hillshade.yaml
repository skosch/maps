# Hillshading and contour lines from DEM (elevation) tiles

# - elevation tile data format: https://github.com/tilezen/joerd/blob/master/docs/formats.md
#  - cannot be used with linear filtering (GL_LINEAR), and GLES doesn't support filtering with f32 (only f16
#   or smaller), so we have to set `filtering: nearest` and do interpolation ourselves
#  - also, Tangram doesn't use GLSL #version statement (although shader block can request extensions), so we
#   have to use texture2D instead of texelFetch (GLSL 1.30+)
#  - see https://github.com/SableRaf/Processing-Experiments/blob/master/2013/Shaders/filtersAndBlendModes/Filters/Bicubic/data/shader.glsl and links therein for some alternative interpolation methods; also https://vec3.ca/bicubic-filtering-in-fewer-taps/

# - Many algorithms for computing hillshading (i.e., normals) from elevation
#  - https://www.usna.edu/Users/oceano/pguth/md_help/html/demb1f3n.htm
#  - Zevenbergen & Thorne: 2nd order central finite diff - vec2(h21 - h01, h12 - h10)/dxy/2 (where h11 is central texel)
#  - Horn: Sobel operator (3rd order finite diff w/ 8 surrounding pixels)

# - slight seams between tiles are sometimes visible - I don't think there is any way to completely eliminate
#  these other than adding a 1 pixel border around each tile with pixels from adjacent tiles (as mapbox-gl does)
#  ... or use precalculated normal tiles for hillshading instead of calculating from elevation
# - mapbox-gl calculates gradient from elevation in 1st pass ("hillshade_prepare") using Horn (Sobel operator)
#  and GL_NEAREST, then in 2nd pass ("hillshade") calculates normal (reading gradients from texture w/
#  GL_LINEAR) and does some fancy adjustments to get final hillshading
# - Carto SDK generates normals from elevation on CPU (also using Horn/Sobel)

import:
    - elevation.yaml


global:
    contour_color: '#C56008'  #vec4(0.773,0.376,0.031,1.)
    base_mix_color: [0.9, 0.9, 0.9, 0.8]
    show_contours: false
    show_hypsometric: true
    enable_contour_vars: false


application:
    gui_variables:
        u_exaggerate:
            style: hillshade
            label: Hillshade Exaggeration
        contour_color:
            enabled: global.enable_contour_vars
            label: Contour Color
            type: color
        u_min_contour_elev:
            enabled: global.enable_contour_vars
            style: hillshade
            label: Min Contour Elevation (m)
            step: 100
            min: -9000
            max: 9000
        # Texture shading (docs/texture-shading-plan.md) - only has any visible effect when
        #  ELEVATION_MOSAIC is enabled for the active elevation source (see elevation.yaml), i.e.
        #  when the "Texture shading" checkbox is on. Balance against the normal hillshade via
        #  "Hillshade Exaggeration" above (0 = texture shading only).
        # Band-weight exponent (Brown's alpha, weight 2^(-k*alpha) for octave band k): lower =
        #  broad landforms dominate, higher = fine detail dominates. The main slider is the
        #  value at view zoom >= 13; "Zoomed Out" is the value at zoom <= 10.5 (interpolated
        #  in between, so detail emphasis eases off as more terrain comes into view).
        u_texture_shading_alpha:
            style: hillshade
            label: Texture Shading Alpha
            min: 0
            max: 3
            step: 0.05
        u_texture_shading_alpha_min:
            style: hillshade
            label: Texture Shading Alpha Zoomed Out
            min: 0
            max: 3
            step: 0.05
        u_texture_shading_contrast:
            style: hillshade
            label: Texture Shading Contrast
            min: 0
            max: 5
            step: 0.05
        # Overall strength of the texture-shading tint in the final composite.
        u_texture_shading_opacity:
            style: hillshade
            label: Texture Shading Opacity
            min: 0
            max: 1
            step: 0.05
        # Number of octave bands summed (pyramid depth): more levels = larger landforms
        #  contribute (each level doubles the coarsest feature size).
        u_texture_shading_levels:
            style: hillshade
            label: Texture Shading Levels
            min: 1
            max: 8
            step: 1
        # Shift all bands coarser (+) or finer (-) by fractional octaves: raise to emphasize
        #  prominent ridges/valleys and suppress fine texture noise.
        u_texture_shading_scale:
            style: hillshade
            label: Texture Shading Scale
            min: -1
            max: 3
            step: 0.25
        # Compositing mode: 0 = gray tint mix (classic standalone texture-shading look),
        #  1 = multiply (darkens valleys/brightens ridges over the existing hillshade,
        #  preserving its 3D effect); values between blend the two.
        u_texture_shading_blend:
            style: hillshade
            label: Texture Shading Blend
            min: 0
            max: 1
            step: 0.05
        # 2D->3D illumination morph (docs/terrain-illumination-plan.md): with 3D terrain, the
        #  zenith view keeps the exact 2D cartographic look, and tilting morphs into an oblique
        #  illumination model - CIE-overcast sky (azimuth-free, rotation-proof) x an occlusion
        #  proxy from the texture-shading pyramid (SVF-like) + a soft screen-anchored sun.
        #  These sliders only affect tilted 3D views.
        u_sky_weight:
            style: hillshade
            label: 3D Sky Light Weight
            min: 0
            max: 1
            step: 0.05
        u_sun_weight:
            style: hillshade
            label: 3D Sun Light Weight
            min: 0
            max: 1
            step: 0.05
        # amplitude of the texture-shading-derived occlusion (valleys darker, ridges brighter)
        #  and the floor it clamps to (valley-floor darkness limit)
        u_occ_strength:
            style: hillshade
            label: 3D Occlusion Strength
            min: 0
            max: 2
            step: 0.05
        u_occ_min:
            style: hillshade
            label: 3D Occlusion Min
            min: 0
            max: 1
            step: 0.05
        # overall strength of the oblique shading layer: alpha of the translucent blend-over,
        #  and contrast gain (rgb = gain*L - (gain-1), the same trick as the 2D 4*shading-3)
        u_shade3d_alpha:
            style: hillshade
            label: 3D Shade Alpha
            min: 0
            max: 1
            step: 0.05
        u_shade3d_gain:
            style: hillshade
            label: 3D Shade Gain
            min: 1
            max: 8
            step: 0.25
        # aerial perspective: how much distance haze flattens shading contrast (the color fog
        #  mix itself lives in terrain-3d.yaml's fog style)
        u_haze_contrast:
            style: hillshade
            label: 3D Haze Contrast Atten
            min: 0
            max: 1
            step: 0.05


styles:
    # rasters assigned to a vector tile are limited to vector tile zoom, so to see higher resolution DEM, we
    #  have to blend vector polygons over base hillshading
    translucent-polygons:
        base: polygons
        lighting: false
        blend: translucent
        draw: { alpha: 0.25 }

    # for mixing fixed color into color from raster, e.g., to lighten and desaturate color from worldcover tiles
    mix-base-raster:
        shaders:
            uniforms:
                u_base_mix_color: global.base_mix_color
            blocks:
                color: |
                    base_color.rgb = mix(base_color.rgb, u_base_mix_color.rgb, u_base_mix_color.a);

    # Opaque terrain-following ground plane, drawn below all map polygons (see layers.earth.ground).
    # With 3D terrain this is the surface of the terrain itself (the hillshade style is now translucent
    #  in 3D, blending shading over land cover polygons exactly as in 2D, so an opaque backdrop is
    #  needed to keep mountains from being see-through); in 2D it's a single flat quad per tile
    #  (RasterStyle uses a 1x1 grid without an ElevationManager) matching the scene background color,
    #  so it is effectively free and can stay enabled in both modes.
    terrain-ground:
        base: raster
        mix: [ global.terrain_3d_mixin, get-elevation ]
        raster: custom
        lighting: false

    hillshade:
        base: raster
        mix: [ global.terrain_3d_mixin, get-elevation ]
        raster: custom
        #texcoords: true
        blend: nonopaque
        # blend_order for translucent lines is -1001 for stylus-osm-dark
        blend_order: -1002
        shaders:
            defines:
                METRIC_UNITS: global.metric_units
                SHOW_CONTOURS: global.show_contours
                SHOW_HYPSOMETRIC: global.show_hypsometric
                # Hard compile-time cap on the Laplacian-pyramid loop for texture shading; the
                #  *effective* depth is the u_texture_shading_levels uniform (GUI slider), clamped to
                #  this. A mip level k box-filters roughly a 2^k x 2^k texel footprint of the mosaic,
                #  so deeper levels read well into the neighbor cells; that's fine now that (a)
                #  neighbor cells are patched with real tile data as prefetched neighbors arrive
                #  (RasterSource::patchNeighborMosaics - mirror-extrapolated cells are only a brief
                #  transient), and (b) the historical "kaleidoscope" artifact turned out to be
                #  getElevationAt() missing the mosaic UV remap (fixed in elevation.yaml), not deep
                #  mip levels.
                TEXTURE_SHADING_MAX_LEVELS: 8
            uniforms:
                u_exaggerate: 4.5
                u_contour_color: global.contour_color
                u_min_contour_elev: 0.0
                # band-weight exponent at high zoom (>= z13) / low zoom (<= z10.5); interpolated
                #  in between - see textureShading(). Low values emphasize broad landforms; 0.6
                #  reads much better than the old 2.0 default (which buried landform structure
                #  under fine texture noise) now that low-alpha tile seams are fixed by the
                #  blur-footprint cap in getElevationAtLod (elevation.yaml)
                u_texture_shading_alpha: 0.6
                u_texture_shading_alpha_min: 0.5
                # contrast multiplies a dimensionless slope-like value (see textureShading()), so
                #  its useful range is O(1) at any zoom level
                u_texture_shading_contrast: 1.0
                # auto-contrast factor, set per-frame by the app (MapsApp::mapUpdate) from the
                #  regional ruggedness statistic (RasterSource::aggregateRugosity) with slew
                #  limiting - NOT a gui variable; the contrast slider above multiplies on top
                u_texture_shading_auto: 1.0
                u_texture_shading_opacity: 0.7
                u_texture_shading_levels: 6
                u_texture_shading_scale: 1.25
                u_texture_shading_blend: 1.0
                # 2D->3D illumination morph knobs (docs/terrain-illumination-plan.md; only used
                #  when TANGRAM_TERRAIN_3D and the camera is tilted - see the color block):
                # overcast-sky vs. screen-anchored-sun balance of the oblique illumination
                u_sky_weight: 0.65
                u_sun_weight: 0.35
                # SVF-style occlusion proxy from the texture-shading pyramid: amplitude and
                #  valley-floor clamp
                u_occ_strength: 0.8
                u_occ_min: 0.55
                # translucent blend-over strength/gain of the oblique layer (2D uses 0.25 / 4.0)
                u_shade3d_alpha: 0.35
                u_shade3d_gain: 4.5
                # aerial perspective: fraction of shading contrast removed at full haze
                u_haze_contrast: 0.6
                # https://github.com/der-stefan/OpenTopoMap/blob/master/mapnik/relief_color_text_file.txt
                # - stop offset in meters/10000
                u_terrain_color: |
                    data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="51" height="1">
                      <defs>
                        <linearGradient id="grad" x1="0" x2="1.98">
                          <stop offset="0.0000" stop-color="rgb( 17, 120,   3)" />
                          <stop offset="0.0100" stop-color="rgb( 72, 162,  69)" />
                          <stop offset="0.0300" stop-color="rgb(231, 218, 158)" />
                          <stop offset="0.1500" stop-color="rgb(161,  67,   0)" />
                          <stop offset="0.3000" stop-color="rgb(130,  30,  30)" />
                          <stop offset="0.4000" stop-color="rgb(110, 110, 110)" />
                          <stop offset="0.5000" stop-color="rgb(255, 255, 255)" />
                          <stop offset="0.6000" stop-color="rgb(255, 255, 255)" />
                        </linearGradient>
                      </defs>
                      <rect x="0" y="0" width="51" height="1" fill="url(#grad)" />
                    </svg>

            blocks_disabled:
                # for testing
                color: |
                    vec2 uv = currentRasterUV(ELEVATION_INDEX);
                    if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0)
                      color = vec4(100.0*(uv.x - 1.0), 100.0*(0.0 - uv.x), 0.0, 1.0);  //discard;
                    else
                      discard;  //color = vec4(uv.x, uv.y, 0.0, 1.0);

            blocks:
                global: |
                    // Fragment-only: getElevationAtLod (elevation.yaml) is itself gated to fragment/
                    //  vertex-rasters stages, and TANGRAM_VERTEX_RASTERS is false for plain 2D hillshade,
                    //  so without this guard textureShading() would leak into the vertex shader (where
                    //  polygon.vs also has a `#pragma tangram: global` insertion point) and fail to link
                    //  (getElevationAtLod undefined there) even though it's only ever called from the
                    //  fragment-only "color" block below.
                    #if defined(ELEVATION_MOSAIC) && defined(TANGRAM_FRAGMENT_SHADER)
                    // Live, per-tile approximation of Leland Brown's texture shading (a scale-invariant,
                    //  fractional-Laplacian high-pass filter over elevation - see
                    //  docs/texture-shading-plan.md for background and the Frozen Interface Contract this
                    //  must match). Brown's own algorithm is a global offline FFT/DCT operation; here we
                    //  approximate it live by building a Laplacian/octave pyramid out of the real GPU
                    //  mipmap chain of the mosaic elevation texture (getElevationAtLod, elevation.yaml):
                    //  each octave band k is the bandpass difference between adjacent mip levels, weighted
                    //  by the geometrically-correct discretization 2^(-k*alpha) of Brown's |freq|^alpha
                    //  power-law filter, then squashed through Brown's closed-form contrast curve.
                    // Forward-declared: defined in elevation.yaml's get-elevation style (mixed into this
                    //  style). Block-merge order across mixed styles isn't guaranteed, so declare the
                    //  prototype here rather than rely on getElevationAtLod's definition coming first.
                    float getElevationAtLod(vec2 uv, float lod);
                    float textureShading(vec2 uv, float texelMeters) {
                        // anchor the pyramid to *continuous* view zoom, not the integer tile zoom:
                        //  the fractional base lod b rises 0 -> 1 as the view zooms in across one tile
                        //  zoom level (keeping each band's screen-space scale constant, via textureLod's
                        //  trilinear filtering), and drops back by exactly 1 when tiles swap to the next
                        //  zoom (u_tile_origin.w increments), so band k of the new tiles samples the
                        //  same physical scale band k+1 did a moment earlier - no jump in the shading at
                        //  tile-zoom transitions, and overzoomed tiles (tile zoom capped at the source's
                        //  max_zoom) degrade smoothly too.
                        // u_texture_shading_scale shifts the whole band range by (fractional) octaves:
                        //  positive = coarser (emphasize broad ridge/valley landforms, suppress fine
                        //  noise), negative = finer.
                        float b = max(0.0, u_map_position.z - u_tile_origin.w) + u_texture_shading_scale;
                        // zoom-dependent band-weight exponent: u_texture_shading_alpha applies fully
                        //  at view zoom >= 13 (fine ridge/gully detail dominates), easing down to
                        //  u_texture_shading_alpha_min at zoom <= 10.5 (broad landforms dominate when
                        //  a whole range is in view); linear in continuous zoom, so no visible steps
                        float ts_a = mix(u_texture_shading_alpha_min, u_texture_shading_alpha,
                                         clamp((u_map_position.z - 10.5) / 2.5, 0.0, 1.0));
                        float z = 0.0;
                        float h_prev = getElevationAtLod(uv, b);
                        for (int k = 0; k < TEXTURE_SHADING_MAX_LEVELS; k++) {
                            if (float(k) >= u_texture_shading_levels) { break; }
                            float h_next = getElevationAtLod(uv, b + float(k + 1));
                            // band k = LoD_k - LoD_(k+1), i.e. what mip level k+1's blur removes from level k
                            z += (h_prev - h_next) * pow(2.0, -float(k) * ts_a);
                            h_prev = h_next;
                        }
                        // normalize the band sum (meters) by the ground size of the base band's sampling
                        //  scale (texel spacing * 2^b, also continuous across tile-zoom swaps) to make it
                        //  a dimensionless, slope-like quantity, so u_texture_shading_contrast behaves
                        //  comparably at any zoom instead of multiplying raw meters (whose magnitude per
                        //  band scales with the ground size of a texel)
                        float az = u_texture_shading_contrast * u_texture_shading_auto * z / (texelMeters * exp2(b));
                        return az / (2.0*sqrt(1.0 + az*az)) + 0.5;
                    }
                    #endif
                normal: |
                    // Using 9 texel patch, estimate 1st and 2nd deriv to smooth elevation and normal
                    vec2 st = currentRasterUV(ELEVATION_INDEX);
                    vec2 texwh = rasterPixelSize(ELEVATION_INDEX);
                    #ifdef ELEVATION_MOSAIC
                    // rasterPixelSize reports the full 3Wp x 3Wp mosaic (Wp = W - overlap, the shared
                    //  line dropped per cell - see elevation.yaml); all the tile-local texel math below
                    //  (texel centers, finite-difference offsets, meters-per-texel) wants the tile's
                    //  own sample count W. getElevationAt() itself does the mosaic UV remap.
                    texwh = texwh / 3.0 + float(ELEVATION_TILE_OVERLAP);
                    #endif
                    vec2 duv = 1./texwh;
                    vec2 ij = st * texwh;
                    // this fixes seams on raster tiles, but adds seams in polygons!
                    //if(ij.x < -0.5 || ij.x > texwh.x+0.5 || ij.y < -0.5 || ij.y > texwh.y+0.5)
                    //  discard;
                    vec2 cen_ij = floor(ij) + 0.5;
                    vec2 uv = cen_ij*duv;
                    float h00 = getElevationAt(uv - duv);
                    float h01 = getElevationAt(uv + vec2(-duv.x, 0.));
                    float h02 = getElevationAt(uv + vec2(-duv.x, duv.y));
                    float h10 = getElevationAt(uv + vec2(0., -duv.y));
                    float h11 = getElevationAt(uv);
                    float h12 = getElevationAt(uv + vec2(0., duv.y));
                    float h20 = getElevationAt(uv + vec2(duv.x, -duv.y));
                    float h21 = getElevationAt(uv + vec2(duv.x, 0.));
                    float h22 = getElevationAt(uv + duv);
                    #ifndef ELEVATION_MOSAIC
                    // handle edge of tile by extrapolating (with a mosaic, real neighbor-tile data
                    //  exists beyond the tile edge, so the out-of-range samples above are valid)
                    bvec2 bot = lessThan(cen_ij, vec2(1.));
                    bvec2 top = greaterThan(cen_ij + 1., texwh);
                    if(bot.x) { h00 = 2.*h10 - h20; h01 = 2.*h11 - h21; h02 = 2.*h12 - h22; }
                    if(top.x) { h20 = 2.*h10 - h00; h21 = 2.*h11 - h01; h22 = 2.*h12 - h02; }
                    if(bot.y) { h00 = 2.*h01 - h02; h10 = 2.*h11 - h12; h20 = 2.*h21 - h22; }
                    if(top.y) { h02 = 2.*h01 - h00; h12 = 2.*h11 - h10; h22 = 2.*h21 - h20; }
                    #endif
                    // proj meters per elevation tile pixel; note u_tile_origin.w is tile data zoom,
                    //  u_tile_origin.z is tile styling zoom, u_map_position.z is view zoom (float)
                    vec2 dxy_elev = 2.*3.141592*6378137.0*exp2(-u_tile_origin.w)*duv/u_raster_offsets[ELEVATION_INDEX].z;
                    // convert projected meters to actual meters - Mercator scale factor is cos(latitude); we recover
                    //  latitude from Mercator y (projected meters): lat = 2*atan(exp(y/R)) - M_PI/2;
                    float unproj = exp(u_map_position.y/6378137.0);
                    float coslat = 2.0/(unproj + 1.0/unproj);
                    // offset from pixel center
                    vec2 f = ij - cen_ij;
                    // 2nd order finite diff - mixed partials needed to (almost) eliminate hillshading pixelation
                    float ddxy = (h22 - h20 - h02 + h00)/4.;
                    mat2 curv = mat2(h21 - 2.*h11 + h01, ddxy, ddxy, h12 - 2.*h11 + h10);
                    // interpolated slope and elevation
                    vec2 grad0 = vec2(h21 - h01, h12 - h10)/2.0;
                    vec2 grad = (grad0 + curv*f)/dxy_elev;
                    float elev = h11 + dot(f, grad0) + 0.5*dot(f, curv*f);  // 2nd order does help a bit w/ contour lines
                    // no underwater terrain for now
                    // (in texture-shading mode the Lambertian relief stays active too - its strength
                    //  is the existing u_exaggerate slider, texture shading blends over it in the
                    //  color block, so the two can be balanced against each other from the GUI)
                    float hscale = elev > 0. ? u_exaggerate : 0.;  // /pow(u_meters_per_pixel, 0.7)/65536.;
                    normal = normalize(vec3(-hscale*grad/coslat, 1.));
                    // slope from gradient calculated above
                    float slope = length(grad);
                    float slope_degs = atan(slope/coslat)*180.0/3.141592;
                    // setup base color - this could be moved to setup block
                    vec4 contour_color = u_contour_color;
                    // Screen-anchored 2D sun (docs/terrain-lighting-v2-plan.md, Phase 1). This is the
                    //  exact algebraic expansion of the old calculateLighting(v_position.xyz, normal,
                    //  vec4(1.0)) against light1 (zenith, direction (0,0,-1), 0.2 diffuse/0.35 ambient)
                    //  plus light2 (0.2/0.35) from the lights: section below - white material, no
                    //  specular - but with light2's direction now defined in CAMERA space and rotated to
                    //  world (s2_world = s2_cam * mat3(u_view), same camera->world pattern as s_cam/s_world
                    //  in the 3D block below) instead of being the raw yaml vector dotted directly against
                    //  this world-space normal. That mixup was the bug: with the default `origin: camera`,
                    //  tangram leaves the yaml direction untransformed, so light2 - meant to read as
                    //  "upper-left of the screen" - was actually interpreted in world space, i.e. fixed NW
                    //  in the world and rotating with the terrain instead of staying screen-anchored.
                    //  s2_cam = normalize(-1,1,1) is upper-left of the SCREEN at 35.26 deg elevation -
                    //  pixel-identical to the old light2 at north-up rotation (camera axes coincide with
                    //  world axes there), and correctly screen-fixed under any other rotation. Computed
                    //  here, before the ELEVATION_INDEX split, so raw2d is in scope for both the
                    //  blend-over branch immediately below and the raster-basemap branch in the color
                    //  block (normal block runs before color block in the same fragment shader).
                    vec3 s2_cam = normalize(vec3(-1.0, 1.0, 1.0));
                    vec3 s2_world = s2_cam * mat3(u_view);
                    float raw2d = 0.7 + 0.2*clamp(normal.z, 0.0, 1.0)
                                      + 0.2*clamp(dot(normal, s2_world), 0.0, 1.0);
                    #if ELEVATION_INDEX
                    vec4 base_color = sampleRaster(0);
                    #else
                    // Standalone hillshade over a vector base map: translucent shading blended over the
                    //  polygons below, in 3D exactly as in 2D (the opaque terrain surface behind the
                    //  polygons is provided by the terrain-ground style / layers.earth draw rule, so
                    //  land cover coloring stays visible in both modes).
                    #define HILLSHADE_BLEND_OVER
                    vec4 shading = vec4(vec3(clamp(raw2d, 0.0, 1.0)), 1.0);
                    vec4 base_color = vec4(0.0, 0.0, 0.0, 0.0);  //v_color;
                    contour_color = shading*contour_color;
                    #endif
                    // With 3D terrain, shading MORPHS with camera tilt instead of fading out
                    //  (docs/terrain-illumination-plan.md): tilt_morph is 0 at zenith (the output is
                    //  then exactly the 2D cartographic look) and reaches 1 by 45 deg tilt, where the
                    //  oblique illumination model built in the color block (CIE-overcast sky x
                    //  pyramid-based occlusion + soft screen-anchored sun, with aerial-perspective
                    //  contrast attenuation) fully replaces it. Shading is the primary shape-from-X
                    //  cue - simply fading it out left tilted terrain flat and unreadable.
                    //  u_view[2][2] = cos(camera pitch), cf. fog in terrain-3d.yaml.
                    #if defined(TANGRAM_TERRAIN_3D) && defined(HILLSHADE_BLEND_OVER)
                    float tilt_morph = smoothstep(0.0, radians(45.0), acos(clamp(u_view[2][2], 0.0, 1.0)));
                    #endif
                color: |
                    #ifdef SHOW_CONTOURS
                    float z = u_map_position.z;
                    //float s = u_tile_origin.z; -- looks better to use same contour interval for entire scene
                    if(z < 10.) {
                    #ifdef SHOW_HYPSOMETRIC
                        // terrain colormap (i.e., map height to color) for low zooms
                        // we subtract min elev because white coloring (above 4000m) not visible on white base map
                        vec4 relief = texture2D(u_terrain_color, vec2((elev - u_min_contour_elev)/5000., 0.5));
                        if(u_min_contour_elev <= 0.0 || elev >= u_min_contour_elev)
                          base_color = mix(base_color, vec4(relief.rgb, 0.75), 1.0/(1.0 + base_color.a));
                    #endif
                    } else {
                        // contour lines
                        // spacing between contour lines in meters - 10m has too many artifacts
                    #ifdef METRIC_UNITS
                        float interval = z >= 14. ? 25. : z >= 12. ? 50. : 100.;
                        float coarse = z >= 14. ? 100. : z >= 12. ? 200. : 500.;
                    #else
                        float interval = (z >= 14. ? 100. : z >= 12. ? 200. : 500.)/3.28084;
                        float coarse = (z >= 14. ? 500. : z >= 12. ? 1000. : 2000.)/3.28084;
                    #endif
                        //float zstep = z >= 14.0 ? 14.0 : z >= 12.0 ? 12.0 : 10.0;
                        // contour line half width in pixels
                        float linehw = 0.35;  //mix(0.3, 0.5, clamp(0.5*(z - zstep), 0., 1.));
                    #ifdef TANGRAM_TERRAIN_3D
                        //linehw *= 0.01/(1.0 - gl_FragCoord.z);  // reduce variation of line width with depth
                        linehw *= 1.25;
                        elev = mix(elev, v_world_position.z, clamp(5.0*abs(elev - v_world_position.z)/interval, 0., 1.));
                        float px_per_elev = 1./fwidth(v_world_position.z);
                    #else
                        float px_per_elev = 1./(slope * u_meters_per_pixel);
                    #endif
                        // no underwater contour lines!
                        float hc = max(elev, u_min_contour_elev + interval/2.);
                        // distance in pixels to nearest contour lines (above and below)
                        float dup = fract(hc/interval)*interval * px_per_elev;
                        float ddn = abs(1. - fract(hc/interval))*interval * px_per_elev;
                        // contour line pixel coverage
                        float cov = max(0.5 - dup + linehw, 0.) + max(0.5 - ddn + linehw, 0.);
                        // coarse lines
                        float coarsehw = 2.*linehw;  //0.75;
                        dup = fract(hc/coarse)*coarse * px_per_elev;
                        ddn = abs(1. - fract(hc/coarse))*coarse * px_per_elev;
                        cov += max(0.5 - dup + coarsehw, 0.) + max(0.5 - ddn + coarsehw, 0.);
                        base_color = mix(base_color, contour_color, min(cov, 1.));
                    }
                    #endif
                    // apply lighting to get final color
                    #ifdef HILLSHADE_BLEND_OVER
                    // for blending over background and opaque polygons; scale by 1/(1-light_accumulator_ambient) instead?
                    // contours/hypsometric tint (in base_color) composite over the shading and are
                    //  tilt-independent; in 3D this whole 2D-look layer is morphed toward the oblique
                    //  illumination below with tilt_morph
                    // combined ambient+diffuse from light1+light2 (below) can reach ~1.05, not just
                    //  1.0, on facets tilted toward both directions at once (common on near-vertical,
                    //  DEM-noise-amplified cliffs at u_exaggerate=4.5); soft-clip the excess above the
                    //  nominal max instead of letting it hard-clip to solid white, which otherwise
                    //  flattens whole patches of steep terrain into a featureless white blotch
                    //  ("white patches" on Dolomite/Alps spires - docs/terrain-illumination-plan.md)
                    vec3 sh = shading.rgb;
                    vec3 over = max(sh - 0.95, 0.0);
                    sh -= over - over/(1.0 + 3.0*over);
                    color = vec4(4.0*sh - 3.0, 0.25);
                    color = mix(color, base_color, base_color.a);
                    #else
                    // Hillshade over a raster base map (e.g. satellite imagery): same explicit
                    //  screen-anchored 2D formula as the blend-over branch above, applied to a white
                    //  material - i.e. shading * base_color, exactly what
                    //  calculateLighting(v_position.xyz, normal, base_color) reduced to before. raw2d
                    //  was computed once in the normal block (in scope here - see comment there).
                    color = vec4(clamp(raw2d, 0.0, 1.0) * base_color.rgb, 1.0);
                    #endif
                    #ifdef ELEVATION_MOSAIC
                    // texture shading (docs/texture-shading-plan.md) applied to the FINAL color, after
                    //  Lambertian lighting/contours, so it composes identically over every base_color
                    //  branch (raster / 3D-terrain / 2D blend-over) and can be balanced against the
                    //  normal hillshade (whose strength stays on the u_exaggerate slider):
                    //  - ts_shade: 0.5 = neutral, < 0.5 valleys/canyons, > 0.5 ridges
                    //  - ts_w: blend weight, ~0 on flat/neutral ground (so texture shading only touches
                    //    real relief structure, never washes flat areas), scaled by the opacity slider
                    //  - u_texture_shading_blend selects the compositing mode, continuously:
                    //    0 = "tint": mix color toward the gray shade value (strong standalone
                    //        texture-shading look, but desaturates/washes the base),
                    //    1 = "multiply": scale the existing color by 2*ts_shade (darkens valleys,
                    //        brightens ridges, preserving the base hillshade's own 3D effect)
                    // dxy_elev/coslat = true meters per elevation texel (from the normal block above)
                    float ts_shade = textureShading(currentRasterUV(ELEVATION_INDEX), 0.5*(dxy_elev.x + dxy_elev.y)/coslat);
                    // (in 3D the screen-space ts tint/multiply below fades with tilt automatically via
                    //  the tilt_morph mix at the end - but ts_shade itself lives on at all tilts as the
                    //  occlusion proxy of the oblique illumination, so prominence highlighting never
                    //  disappears)
                    float ts_op = u_texture_shading_opacity;
                    float ts_w = abs(ts_shade - 0.5) * 2.0 * ts_op;
                    vec3 ts_tint = mix(color.rgb, vec3(ts_shade), ts_w);
                    vec3 ts_mult = color.rgb * mix(1.0, 2.0*ts_shade, ts_op);
                    color.rgb = mix(ts_tint, ts_mult, u_texture_shading_blend);
                    #ifdef HILLSHADE_BLEND_OVER
                    // in 2D blend-over mode the hillshade layer composites over the basemap with its own
                    //  alpha; make sure texture-shaded relief also shows through where the layer would
                    //  otherwise be nearly transparent
                    color.a = max(color.a, ts_w);
                    #endif
                    #endif
                    #if defined(TANGRAM_TERRAIN_3D) && defined(HILLSHADE_BLEND_OVER)
                    // Oblique illumination for tilted 3D views (docs/terrain-illumination-plan.md),
                    //  blended in with tilt_morph (normal block; == 0 at zenith, so the zenith render
                    //  stays bit-identical to the 2D cartographic look above). Three ingredients:
                    //  1. CIE-overcast sky irradiance (zenith 3x brighter than horizon): depends only
                    //     on normal.z, so it is azimuth-free and cannot invert under rotation.
                    //  2. Occlusion proxy: Brown's texture shading is a multiscale curvature operator -
                    //     ridges (ts_shade > 0.5) see more sky, canyons less - i.e. a cheap sky-view
                    //     factor already computed per fragment; it multiplies the sky term.
                    //  3. Soft screen-anchored sun (upper-left of the SCREEN, like light2 of the 2D
                    //     look): keeps the top-left light convention under any rotation - no relief
                    //     inversion - with half-Lambert wrap so back slopes stay readable.
                    //  Aerial perspective: distance haze (same formula as the fog in terrain-3d.yaml,
                    //  computed here because the fog filter block runs after color) attenuates shading
                    //  contrast per-fragment, layering near-crisp / far-flat depth.
                    // note v_position.z < 0; u_view[3][2] = -(distance from eye to map center).
                    //  The 8x density makes shading contrast fall off much faster than the color fog:
                    //  with the default u_fog_density (0.1) the color fog only reaches ~0.1-0.2 at the
                    //  most distant terrain, which is right for color but imperceptible as a contrast
                    //  change - and aerial perspective flattens contrast well before it whitens hues
                    //  (Imhof's luftperspektive; measured on the Howe Sound 60-deg test view).
                    float haze = 1.0 - clamp(exp(8.0 * u_fog_density * v_position.z/(-u_view[3][2])/(u_view[2][2] + 0.5)), 0.0, 1.0);
                    #ifdef ELEVATION_MOSAIC
                    float occ = clamp(1.0 + u_occ_strength * (2.0*ts_shade - 1.0), u_occ_min, 1.15);
                    occ = mix(occ, 1.0, u_haze_contrast * haze);
                    #else
                    const float occ = 1.0;
                    #endif
                    // CIE overcast: E(n) = (1 + 2 max(n.z,0))/3, normalized so flat ground = 1
                    float sky = (1.0 + 2.0*max(normal.z, 0.0)) / 3.0;
                    // sun fixed in camera space (upper-left of screen), transformed to world; clamp its
                    //  world elevation angle to [20,70] deg (preserving azimuth) so extreme tilts can't
                    //  drive it below the horizon (relief inversion) or to the zenith (no modeling)
                    vec3 s_cam = normalize(vec3(-0.5, 0.5, 0.707));
                    vec3 s_world = s_cam * mat3(u_view);  // = transpose(view rotation) * s_cam
                    float s_z = clamp(s_world.z, sin(radians(20.0)), sin(radians(70.0)));
                    s_world = vec3(s_world.xy * (sqrt(1.0 - s_z*s_z) / max(length(s_world.xy), 1e-4)), s_z);
                    // half-Lambert sun (wrap 0.4, exponent 1.5) so back slopes never clip to black
                    float sun = pow(clamp((dot(normal, s_world) + 0.4) / 1.4, 0.0, 1.0), 1.5);
                    // Normalize by the FIXED theoretical max of the numerator (sky<=1, occ<=1.15,
                    //  sun<=1, all by their own clamps above), not by flat ground's own sun exposure
                    //  as an earlier version did. A steep slope tilted TOWARD the (elevation-clamped)
                    //  sun can face it far more directly than flat ground ever can (flat ground's
                    //  n.s is capped at sin(sun elevation) <= sin(70deg), while a tilted facet's n.s
                    //  can reach 1), so normalizing against flat ground let L3 - and after
                    //  u_shade3d_gain, the final color - run past 1.0 and clip to solid white on
                    //  steep, sun-facing terrain (reported as "white patches" on Dolomite/Alps spires
                    //  - see docs/terrain-illumination-plan.md). Normalizing against the fixed max
                    //  instead bounds L3 in [0,1] for every normal/rotation by construction, so
                    //  color3d can never exceed 1.0 (pure white) regardless of slope or facing.
                    float L3 = (u_sky_weight * sky * occ + u_sun_weight * sun)
                             / max(u_sky_weight * 1.15 + u_sun_weight, 1e-3);
                    L3 = mix(L3, 1.0, u_haze_contrast * haze);
                    // composite as a translucent blend-over layer, same trick as the 2D 4*shading-3
                    vec4 color3d = vec4(vec3(u_shade3d_gain*L3 - (u_shade3d_gain - 1.0)), u_shade3d_alpha);
                    // contours/hypsometric tint stay tilt-independent
                    color3d = mix(color3d, base_color, base_color.a);
                    color = mix(color, color3d, tilt_morph);
                    #endif
                    // prevent duplicate call to calculateLighting()
                    #undef TANGRAM_LIGHTING_FRAGMENT


lights:
    #point1: { type: point, position: [0, 0, 200px], origin: ground }
    #light1: { type: directional, direction: [1, 1, -.9], diffuse: 0.8, ambient: 0.3 }
    #light1: { type: directional, origin: world, direction: [1, 1, -1], diffuse: 0.3, ambient: 0.7 }
    # single light - use exaggeration ~ 1.5
    # - w/ 'origin: world', lighting changes as camera is rotated
    #light1: { type: directional, origin: world, direction: [1, -1, -1], diffuse: 0.4, ambient: 0.7 }
    # Google Terrain style lighting, where flat areas are brighter than slopes - use exaggeration ~ 4
    light1: { type: directional, direction: [0, 0, -1], diffuse: 0.2, ambient: 0.35 }
    light2: { type: directional, direction: [1, -1, -1], diffuse: 0.2, ambient: 0.35 }


#scene: { background: { color: '#E0E0E0' } }  -- default now set in markers.yaml

layers:
    earth:
        enabled: false  # enabled by update from mapsources.yaml entry (only for vector base map)
        data: { source: elevation }
        draw:
            hillshade: { color: global.earth_color, order: global.earth_order }
            # opaque terrain surface below all polygons (landuse starts at order 510); the hillshade
            #  rule above blends shading over land cover / landuse polygons from its order (599) above
            #  them, identically in 2D and 3D - see the terrain-ground style
            terrain-ground: { color: global.earth_color, order: 50 }

    contour-labels:
        data: { source: elevation }
        filter: { $zoom: { min: 12 } }
        enabled: global.show_contours
        draw:
            text:
                style: contour-labels
                #priority: global.priority.contour_label
                # auto forces text to always be oriented uphill, even if upside down on screen
                angle: auto
                # text_source: units will append units (m or ft) to label
                #text_source: units
                repeat_distance: 200px
                font:
                    family: global.primary_font
                    style: italic
                    size: 9.33px
                    fill: global.color.default_label
                    stroke: { color: global.color.default_halo, width: 2 }

    #contour-debug:
    #    data: { source: elevation }
    #    filter: { $zoom: { min: 12 } }
    #    enabled: global.show_contours
    #    draw:
    #        lines:
    #            style: contour-debug
    #            color: red
    #            order: 0
