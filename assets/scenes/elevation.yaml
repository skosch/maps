# elevation.yaml

global:
    # Texture shading (docs/texture-shading-plan.md): when true, the elevation raster attached to
    #  each tile is a 3Wx3W "mosaic" texture (tile's own data centered in the middle third, 8
    #  same-zoom neighbor tiles tiled around it, real GPU mipmaps enabled - see the Frozen
    #  Interface Contract in that doc), scene.cpp enables neighbor prefetching + CPU-side mosaic
    #  stitching for the elevation source, and all ELEVATION_MOSAIC-gated shader code (below and
    #  in hillshade.yaml) compiles in. Default false = plain per-tile textures, classic Lambertian
    #  hillshading, zero mosaic overhead. The app toggles this via SceneUpdate from the
    #  "Texture shading" checkbox (see MapsApp::loadSceneFile).
    elevation_mosaic: false

sources:
    elevation:
        type: Raster
        filtering: nearest
        url: https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer/tile/{z}/{y}/{x}
        max_zoom: 16
        cache: elevation
        # 2 years
        max_age: 63072000
        attribution: |
            Maxar, Airbus DS, USGS, NGA, NASA, CGIAR, GEBCO, N Robinson, NCEAS, NLS, OS, NMA, Geodatastyrelsen and the GIS User Community
        #{ url: 'https://elevation-tiles-prod.s3.amazonaws.com/geotiff/{z}/{x}/{y}.tif', max_zoom: 14, zoom_offset: 1, cache: terrarium-tiff }


styles:
    get-elevation:
        raster: custom
        shaders:
            defines:
                ELEVATION_INDEX: 0
                # this doesn't work because TANGRAM_NUM_RASTER_SOURCES is fixed (at the max possible value) for all styles
                #ELEVATION_INDEX: '(TANGRAM_NUM_RASTER_SOURCES - 1)'
                ELEVATION_FLOAT_TEX: true
                # sampler2D default is lowp!
                TANGRAM_RASTER_PRECISION: 'highp'
                # see docs/texture-shading-plan.md Frozen Interface Contract - gates getElevationAtLod()
                #  below (and all texture-shading code in hillshade.yaml). Compiles out entirely (no
                #  crash, no silent degrade) when the elevation source isn't a mosaic texture.
                ELEVATION_MOSAIC: global.elevation_mosaic
            blocks:
                global: |
                    #if defined(TANGRAM_FRAGMENT_SHADER) || defined(TANGRAM_VERTEX_RASTERS)
                    vec4 sampleElevationTex(vec2 uv) {
                    #ifdef ELEVATION_MOSAIC
                        // The bound elevation raster is a 3Wx3W neighbor mosaic with the tile's own
                        //  data in the middle third (docs/texture-shading-plan.md Frozen Interface
                        //  Contract), so every tile-local UV must be remapped into the center cell.
                        //  Missing this remap was the root cause of the "kaleidoscope" artifact in the
                        //  Phase 4 findings: normals/contours were computed over the whole mosaic.
                        //  Explicit LOD 0 because the mosaic carries real mipmaps (for
                        //  getElevationAtLod below); implicit-LOD sampling would blur elevation reads
                        //  under minification, changing normal/contour behavior vs. the plain texture.
                        return textureLod(u_rasters[ELEVATION_INDEX], (uv + 1.0) / 3.0, 0.0);
                    #else
                        return texture2D(u_rasters[ELEVATION_INDEX], uv);
                    #endif
                    }
                    float getElevationAt(vec2 uv) {  // in meters  //TANGRAM_RASTER_PRECISION sampler2D tex,
                        vec4 h = sampleElevationTex(uv);
                    #ifdef ELEVATION_FLOAT_TEX
                        return h.r;
                    #else
                        return (h.r*256. + h.g + h.b/256.)*255. - 32768.;  // mapzen terrarium
                        //return (h.r*256.*256. + h.g*256. + h.b)*0.1 - 10000.;  // mapbox
                    #endif
                    }
                    float getElevation() { return getElevationAt(currentRasterUV(ELEVATION_INDEX)); }
                    #ifdef ELEVATION_MOSAIC
                    // u_rasters[ELEVATION_INDEX] is assumed to be a 3Wx3W "mosaic" texture per the Frozen
                    //  Interface Contract (docs/texture-shading-plan.md): tile's own WxW data centered in
                    //  the middle third [W,2W)x[W,2W), 8 same-zoom neighbor tiles tiled around it, uploaded
                    //  with generateMipmaps=true / minFilter=LINEAR_MIPMAP_LINEAR. textureLod's hardware mip
                    //  chain over this mosaic gives real (non-aliased) multi-scale low-pass elevation
                    //  samples, used by textureShading() in hillshade.yaml to build a Laplacian pyramid.
                    float getElevationAtLod(vec2 uv, float lod) {  // in meters; uv is tile-local [0,1]
                        vec2 muv = (uv + 1.0) / 3.0;
                        vec4 h = textureLod(u_rasters[ELEVATION_INDEX], muv, lod);
                    #ifdef ELEVATION_FLOAT_TEX
                        return h.r;
                    #else
                        return (h.r*256. + h.g + h.b/256.)*255. - 32768.;  // mapzen terrarium
                    #endif
                    }
                    #endif
                    #endif
