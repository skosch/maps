# elevation.yaml

global:
    # Texture shading (docs/texture-shading-plan.md): when true, the elevation raster attached to
    #  each tile is a 3Wx3W "mosaic" texture (tile's own data centered in the middle third, 8
    #  same-zoom neighbor tiles tiled around it, real GPU mipmaps enabled - see the Frozen
    #  Interface Contract in that doc), scene.cpp enables neighbor prefetching + CPU-side mosaic
    #  stitching for the elevation source, and all ELEVATION_MOSAIC-gated shader code (below and
    #  in hillshade.yaml) compiles in. Default false = plain per-tile textures, classic Lambertian
    #  hillshading, zero mosaic overhead. The app toggles this via SceneUpdate from the
    #  "Texture shading" checkbox (see MapsApp::loadSceneFile).
    elevation_mosaic: false
    # 1 for node-registered elevation tiles (odd size, e.g. 257x257: outermost row/col is
    #  shared with the adjacent tile - true of the arcgis source below), 0 for
    #  pixel-registered (even, e.g. 256x256 terrarium) tiles. Must match the source, since
    #  the mosaic drops the duplicated shared line per cell (cells are W - overlap wide) and
    #  the shader's mosaic UV remap needs the tile's true sample count W.
    elevation_tile_overlap: 1

sources:
    elevation:
        type: Raster
        filtering: nearest
        url: https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer/tile/{z}/{y}/{x}
        max_zoom: 16
        cache: elevation
        # 2 years
        max_age: 63072000
        attribution: |
            Maxar, Airbus DS, USGS, NGA, NASA, CGIAR, GEBCO, N Robinson, NCEAS, NLS, OS, NMA, Geodatastyrelsen and the GIS User Community
        #{ url: 'https://elevation-tiles-prod.s3.amazonaws.com/geotiff/{z}/{x}/{y}.tif', max_zoom: 14, zoom_offset: 1, cache: terrarium-tiff }


styles:
    get-elevation:
        raster: custom
        shaders:
            defines:
                ELEVATION_INDEX: 0
                # this doesn't work because TANGRAM_NUM_RASTER_SOURCES is fixed (at the max possible value) for all styles
                #ELEVATION_INDEX: '(TANGRAM_NUM_RASTER_SOURCES - 1)'
                ELEVATION_FLOAT_TEX: true
                # sampler2D default is lowp!
                TANGRAM_RASTER_PRECISION: 'highp'
                # see docs/texture-shading-plan.md Frozen Interface Contract - gates getElevationAtLod()
                #  below (and all texture-shading code in hillshade.yaml). Compiles out entirely (no
                #  crash, no silent degrade) when the elevation source isn't a mosaic texture.
                ELEVATION_MOSAIC: global.elevation_mosaic
                ELEVATION_TILE_OVERLAP: global.elevation_tile_overlap
            blocks:
                global: |
                    #if defined(TANGRAM_FRAGMENT_SHADER) || defined(TANGRAM_VERTEX_RASTERS)
                    #ifdef ELEVATION_MOSAIC
                    // The bound elevation raster is a 3Wp x 3Wp neighbor mosaic (Wp = W minus the
                    //  ELEVATION_TILE_OVERLAP shared line dropped per cell - see rasterSource.cpp)
                    //  with the tile's own data in the middle third, so every tile-local UV must be
                    //  remapped into the center cell. The tile's W samples at uv = (i + 0.5)/W land on
                    //  mosaic texel Wp + i (contiguous global sample grid), giving the remap below.
                    //  Missing this remap entirely was the root cause of the "kaleidoscope" artifact
                    //  in the Phase 4 findings: normals/contours were computed over the whole mosaic.
                    vec2 elevationMosaicUV(vec2 uv) {
                        vec2 msize = rasterPixelSize(ELEVATION_INDEX);  // 3 * Wp
                        vec2 Wp = msize / 3.0;
                        return (uv * (Wp + float(ELEVATION_TILE_OVERLAP)) + Wp) / msize;
                    }
                    #endif
                    vec4 sampleElevationTex(vec2 uv) {
                    #ifdef ELEVATION_MOSAIC
                        // Explicit LOD 0 because the mosaic carries real mipmaps (for
                        //  getElevationAtLod below); implicit-LOD sampling would blur elevation reads
                        //  under minification, changing normal/contour behavior vs. the plain texture.
                        return textureLod(u_rasters[ELEVATION_INDEX], elevationMosaicUV(uv), 0.0);
                    #else
                        return texture2D(u_rasters[ELEVATION_INDEX], uv);
                    #endif
                    }
                    float getElevationAt(vec2 uv) {  // in meters  //TANGRAM_RASTER_PRECISION sampler2D tex,
                        vec4 h = sampleElevationTex(uv);
                    #ifdef ELEVATION_FLOAT_TEX
                        return h.r;
                    #else
                        return (h.r*256. + h.g + h.b/256.)*255. - 32768.;  // mapzen terrarium
                        //return (h.r*256.*256. + h.g*256. + h.b)*0.1 - 10000.;  // mapbox
                    #endif
                    }
                    float getElevation() { return getElevationAt(currentRasterUV(ELEVATION_INDEX)); }
                    #ifdef ELEVATION_MOSAIC
                    // u_rasters[ELEVATION_INDEX] is assumed to be a 3Wp x 3Wp "mosaic" texture per the
                    //  Frozen Interface Contract (docs/texture-shading-plan.md): tile's own data centered
                    //  in the middle third, 8 same-zoom neighbor tiles tiled around it, uploaded with
                    //  generateMipmaps=true / minFilter=LINEAR_MIPMAP_LINEAR. textureLod's hardware mip
                    //  chain over this mosaic gives real (non-aliased) multi-scale low-pass elevation
                    //  samples, used by textureShading() in hillshade.yaml to build a Laplacian pyramid.
                    float getElevationAtLod(vec2 uv, float lod) {  // in meters; uv is tile-local [0,1]
                        // Cap the blur footprint at ~one tile width: adjacent tiles' mosaics are built
                        //  independently and share only 2 of their 3 cell columns/rows, so once a
                        //  bilinear mip sample's footprint (~1.5 * 2^lod texels) reaches past the
                        //  one-tile neighbor ring, the two tiles integrate over different data at the
                        //  same world point and their shading disagrees -> visible tile seams (worst at
                        //  low alpha, which weights the deepest bands most). Capping lod so the
                        //  footprint stays within +/- Wp of any pixel of the center tile keeps every
                        //  band consistent across the shared edge; deeper bands then difference to zero
                        //  in textureShading()'s pyramid, smoothly fading out instead of seaming.
                        //  log2(1.5) ~ 0.585; Wp = rasterPixelSize/3 (see elevationMosaicUV above).
                        float maxLod = log2(rasterPixelSize(ELEVATION_INDEX).x / 3.0) - 0.585;
                        vec4 h = textureLod(u_rasters[ELEVATION_INDEX], elevationMosaicUV(uv), min(lod, maxLod));
                    #ifdef ELEVATION_FLOAT_TEX
                        return h.r;
                    #else
                        return (h.r*256. + h.g + h.b/256.)*255. - 32768.;  // mapzen terrarium
                    #endif
                    }
                    #endif
                    #endif
