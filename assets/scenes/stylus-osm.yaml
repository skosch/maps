sources:
  osm:
    type: MVT
    url: http://tiles.styluslabs.com:8080/v1/{z}/{x}/{y}
    headers: { "X-Hide-Encoding": "yes" } # don't set Content-Encoding so we can write gzipped tile directly to cache
    cache: stylus-osm
    attribution: |
      © OpenStreetMap contributors
    max_zoom: 14
    rasters: global.elevation_sources
    # How eagerly landcover/geometry drops to a coarser cached zoom while zooming out (see
    #  TileSource::lodAreaBias's doc comment) - 1.0 was the original default; raised to 4.0
    #  (2026-07-29) since the grazing-tilt LOD investigation found the area threshold needs a
    #  much bigger retention margin to keep steep terrain detailed under tilt. Live-adjustable
    #  via the resolution-retention GUI slider (MapsApp).
    zoom_retention: 4.0

  # Same tile server and tiles as `osm` above, used only for the `peaks` layer. The server
  #  emits mountain_peak from z11 only, but `osm` hands out coarser tiles as distance grows
  #  (zoom_retention picks them by on-screen area), so the far half of a tilted view had no
  #  peaks at all. Here max_zoom 11 + a large zoom_retention makes every visible tile (down to
  #  ~16 px wide on screen) resolve to z11, regardless of distance. No `rasters`: label
  #  elevations come from whichever DEM tile is already resident (see LabelManager), so far
  #  vector tiles don't each pull their own z11 DEM tile. Own cache file - two MBTiles
  #  writers on one file would collide.
  osm-peaks:
    type: MVT
    url: http://tiles.styluslabs.com:8080/v1/{z}/{x}/{y}
    headers: { "X-Hide-Encoding": "yes" }
    cache: stylus-osm-peaks
    attribution: |
      © OpenStreetMap contributors
    max_zoom: 11
    min_data_zoom: 11   # see TileSource::ZoomOptions::minDataZoom: no distance-based coarsening
    # decode only the poi layer: these are full tiles (every road/landcover/building), and
    #  with one z11 tile per ~15 km out to the horizon the decode cost is the loading time.
    #  Side effect: no anchor-occupancy grid for these tiles (it is built from water/road
    #  layers), so peak labels no longer steer away from lakes/trails - only from ridges.
    mvt_layers: [poi]
    zoom_retention: 32.0

  # Same tiles again, for AREA LABELS (lakes, glaciers, parks, reserves) and their debug
  #  outlines. Capped at z11 so a feature is built from one tile fragment of ~13 km instead
  #  of whatever 256 px tile happens to be loaded at the view zoom (docs/label-typography.md,
  #  "Round 5"). Checked against the cached tiles: z11 still carries lakes down to ~25,000 m2,
  #  glaciers, nature reserves and parks. Own cache file (two MBTiles writers on one file collide).
  osm-areas:
    type: MVT
    url: http://tiles.styluslabs.com:8080/v1/{z}/{x}/{y}
    headers: { "X-Hide-Encoding": "yes" }
    cache: stylus-osm-areas
    attribution: |
      © OpenStreetMap contributors
    max_zoom: 11
    mvt_layers: [landuse, water]
    zoom_retention: 4.0

