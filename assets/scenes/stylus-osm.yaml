# adaption of tangram default scene.yaml to Stylus Labs vector tile schema
# - OpenMapTiles schema omits some important information, unnecessarily groups OSM tags, uses too many layers
#  resulting in larger tiles due to duplicated data, etc.; Shortbread schema has even more layers
# - don't seem to be many services using mapzen schema (except HERE)
# - mapzen walkabout style is nice, but way too big - nearly 10K lines
# - no one uses mapbox schema except mapbox?
# - trying to create scene file that works for multiple schema isn't practical (either w/ globals or stacking yaml files)

global:
  #camera_settings: { type: isometric, axis: [-.2, .2] }
  camera_settings: { type: perspective }
  # globals required for hillshading
  earth_style: unlit-polygons
  # Darkening round (2026-08-23, Sebastian: "mountains are too light"): #E0E0E0 -> here;
  #  trajectory so far [#F7F3F0 -> #F0EBEB -> #E0E0E0 -> this]. Bare unclassified ground is
  #  most of every mountain flank that carries no land-cover polygon, so its lightness sets
  #  the floor for the whole range's read. Also scene background / hillshade terrain-ground.
  earth_color: "#D3CEC4"
  earth_order: 599 # should be above all other polygons
  # forest-trees = painted trees in the forest polygons (docs/tree-rendering-plan.md; u_tree_mode 0 = the cheap
  #  painterly canopy only); unlit-polygons = the old flat fill
  forest_style: forest-trees
  #elevation_sources: []
  marker_font: U001 #IBM Plex Sans
  # LABEL TYPOGRAPHY (docs/label-typography.md). One superfamily, IBM Plex Sans, used in two
  #  widths: normal (primary_font / natural_font) for settlements, regions and area names,
  #  and Condensed (condensed_font) wherever space is tight or the feature is thin and
  #  vertical: peaks, roads, trails, hamlets. Hierarchy is carried by weight (300 light ->
  #  600 semibold), case, tracking (font: letter_spacing, in em) and colour -- not by
  #  switching families. Imhof's rules are followed where they survive the switch to one
  #  family: upright for relief and settlements, italic ONLY for water and ice, tracked
  #  capitals for things that are big and diffuse (ranges, regions, parks), tight sentence
  #  case for things that are small and precise (peaks, hamlets).
  primary_font: U001 #IBM Plex Sans
  natural_font: U001 #IBM Plex Sans
  condensed_font: U001Con #IBM Plex Sans Condensed
  # Glacier names: until the tile server writes `name` onto the glacier POLYGON (see
  # scripts/tilemaker/process.lua), glaciers are labelled at their centroid point. After
  # regenerating tiles, flip these two so glaciers get area labels inside their ice.
  glacier_point_labels: false
  glacier_polygon_labels: true
  # Outline every area feature that gets (or should get) a name label, from the same tiles
  #  the label planner sees. Tile-edge cuts show up as straight lines. Debug aid.
  debug_area_outlines: false
  # World-space area labels (docs/label-typography.md, "Round 6"): lake and glacier names are
  #  planned from whole features stitched across tiles (osm-areas source -> AreaRegistry ->
  #  AreaLabelManager markers) instead of per tile fragment. Off = the per-tile planner again.
  world_area_labels: true
  # Draw each planned part's spine (magenta/cyan/yellow...) and the necks that split parts (red circles).
  debug_area_parts: false
  # protected-area edge band: park-edge-fade (soft gradient) or park-edge-hatch (diagonal hatching)
  park_edge_style: park-edge-fade
  bold_weight: 600 # use instead of "bold" to avoid checking for OS font if we only have semibold

  # docs/label-placement-plan.md Task 3 (revised 2026-07-15): peak label SALIENCE (does this
  # peak look spiky/prominent from far away) is decided entirely by texture shading, never
  # by elevation -- see priority: on the peak draw rule for the actual ranking mechanism.
  # This value is a completely different thing: a CANDIDACY floor, existing only to bound
  # how many below-z12 peak candidates get built per tile (every real peak on Earth would
  # otherwise qualify, including countless unremarkable OSM nodes) -- not a claim that
  # taller peaks are more salient. The peak filter's z12 visibility gate can only be
  # exempted by signals available synchronously at tile-build time (real OSM `prominence`/
  # `wikipedia` tags, or this floor); the CPU texture-shading prominence proxy doesn't exist
  # yet at that point (see textureShading.h's threading note), so it structurally cannot
  # gate candidacy -- only ranking, later, once a peak already IS a candidate. Set low
  # deliberately (most named summits worldwide clear it) so it essentially never excludes a
  # real candidate; tuned for candidate-pool size/performance, not for "quality," and
  # exposed live via gui_variables (App menu > Map Variables) for exactly that reason.
  peak_candidacy_ele_floor: 500

  # 2026-10-13: distance-aware peak density. A peak is labeled only while the radius within
  # which it is the highest point (measured on the DEM; Label::Options::dominanceGate) is at
  # least this fraction of its distance from the camera. Near you: nearly every named summit.
  # Mid-distance: the ones that stand out from their surroundings. On the horizon: only the
  # dominant massifs. Raise it for sparser labels, lower it for more.
  peak_dominance_gate: 0.08
  # Anonymous OSM elevation nodes (no name): not shown unless this is true.
  peak_show_unnamed: false

  # HSL: 0 (== 360) is red, 120 is green, 240 is blue
  color:
    selected: red
    default_label: black
    default_halo: white
    landuse: honeydew
    parks: hsl(96, 40%, 79%)
    parks_border: hsl(135, 63%, 41%)
    park_edge_line: hsl(135, 36%, 28%)
    park_edge_band: hsl(135, 24%, 34%)
    # same family as uniforms of the park-edge styles (land line, water band, water line); hex for shader
    park_edge_line_u: '#2e613b'
    park_edge_water_band_u: '#41739f'
    park_edge_water_line_u: '#2a5a84'
    forest: hsl(112, 16%, 52%) # conifer: dark and desaturated, not meadow
    scrub: hsl(82, 32%, 77%) # lighter
    farmland: hsl(64, 42%, 78%) # decr hue -> more yellow
    grass: hsl(86, 40%, 73%)
    wetland: hsl(135, 24%, 74%) # incr hue -> more blue
    park_detail: hsl(134.5, 21%, 72%)
    golf: hsl(124, 83%, 88%) #'#C8FACC'
    industry: "#C0CDCD"
    retail: "#FEF0D0"
    civic: "#D9CFC3"
    military: "#EADCD7"
    water: "#86bbdb" # == hsl(205, 50%, 74%) (compare ferry color)
    # dark-blue "as is tradition" for water labels (was muted teal #51909c).
    # candidates (pick by eye against actual water fill #9dc3de):
    #   #1a3c5e - deep navy/slate, most subdued, closest to "ink" blue
    #   #2b4c7e - richer indigo-blue, good legibility/tradition balance (ACTIVE)
    #   #1f4e79 - classic saturated cartographic navy (USGS-topo-ish), most assertive
    water_name: "#124d7d"
    water_halo: "#e6f1f6"
    water_tunnel: hsl(205, 72%, 86%)
    glacier_name: "#174f80"
    glacier_halo: "#f3f9fb"
    # Terrain labels are warm umber, not neutral grey/black: the relief under them is warm
    #  grey-beige rock, scree and bare earth (earth_color, rock, scree), and ink that shares
    #  the hue of the ground it sits on reads as printed on the map, not floating over it.
    #  Lightness steps carry the hierarchy: peak names darkest (the main thing to read),
    #  elevations a step lighter, ranges and valleys lighter still and relying on size and
    #  tracking to be seen.
    peak_name: "#241b13"
    peak_elevation: "#46372a"
    peak_halo: white
    range_name: "#5b4636"
    range_halo: "#f3efe6"
    valley_name: "#64563f"
    valley_halo: "#f1ede2"
    spring: hsl(210, 100%, 45%)
    hot_spring: orange
    beach: "#FEEFC3" #[1.000,0.953,0.900]
    ice: "#DDECEC"
    # Darkening rounds (2026-08-23, Sebastian: "mountains are too light", then "rock is
    #  not dark enough" after round 1): rock E1D9D1 -> C2B8AB -> A09584, rock_shadow
    #  A69C8E -> 877E6F -> 6E6555; scree F5F0E5 -> DCD4C3 (round 1 only - scoped to rock
    #  in round 2). Ice/glacier deliberately untouched - the lightness there is the
    #  point. rock_shadow keeps ~the same ratio under the new rock so gully weathering
    #  stays a step darker, not flatter.
    rock: "#B4AB9C"
    # rock-texture-v2 (docs/rock-texture-v2-plan.md): weathered/damp rock in gullies and
    #  concave microsites, and a muted lichen/moss crust accent common on exposed alpine
    #  rock worldwide regardless of geology - see styles.rock-texture's color block.
    rock_shadow: "#756C66"
    rock_lichen: "#9B9457"
    scree: "#E2D9CA"
    road: "#fff"
    casing_16: "#999"
    casing_18: "#aaa"
    tunnel: "#E3E3E3"
    tunnel_casing: "#A0A0A0"
    oneway_arrow: "#888"
    motorway: "#FDE293"
    motorway_tunnel: "#CDB775"
    motorway_link: "#FDE293" #'#aaa'
    motorway_muted: "#eee"
    path: "#fff"
    unpaved_trail: "#B50F0F"
    scramble_trail: "#FFA500"
    bike_lane: "#008800"
    bike_path: "#004C00"
    bike_unpaved: "#306000"
    transit: "#EB322F"
    rail: "#96ABB2" #[0.588,0.671,0.698]
    rail_tunnel: "#A9C3CB"
    dashed_rail_core: "#E6E9EC" #white
    dashed_rail: "#919BA4" #'#555555'
    service_rail: "#B1BBC4" #'#999999'
    dashed_rail_tunnel: "#A1ABB4" #'#777777'
    pier: "#F2EFE9" #[0.993,0.993,0.993]
    breakwater: "#AAAAAA"
    ferry: hsl(205, 42%, 62%) #'#8db3ce'
    runway_13: "#C7CADC" #'#FFE4B5'
    taxiway: "#BCBCCC"
    airport: "#E0E5F3" #'#E8EAEF'
    airport_name: "#487585"
    shield: "#FFFFFF"
    motorway_shield: "#FFDC36"
    hike_shield: hsl(33, 81%, 64%)
    bike_shield: hsl(120, 70%, 70%)
    road_name: "#666"
    road_halo: white
    ferry_name: hsl(205, 42%, 62%) #'#8db3ce'
    ferry_halo: white
    border: "#888" #wheat
    border_country: "#666" #[0.824, 0.651, 0.329, 1.00]
    city_point: white
    city_point_halo: black
    place_name: rgba(0, 0, 0, 0.8)
    hamlet_name: rgba(40, 36, 32, 0.78)
    place_halo: white
    hood_name: rgba(136, 45, 23, 0.9)
    hood_halo: white
    bldg: [.83, .83, .83, 0.75]
    bldg_3d: [.83, .83, .83, 0.5]
    bldg_3d_line: [.65, .65, .63, 0.5]
    park_name: "#235029"
    park_halo: "#f4f8f1"
    housenumber: [0.30, 0.30, 0.30] #"#d2b17d"
    housenumber_halo: [0.913, 0.925, 0.933] #rgba(38,38,38,0.15)
    landuse_name: [0.30, 0.30, 0.30]
    aerialway: "#555"
    aerialway_name: black
    aerialway_halo: white
    piste_name: black
    piste_halo: white
    piste:
      novice: "#2FB439" #[0.367,0.750,0.622]
      easy: "#2F76B4" #[0.367,0.750,0.622]
      intermediate: "#F54141" #[0.420,0.678,0.863]
      advanced: "#2E2E2E" #[0.450,0.450,0.450]
      expert: "#2E2E2E" #[0.450,0.450,0.450]
      freeride: "#FFA500"
    mtb:
      "0": "#2FB439"
      "1": "#2F76B4"
      "2": "#F54141"
      "3": "#2E2E2E"
      "4": "#2E2E2E"
      "5": "#FFA500"
    #urban_7: lightgrey
    #urban_9: [.88, .88, .88]
    #motorway_5: '#F89595'
    #motorway_7: '#D16768'
    #runway_16: '#fff'
    #runway_casing: orange

  # z-order for polygons (<100) and lines (higher z-order draws over lower); order > 1000 is reserved by mapsapp
  # ... now offset by 500 because we need depth range for raster tile proxy levels
  order:
    landuse: 510
    civic: 512
    commercial: 514
    retail: 516
    parks: 532
    park_detail: 534
    golf: 536
    airport: 538
    piste_area: 540
    #landcover: 550
    waterway: 622
    water: 624
    pier: 626
    bldg: 630
    tunnel_casing: 635
    tunnel: 636
    transportation_casing: 638
    transportation: 640
    rail_sleepers: 640
    rail: 645
    taxiway: 650
    path: 650
    runway: 655
    minor_road: 660
    piste: 665
    medium_road: 670
    major_road: 680
    motorway: 690
    bridge_casing: 700
    bridge: 701
    bicycle: 720
    transit: 750
    # put bus routes on top so they aren't hidden by wider route train/subway/tram routes
    transit_routes:
      { subway: 1, train: 2, light_rail: 3, tram: 4, bus: 5, trolleybus: 5 }
    aerialway: 760
    border_inner: 790
    border: 791
    bldg_3d_line: 799
    bldg_3d: 800

  # OSM carto uses the convention that smaller landcover areas are drawn above larger areas
  landcover_order_fn: function() { return 590 - Math.log(feature.area || 1); }

  piste_color_fn: function() { return global.color.piste[feature.difficulty] || 'white'; }
  piste_symbols: { easy: "●", intermediate: "■", advanced: "◆", expert: "◆◆" }
  piste_name_fn: |
    function() {
        const sym = global.piste_symbols[feature.difficulty] || '';
        return feature.name ? (sym + ' ' + feature.name) : sym;
    }

  mtb_color_fn: function() { return global.color.mtb[feature.mtb_scale] || global.color.bike_unpaved; }

  transit_order_fn: |
    function() {
        const offset = global.order.transit_routes[feature.route] || 0;
        return global.order.transit + offset + (Number(feature.osm_id) & 65535)/65536;
    }

  # OSM colors are supposed to be valid HTML or CSS colors, but invalid values are common
  transit_color_fn: |
    function() {
        const c = parseColor(feature.color || "");
        return c && c != 0xFFFFFFFF ? c : global.color.transit;  // don't allow white
    }

  show_name_en: true
  names_one_line: ["name_en", "name"]
  names_one_line_fn: |
    function() { return global.show_name_en && feature.name_en ? feature.name_en : feature.name; }
  names_two_lines: |
    function() { return global.show_name_en && feature.name_en && feature.name ? feature.name_en + "\n" + feature.name : feature.name; }

  # refs: https://pe.usps.com/text/pub28/28apc_002.htm
  road_name_abbrev:
    {
      "Avenue": "Ave.",
      "Street": "St.",
      "Road": "Rd.",
      "Boulevard": "Blvd.",
      "Drive": "Dr.",
      "Lane": "Ln.",
      "Expressway": "Expy.",
      "Parkway": "Pkwy.",
      "Highway": "Hwy.",
      "Freeway": "Fwy.",
      "Terrace": "Ter.",
      "Court": "Ct.",
      "Circle": "Cir.",
      "North": "N",
      "South": "S",
      "East": "E",
      "West": "W",
      "Northeast": "NE",
      "Northwest": "NW",
      "Southeast": "SE",
      "Southwest": "SW",
    }
  # note the native function tag
  road_name_abbrev_fn: |
    function() /*@road_name_abbrev*/ {
        const name = global.show_name_en && feature.name_en ? feature.name_en : feature.name;  //global.names_one_line_fn();
        var parts = name.split(" ");
        for(var ii = 0; ii < parts.length; ii++) {
            const abbrev = global.road_name_abbrev[parts[ii]];
            if(abbrev) { parts[ii] = abbrev; }
        }
        return parts.join(" ");
    }

  shuffle_seed: 58987
  # priorities for colliding objects (points and text; lower value wins) - fractional part now orders within
  #  group defined by integer part, after ordering by visible state and camera space z coord
  priority:
    national_park: 7.5
    campus: 10
    forest: 11 # only one label for potentially large map feature, and only shown up to zoom 11 or 12
    special_culture: 11
    peak: 14
    valley: 14.8
    saddle: 15
    cave: 16
    spring: 17
    airport: 18
    boundary: 19 # boundaries often follow mountain ridges, so don't let them hide peaks or saddles
    park: 20
    golf: 21
    cemetery: 22
    # road labels
    oneway_arrow: 23
    motorway_ref: 24
    highway_ref: 25
    road_primary: 30
    road_secondary: 40
    motorway_name: 45 # shield generally more important than name for motorway
    road_tertiary: 50
    road_residential: 55
    road_minor: 60
    route_minor: 65
    zoomed_ref: 70
    # rivers have many possible label positions w/ limited conflict, whereas lakes have only one label
    water: 22
    waterway: 99
    # transit line labels
    transit_ref: 19
    transit_ref_tram: 24
    transit_ref_bus: 29
    # transit stops
    bus_stop: 20 # bus stops only shown when show_transit = true
    station_transit: 5 # transit station priority when show_transit = true
    station_default: 29 # transit station priority when show_transit = false
    #station_tram: 6  # only shown when show_transit = true
    # we want to show every traffic light if showing any
    traffic_light: 4
    # housenumbers only shown at high zoom and unlikely to collide
    housenumber: 350
    # cities, states, countries
    district_CN: 9
    place: {
        continent: 5,
        country: 6,
        state: 7,
        province: 7,
        island: 8,
        city: 9,
        town: 10,
        village: 11,
        hamlet: 12,
        borough: 12,
        suburb: 13,
      } # neighborhood: 14, quarter: 14
    place_fn: |
      function() {
          return (global.priority.place[feature.place] || 14) - Math.round(Math.sqrt(feature.population || 1))/65536;
          //return (global.priority.place[feature.place] || 14) + 100.0/(100 + (feature.population || 1));
      }

  poi_priority:
    {
      "heritage": 30,
      "viewpoint": 31,
      "campground": 31,
      "trailhead": 31,
      "information": 99,
      "parking": 102,
      "toilet": 32,
      "drinking_water": 32,
      "marina": 41,
      "ranger_station": 40,
      "artwork": 42,
      "museum": 35,
      "theme_park": 40,
      "attraction": 42,
      "university": 33,
      "school": 52,
      "library": 41,
      "theatre": 41,
      "religious": 101,
      "shop": 101,
      "bike_shop": 101,
      "pharmacy": 101,
      "fuel": 101,
      "grocery": 38,
      "convenience": 51,
      "liquor": 101,
      "clothes": 101,
      "hardware": 101,
      "gym": 101,
      "bank": 101,
      "dentist": 101,
      "auto_repair": 101,
      "laundry": 101,
      "scissor": 101,
      "post_office": 100,
      "restaurant": 43,
      "cafe": 44,
      "bar": 44,
      "bakery": 44,
      "hospital": 101,
      "doctor": 101,
      "hotel": 101,
      "tree": 20,
      "golf": 21,
      "christian": 90,
      "muslim": 90,
      "buddhist": 90,
      "hindu": 90,
      "shinto": 90,
      "jewish": 90,
      "ruins": 41,
      "stadium": 40,
      "default": 101,
    }

  # - use osm_id to provide well-defined ordering so POIs don't get replaced by nearby ones when zooming in
  poi_priority_fn: |
    function() /*@poi_priority*/ {
      const shuffle = ((global.shuffle_seed ^ Number(feature.osm_id)) & 65535)/65536.0;
      return shuffle + (global.poi_priority[global.poi_sprite_fn()] || 101);
    }

  is_selected_fn: |
    function() /*@is_selected*/ { return !!feature.osm_id && feature.osm_id == global.selected_osm_id; }

  # bounds for country-specific filters
  japan_bounds: # covers main islands, does not include Okinawa, etc
    - {
        $latitude: { min: 31, max: 41.8 },
        $longitude: { min: 129.6, max: 142.3 },
      }
    - {
        $latitude: { min: 41.1, max: 45.8 },
        $longitude: { min: 139.2, max: 146.3 },
      }

  # if we want to easily add on top of various raster sources, have MapsSources set global._vector_order to
  #  layer number for vector source
  show_polygons: true # function() { return !(global._vector_order > 0); }
  show_bike: false
  show_transit: false
  show_trails: false
  # hiking trails in tilted views fade out where the ground is coarser than this effective zoom (see style trail)
  trail_far_zoom: 11
  # depth shift multiplier for trails (see style trail)
  trail_depth_boost: 2.5
  # same idea for ski runs, piste areas and lifts (styles lifted-lines / lifted-polygons)
  lift_depth_boost: 3.0
  show_ski_runs: false
  show_parking: false
  show_motorways: true
  show_land_polygons: global.show_polygons

