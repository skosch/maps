styles:
  # blend_order -1000 to draw buildings just above other geometry; blend_order -110 to -100 reserved by app
  heightglow:
    base: polygons
    mix: global.terrain_3d_mixin
    blend: translucent
    blend_order: -1000
    lighting: vertex
    shaders:
      blocks:
        # worldPosition() will include elevation if 3D enabled, but we only want building height
        color: |
          #ifdef TANGRAM_MODEL_POSITION_BASE_ZOOM_VARYING
          color.rgb += vec3(v_modelpos_base_zoom.z * u_model[2][2] / 800.);
          #else
          color.rgb += vec3(worldPosition().z / 800.);
          #endif

  heightglowline:
    base: lines
    blend_order: -999
    mix: heightglow

  # alpine land cover (scree, glacier): same look as unlit-polygons, finest drape grid
  unlit-polygons-alpine:
    mix: unlit-polygons
    terrain_grid: 256

  unlit-lines:
    base: lines
    mix: global.terrain_3d_mixin
    lighting: false

  # with 3D terrain, terrain_grid tessellates polygons on a grid (see rasterStyle.cpp/builders.cpp)
  #  so per-vertex elevation drapes them accurately over the terrain - critical for land cover /
  #  landuse polygons spanning significant relief; no effect in 2D.
  # The vertices themselves are placed on the terrain mesh's own piecewise-linear surface by
  #  getTerrainMeshElevation (elevation.yaml) - the actual fix for the "white patches" on steep
  #  alpine terrain (see its comment). The grid resolution's job is only to ensure no polygon
  #  triangle spans more than one terrain-lattice cell (a triangle crossing lattice cells would
  #  chord across the surface's folds). This "osm" source caps at max_zoom 14 (the tile server has
  #  no data beyond that - confirmed directly) while the elevation source (elevation.yaml) goes to
  #  16, so tiles are overzoomed up to 2 levels and the lattice is up to 64 * 2^2 = 256 cells per
  #  tile; 256 matches that worst case (power-of-two multiples of the lattice nest exactly, so it's
  #  also correct at lower view zooms). buildPolygonGrid (builders.cpp) flushes oversized features
  #  into multiple indexed sub-ranges instead of falling back to a coarse undraped triangle, so
  #  this costs CPU/vertices at tile load (3D only) but never degrades drape quality.
  unlit-polygons:
    base: polygons
    mix: global.terrain_3d_mixin
    lighting: false
    # covers are lit by the hillshade veil unless they opt out (forest-trees sets this true: the veil skips them)
    stencil_write: false
    # 2026-10-12: the draped polygon grid must be as fine as the terrain lattice or triangles
    #  chord across relief and the hillshade overlay fails its depth test (unshaded patches).
    #  That only matters on rugged ground, and the fine grid costs vertices (GPU + tile build
    #  time), so general land cover (forest, farmland, ...) is capped at 128 and the alpine
    #  classes (rock, scree, glacier) use unlit-polygons-alpine below at the full 256.
    terrain_grid: 128
    # Land-cover-colored contour lines (Wanderkarte style, Sebastian: light blue on
    #  glaciers, grayish brown on mountain rock, darker green in forest). The lines are
    #  drawn HERE, inside the cover styles, rather than by hillshade's blend-over pass:
    #  that pass composites its contour pixels at FULL opacity over whatever is below,
    #  so it can only ever force ONE color onto every cover - only the style that IS a
    #  cover knows its identity. Shared math: terrainContourCoverage() (elevation.yaml,
    #  mixed in via terrain_3d_mixin) - identical uniforms and identical stencil in
    #  every participant (terrain-ground, rock-texture, here) make the lines align
    #  across cover boundaries by construction.
    shaders:
      defines:
        SHOW_CONTOURS: global.show_contours
      uniforms:
        # (METRIC_UNITS / u_min_contour_elev inherited from get-elevation on this
        #  mixin chain - see elevation.yaml)
        u_contour_default: global.contour_default
        u_contour_forest: global.contour_forest
        u_contour_ice: global.contour_ice
        # fill-color anchors: EXACTLY the colors the landuse rules set (same globals),
        # so comparing the fragment's own v_color against them identifies the cover
        # with zero engine support. Vertex colors are 8-bit-quantized (<= ~0.004
        # distance), real palette separations are >= ~0.05, hence the 0.02 epsilon.
        # Anything unmatched (grass, scree, farmland, piste, airport...) inherits the
        # default - new covers need no edits here.
        u_forest_fill: global.color.forest
        u_grass_fill: global.color.grass
        u_meadow_texture: 0.12
        u_ice_fill: global.color.ice
        u_water_fill: global.color.water
        # what a (near-)vertical drawn triangle is painted as, whatever land cover owns its 2D
        #  footprint (see the color block)
        u_wall_rock_color: global.color.rock
      blocks:
        color: |
          // the land cover this fragment belongs to is identified by its flat fill colour; keep it
          //  before anything below repaints color.rgb (forest trees, snow)
          vec3 coverFill = color.rgb;
          #ifdef FOREST_TREES
          // a tree plane's fragment: the spruce silhouette is cut out of the quad (opaque, alpha-tested)
          { vec4 ft = forestTrees(color.rgb); color.rgb = ft.rgb; if (ft.a < 0.5) { discard; } }
          #elif defined(FOREST_GROUND)
          { vec4 gs = forestGroundShade(); color.rgb = mix(color.rgb, gs.rgb, gs.a); }   // canopy shade on the meadow
          #endif
          #if !defined(ROCK_STYLE) && !defined(FOREST_TREES)
          {
              // wall rock for near-vertical drawn triangles whatever land cover owns the footprint
              //  (applyWallRock, elevation.yaml); rock-texture is excluded - it textures walls itself
              vec3 wallCol = applyWallRock(color.rgb, u_wall_rock_color.rgb);
              if (distance(coverFill, u_water_fill.rgb) >= 0.02) { color.rgb = wallCol; }
          }
          #endif
          #if defined(SNOW_MODE) && !defined(ROCK_STYLE) && !defined(FOREST_TREES)
          {
              // Snow Mode: rock-texture applies its own snow at the end of its block instead,
              //  because its material blend would otherwise repaint over this
              float snowCover = 1.0;
              if (distance(coverFill, u_water_fill.rgb) < 0.02) { snowCover = 0.0; }
              else if (distance(coverFill, u_forest_fill.rgb) < 0.02) { snowCover = 0.65; }
              else if (distance(coverFill, u_ice_fill.rgb) < 0.02) { snowCover = 0.0; }
              color.rgb = applySnow(color.rgb, snowCover);
          }
          #endif
          #ifdef FOREST_TREES
          color.rgb = treeShade(color.rgb);       // forest palette + slope light
          #endif
          #if !defined(ROCK_STYLE) && !defined(FOREST_TREES)
          {
              // meadow: a faint, world-anchored carpet - fine grain + soft tufts, fading out as soon as a pixel spans a grain
              vec2 mq = v_world_position.xy;
              float mfp = length(vec4(dFdx(mq), dFdy(mq))) * 0.7;
              if (distance(coverFill, u_grass_fill.rgb) < 0.02 && u_meadow_texture > 0.0) {
                  float wm[4]; float cs[4];
                  cs[0] = 0.9; cs[1] = 2.6; cs[2] = 7.0; cs[3] = 20.0;
                  wm[0] = 0.5; wm[1] = 0.8; wm[2] = 1.0; wm[3] = 0.9;
                  float mn = 0.0;
                  for (int i = 0; i < 4; i++) {
                      float ai = 1.0 - smoothstep(0.25, 0.8, mfp / cs[i]);
                      mn += wm[i] * ai * (rockVNoise(vec3(mq / cs[i], 2.7 + float(i))) - 0.5);
                  }
                  color.rgb *= 1.0 + u_meadow_texture * 2.0 * mn * vec3(1.0, 1.0, 0.85);   // dark = cooler, light = warmer
              }
          }
          #endif
          #if defined(TANGRAM_TERRAIN_3D) && !defined(ROCK_STYLE) && !defined(FOREST_TREES)
          {
              // slope lighting as albedo x irradiance (terrainSlopeLight, elevation.yaml) - replaces the hillshade
              //  veil's slope term at tilt. k = how much the terrain normal matters for this cover.
              float k = 0.7;                                                    // grass, scrub, farmland, sand, ...
              if (distance(coverFill, u_water_fill.rgb) < 0.02) { k = 0.0; }    // water is flat, not terrain-lit
              else if (distance(coverFill, u_forest_fill.rgb) < 0.02) { k = 0.4; }
              else if (distance(coverFill, u_ice_fill.rgb) < 0.02) { k = 1.0; }
              color.rgb = terrainSlopeShade(color.rgb, k);
          }
          #endif
          #if defined(SHOW_CONTOURS) && !defined(FOREST_TREES)
          {
              float contourCov = terrainContourCoverage();
              // inland water carries no contours (lakes ride this same style; ocean is
              //  already excluded by the underwater guard inside the coverage function)
              if (distance(coverFill, u_water_fill.rgb) < 0.02) { contourCov = 0.0; }
              vec3 contourColor = u_contour_default.rgb;
              if (distance(coverFill, u_forest_fill.rgb) < 0.02) {
                  contourColor = u_contour_forest.rgb;
              } else if (distance(coverFill, u_ice_fill.rgb) < 0.02) {
                  contourColor = u_contour_ice.rgb;
              }
              color.rgb = mix(color.rgb, contourColor, contourCov);
          }
          #endif

  # Procedural bare-rock relief texture (fast, purely synthetic - no elevation-scale
  #  detail exists at this grain in the DEM). Only mixed into the `rock` (bare_rock)
  #  landuse draw rule below, not the shared unlit-polygons style, so scree and every
  #  other land-cover polygon (forest/grass/etc.) pays none of this cost.
  rock-texture:
    mix: unlit-polygons
    # NOT inherited from unlit-polygons via `mix:` (unlike shaders: blocks/uniforms) -
    #  omitting this left gridRes silently at 0 (no terrain-grid tessellation at all) for
    #  this style specifically, for this style's entire lifetime, which was the actual
    #  root cause of the Matterhorn summit drape investigation (docs/terrain-drape-
    #  cellcaps-investigation.md Round 10): with gridRes=0, bare_rock's mesh was just the
    #  raw, sparse earcut boundary vertices with no internal subdivision, so a huge
    #  triangle could span the entire summit and linearly interpolate straight across it,
    #  undershooting a sharp peak by up to ~1000m - regardless of how correct the
    #  elevation function itself was (confirmed correct throughout that investigation).
    #  256 matches unlit-polygons' own value and was hand-verified sufficient (real-DEM
    #  bilinear undershoot at the Matterhorn's true summit is ~2m even at this density).
    terrain_grid: 256
    shaders:
      defines:
        ROCK_STYLE: true
        SHOW_CONTOURS: global.show_contours
      uniforms:
        # land-cover-colored contour lines (Wanderkarte style): bare rock wears the
        #  default grayish brown - the SAME global unlit-polygons' non-cover fragments
        #  use, so lines stay continuous across rock/scree/earth boundaries (drawn by
        #  the shared terrainContourCoverage(), elevation.yaml; METRIC_UNITS and
        #  u_min_contour_elev are inherited from get-elevation on this mixin chain)
        u_contour_default: global.contour_default
        # ROUND 13 (docs/rock-texture-v2-plan.md): the marble-photo triplanar sampling of
        #  rounds 6-12 is replaced by a procedural FILTERED ridged multifractal (Sebastian:
        #  "fractal surface... extremely fast and realistic", ref iq's Rain Forest fBm
        #  techniques). The two failure modes of the rounds-1-5 procedural attempts are
        #  addressed structurally this time, not patched: ALIASING by per-octave
        #  screen-space amplitude fading (the analytic equivalent of mip selection - see
        #  rockRidgedFbm), and SLOWNESS by analytic derivatives (one noise evaluation
        #  yields both albedo and the bump normal - no finite differences, no cell
        #  searches). u_rock_scale is the MACRO FEATURE WAVELENGTH in world meters
        #  (octaves span scale..scale/20); 400m calibrated by Sebastian's "half the
        #  Matterhorn" round-10 framing. Live-tunable via GUI slider.
        u_rock_scale: 400.0
        u_rock_noise_tex: rock_noise
        # overall CONTRAST of the material blend (mix weight toward the procedural
        #  material + weathering/lichen blend, see color block) - 0 = flat original
        #  palette color, 1 = full effect. Independent of u_rock_normal_strength (the
        #  bump-lighting contrast). Darkening rounds 2026-08-23: 0.35 -> 0.55 ("more rock
        #  textured") -> 0.65 (round 2, "not dark enough" - more weight on the darker-mean
        #  procedural material over the flat palette).
        u_rock_strength: 0.65
        # how much the REAL DEM curvature (5-tap Laplacian) weighs into the material
        #  weathering blend (color block) - correlates weathered/fresh coloring with
        #  actual gullies/spines instead of looking entirely pasted-on
        u_rock_curv_strength: 0.4
        u_rock_curv_scale: 40.0
        # view zoom below which the effect fades out entirely (bare-rock polygons are
        #  tiny/irrelevant at these zooms anyway)
        u_rock_min_zoom: 9.0
        u_rock_shadow_color: global.color.rock_shadow
        u_rock_lichen_color: global.color.rock_lichen
        # how strongly lichen/moss patches (low-slope, concave, damp microsites) tint in -
        #  0 disables entirely, useful for arid/desert contexts where lichen reads wrong
        u_rock_lichen_strength: 0.25
        # bump-mapping strength: how much the fractal's own analytic gradient perturbs
        #  the DEM-gradient macro surface normal before the (screen-anchored, hillshade-
        #  consistent) sun dot-product is taken - see color block. 0 = no perturbation,
        #  an honest no-op (the light term is computed as a DELTA from the unperturbed
        #  normal specifically so it never re-shades the macro slope hillshade's own
        #  blend-over already covers). The microLight clamp (round 12) is structurally
        #  safe at any strength, so this is purely an aesthetic dial. Darkening round
        #  2026-08-23: 1.0 -> 1.3 ("more rock textured" - starts the safe dial further up).
        u_rock_normal_strength: 1.3
        # ROUND 11: contrast boost applied to the final material color (fractal +
        #  weathering + lichen combined) before it's blended into color.rgb - see the
        #  color block for why (hillshade's translucent 3D shadow overlay attenuates
        #  whatever's underneath, this pre-compensates so real texture detail survives
        #  visible). 1 = no boost (honest no-op: mix(gray, color, 1.0) == color).
        #  ROUND 15: 1.7 -> 2.0 (Sebastian: "at regular zoom levels like 12-14 the
        #  texture isn't noticeable at all"). At those zooms the view is top-down, so
        #  macro normals point at the camera: the bump-lighting delta is nearly zero
        #  and albedo modulation is the only texture carrier, while hillshade's
        #  blend-over still taxes it - the boost pivots contrast around the mean gray
        #  to push more of it through.
        u_rock_contrast: 2.0
        # CLIFF READABILITY (2026-10-12, Berann-style; replaces the strata/baked-couloir attempt).
        #  Nothing here is pasted-on pattern: every term is derived from the DEM measured in the
        #  surface-NORMAL direction (cavity = how far the center sits behind the mean of its
        #  neighbours, along the face normal - a cheap mean-free-path / ambient-occlusion proxy)
        #  at two lateral scales, plus where the local slope is flatter than its steeper
        #  surroundings (ledges). 0 disables each.
        # cavity: darkening of chimneys / couloirs / gullies
        u_rock_cavity_strength: 0.55
        # ledge/rib light: sky-lit upward facets and convex ribs catch light
        u_rock_ledge_light: 0.35
        # snow dusting: above the latitude-dependent snow line, on gentle ground and on ledges
        u_rock_snow_strength: 0.8
        # how the cliff/snow decisions get their slope + height (snow disappeared with the first
        #  geometry-aware version, root cause not yet isolated - switchable for A/B):
        #  0 = DEM only (the original, known-good snow), 1 = + slope of the drawn triangle,
        #  2 = + slope of the drawn triangle, fragment world-z snow line, aspect
        u_rock_geo_mode: 2.0
        # CLIFF RELIEF (invented detail where the DEM has none): on walls the fractal's fall-line
        #  anisotropy flips from STRETCHED along the fall line (vertical thread - what a heightfield
        #  wall already looks like) to COMPRESSED (E < 1: thin horizontal ledge bands that vary in
        #  height and length because the field is multi-octave ridged noise, not periodic strata).
        #  1.0 = no change vs. the old look; ~0.4 = ledges ~2.5x thinner than they are long.
        u_rock_ledge_aniso: 0.4
        # extra bump-relief multiplier on walls (0 = none): ledge tops catch light, undersides go dark
        u_rock_cliff_relief: 1.5
        # 0 = off; 1 = snow debug (R gate, G accum, B snow); 2 = (steep/2, cavity, ledge)
        u_rock_debug: 0.0
      blocks:
        global: |
          #ifdef TANGRAM_FRAGMENT_SHADER
          // ROUND 16 (perf, 2026-10-10): the ridged multifractal is BAKED, not evaluated
          //  per fragment. scripts/bake_rock_noise.py renders the same Musgrave cascade
          //  ((1-|n|)^2 fold, weight cascade, 5 octaves, analytic gradient) once into a
          //  tileable 1024^2 RGBA8 texture (assets/textures/rock_ridged_noise.png):
          //    R = field value ~[0,1]   GB = d(value)/dp (p in base cells, +-ROCK_GRAD_RANGE)
          //    A = lichen-patch mask in [0,1]
          //  Per fragment this is ONE trilinear fetch per triplanar plane (3 total, +3 for
          //  lichen only on the sites that need it) instead of up to 11 gradient-noise
          //  octaves x 4 sin() hashes - that evaluation was 56% of all GPU time in a
          //  tilted Iris Xe capture. The mip chain IS the old per-octave screen-space fade
          //  (a box band-limit of the field; value and gradient filter identically), so the
          //  anti-aliasing argument of round 13 carries over unchanged. The fall-line
          //  anisotropy is just a UV transform before the fetch. Differences from the
          //  per-fragment version, all inherent to making it periodic: LAC is exactly 2
          //  (was 2.13), octaves differ by lattice seed rather than domain rotation (the
          //  three runtime plane rotations re-break alignment), and the pattern repeats
          //  every ROCK_TEX_CELLS * u_rock_scale meters (was ~400 km).
          const float ROCK_TEX_CELLS = 16.0;    // keep in sync with bake_rock_noise.py CELLS
          const float ROCK_GRAD_RANGE = 8.0;    // keep in sync with bake_rock_noise.py
          // One plane's worth of the field with fall-line anisotropy folded in (outer-
          //  product stretch of the domain along dir; gradient chained back through the
          //  SAME symmetric A). q: world meters already rotated+offset by the caller's
          //  per-plane constants. Returns (value, gradient wrt the ROTATED q-domain in
          //  base-cell units) - same contract as the old rockSampleAniso.
          vec3 rockSampleAniso(vec2 q, vec2 fallDir, float E) {
              vec2 dir = fallDir / max(length(fallDir), 1e-4);
              mat2 A = mat2(1.0) + (1.0 / E - 1.0) * outerProduct(dir, dir);
              vec4 t = texture2D(u_rock_noise_tex, (A * q) / (u_rock_scale * ROCK_TEX_CELLS));
              vec2 g = (t.gb * 2.0 - 1.0) * ROCK_GRAD_RANGE;
              return vec3(t.r, A * g);
          }
          // [0,1] lichen-patch mask tap: one mask cell == 60 m (as before).
          float rockNoise01(vec2 p) {
              return texture2D(u_rock_noise_tex, p / ROCK_TEX_CELLS).a;
          }
          #ifdef ELEVATION_MOSAIC
          // Bilinear (UNsnapped) elevation tap in mosaic UV. The exact-texel taps of
          //  elevationTexelAt make every derived quantity (slope, curvature, triplanar weights,
          //  fall line) constant per DEM texel - the square "pixel" mosaic seen on rock when
          //  zoomed past DEM resolution. The mosaic is LINEAR-filtered and the terrarium decode
          //  is linear, so interpolating the encoded channels is exact bilinear elevation.
          float rockElevTap(vec2 muv) {
              vec4 h = textureLod(u_rasters[ELEVATION_INDEX], muv, 0.0);
          #ifdef ELEVATION_FLOAT_TEX
              return h.r;
          #else
              return (h.r*256. + h.g + h.b/256.)*255. - 32768.;
          #endif
          }
          #endif
          #endif
        color: |
          {
              float rockFade = smoothstep(u_rock_min_zoom, u_rock_min_zoom + 2.0, u_map_position.z);
              if (rockFade > 0.001) {
                  // 5-tap slope/curvature stencil on the elevation raster already attached
                  //  to this style for terrain draping (global.terrain_3d_mixin/get-
                  //  elevation, pulled in via the unlit-polygons mixin) - cheaper than
                  //  hillshade.yaml's own 9-tap/mosaic-seam-exact stencil, which also drives
                  //  contour lines and needs that rigor; a texture accent doesn't.
                  vec2 st = currentRasterUV(ELEVATION_INDEX);
                  vec2 texwh = rasterPixelSize(ELEVATION_INDEX);
                  #ifdef ELEVATION_MOSAIC
                  texwh = texwh / float(ELEVATION_MOSAIC_SPAN) + float(ELEVATION_TILE_OVERLAP);
                  #endif
                  vec2 duv = 1.0 / texwh;
                  // ring radius (texels) of the coarse cavity/ledge scale; resolved below once the
                  //  meters-per-texel is known, so it is declared here for both paths
                  float ringR = 4.0;
                  float hc, hn, hs, he, hw, hn4, hs4, he4, hw4;
                  #ifdef ELEVATION_MOSAIC
                  vec2 stp = 1.0 / rasterPixelSize(ELEVATION_INDEX);
                  vec2 muv = elevationMosaicUV(st);
                  {
                      // meters per texel (same expression as dxy_elev.x below) -> ring radius that
                      //  keeps the coarse scale near ~50 m regardless of DEM resolution
                      float mpt = 2.0 * 3.141592 * 6378137.0 * exp2(-u_tile_origin.w) * duv.x / u_raster_offsets[ELEVATION_INDEX].z;
                      ringR = clamp(50.0 / max(mpt, 0.01), 2.0, 8.0);
                  }
                  hc = rockElevTap(muv);
                  hn = rockElevTap(muv + vec2(0., stp.y));
                  hs = rockElevTap(muv - vec2(0., stp.y));
                  he = rockElevTap(muv + vec2(stp.x, 0.));
                  hw = rockElevTap(muv - vec2(stp.x, 0.));
                  hn4 = rockElevTap(muv + vec2(0., stp.y) * ringR);
                  hs4 = rockElevTap(muv - vec2(0., stp.y) * ringR);
                  he4 = rockElevTap(muv + vec2(stp.x, 0.) * ringR);
                  hw4 = rockElevTap(muv - vec2(stp.x, 0.) * ringR);
                  #else
                  hc = getElevationAt(st);
                  hn = getElevationAt(st + vec2(0.0, duv.y));
                  hs = getElevationAt(st - vec2(0.0, duv.y));
                  he = getElevationAt(st + vec2(duv.x, 0.0));
                  hw = getElevationAt(st - vec2(duv.x, 0.0));
                  hn4 = getElevationAt(st + vec2(0.0, duv.y) * ringR);
                  hs4 = getElevationAt(st - vec2(0.0, duv.y) * ringR);
                  he4 = getElevationAt(st + vec2(duv.x, 0.0) * ringR);
                  hw4 = getElevationAt(st - vec2(duv.x, 0.0) * ringR);
                  #endif
                  vec2 dxy_elev = 2.0 * 3.141592 * 6378137.0 * exp2(-u_tile_origin.w) * duv / u_raster_offsets[ELEVATION_INDEX].z;
                  float unproj = exp(u_map_position.y / 6378137.0);
                  float coslat = 2.0 / (unproj + 1.0 / unproj);
                  vec2 gradTrue = vec2(he - hw, hn - hs) / (2.0 * dxy_elev * coslat);
                  float slopeMag = length(gradTrue);
                  float slope01 = clamp(slopeMag / 1.5, 0.0, 1.0);  // ~56 deg -> fully "ragged"
                  // discrete Laplacian: >0 convex (ridge/spire/ledge), <0 concave (gully/crack)
                  float lap = (hn + hs + he + hw - 4.0 * hc) / (dxy_elev.x * dxy_elev.x * coslat * coslat);
                  float curv01 = clamp(lap * u_rock_curv_scale, -1.0, 1.0);

                  // macroNormal: DEM-gradient surface normal. ROUND 11 (kept): gradient
                  //  magnitude clamped, direction preserved - finite-difference DEM
                  //  gradients are numerically unstable as terrain approaches vertical
                  //  (a raster can't represent an overhang, just a rapid step), so the
                  //  normal is bounded to a steep-but-finite slope (8.0 ~= tan(83deg)).
                  //  gradTrue itself (slope01/curv01) is untouched.
                  vec2 gradStable = gradTrue * min(1.0, 8.0 / max(slopeMag, 1e-5));
                  vec3 macroNormal = normalize(vec3(-gradStable, 1.0));
                  // GEOMETRIC slope of the surface actually rasterized (screen-space derivatives of
                  //  the world position, xy scaled to true meters). One DEM texel step becomes ONE
                  //  near-vertical triangle whose every pixel shares the same DEM xy - so DEM-keyed
                  //  terms smear down it as streaks (snow icicles). The drawn geometry knows it is a
                  //  wall; trust the steeper of the two for every steep/ledge/snow decision.
                  vec3 geoDx = dFdx(v_world_position.xyz), geoDy = dFdy(v_world_position.xyz);
                  geoDx.xy *= coslat; geoDy.xy *= coslat;
                  vec3 geoC = cross(geoDx, geoDy);
                  float geoL = length(geoC);
                  // guarded: a zero/degenerate derivative must give "flat", never NaN (NaN here
                  //  poisoned every term it touched, including via 0 * NaN)
                  vec3 geoN = (geoL > 1e-6 && geoL < 1e9) ? geoC * ((geoC.z < 0.0 ? -1.0 : 1.0) / geoL)
                                                         : vec3(0.0, 0.0, 1.0);
                  float geoSlope = sqrt(max(1.0 - geoN.z * geoN.z, 0.0)) / max(geoN.z, 0.02);

                  // --- ROUND 13: filtered derivative ridged multifractal --------------
                  // --- ROUND 14: seamless TRIPLANAR evaluation -------------------------
                  // (Sebastian, after round 13: "pixels are stretched across very steep
                  //  cliffs, rather than UV-mapped" / "rock is square pixels".) Round 13's
                  //  domain was world-XY only: fragments stacked up a cliff wall share
                  //  nearly the same (x,y), so the field smeared vertically down the face
                  //  instead of following the surface, and the never-rotated first-octave
                  //  value-noise lattice read as squares. Fix is classic triplanar: the
                  //  SAME field evaluated in all three world planes (XY / XZ / ZY), blended
                  //  by squared |macroNormal| components - weights are continuous and sum
                  //  to 1, so there is no plane-switch seam anywhere. Each plane carries a
                  //  distinct constant domain rotation (+offset): no lattice is ever
                  //  axis-aligned (kills the square read) nor co-aligned with another
                  //  plane's (no blend-boundary beating). Cost (round 16): 3 texture
                  //  fetches of the baked field, full 5 octaves on every plane.
                  const float ROCK_ANISO = 1.0;
                  float cliffE = smoothstep(0.7, 1.6, max(slopeMag, min(geoSlope, 12.0)));
                  float E = mix(1.0 + ROCK_ANISO * smoothstep(0.08, 0.6, slopeMag), u_rock_ledge_aniso, cliffE);
                  // Shared 3D fall line (downhill tangent of the DEM surface). The old
                  //  guard relied on E==1 making the aniso matrix identity, but NaN*0 is
                  //  still NaN - flat ground needs a genuinely safe direction.
                  vec3 fall3 = (slopeMag > 1e-4)
                      ? normalize(vec3(-gradStable.x, -gradStable.y, -dot(gradStable, gradStable)))
                      : vec3(1.0, 0.0, 0.0);
                  // Plane rotations ~21deg / ~113deg / ~237deg with matching transposes
                  //  (GLSL ES 1.0 has no transpose(); mat2 columns are (a,b),(c,d)).
                  const mat2 RXY  = mat2( 0.9336, 0.3584, -0.3584,  0.9336);
                  const mat2 RXYT = mat2( 0.9336, -0.3584, 0.3584,  0.9336);
                  const mat2 RXZ  = mat2(-0.3907, 0.9205, -0.9205, -0.3907);
                  const mat2 RXZT = mat2(-0.3907, -0.9205, 0.9205, -0.3907);
                  const mat2 RZY  = mat2(-0.5446, -0.8387, 0.8387, -0.5446);
                  const mat2 RZYT = mat2(-0.5446, 0.8387, -0.8387, -0.5446);
                  // The projection planes must follow the surface actually DRAWN: where the DEM
                  //  gradient reads gentle but the drawn triangle is a wall (node sub-sampling /
                  //  filtering disagree there), the DEM normal picks the XY plane and the noise is
                  //  projected straight down a vertical wall = vertical streaks.
                  vec3 triN = normalize(mix(macroNormal, geoN, smoothstep(0.0, 0.6, geoSlope - slopeMag)));
                  vec3 w3 = abs(triN);
                  w3 *= w3;
                  w3 /= (w3.x + w3.y + w3.z);
                  vec3 rXY = rockSampleAniso(RXY * v_world_position.xy + vec2(37.7, 11.3),
                                             RXY * fall3.xy, E);
                  vec3 rXZ = rockSampleAniso(RXZ * v_world_position.xz + vec2(91.1, 47.3),
                                             RXZ * fall3.xz, E);
                  vec3 rZY = rockSampleAniso(RZY * v_world_position.zy + vec2(153.8, 77.9),
                                             RZY * fall3.zy, E);
                  float crest = w3.x * rXY.x + w3.y * rXZ.x + w3.z * rZY.x;
                  // NEAR-VIEW DETAIL: the baked field bottoms out at ~25 m features, and magnified
                  //  its ridged/domain-warped character reads as marble. Close up the rock needs
                  //  granular, isotropic detail instead: 3 octaves of plain 3D value noise keyed
                  //  to true-meter world position (5 m, 1.9 m, 0.8 m), each faded out as the pixel
                  //  footprint approaches its wavelength (the analytic mip), so nothing is
                  //  evaluated or visible at a distance.
                  float footprint = max(length(geoDx), length(geoDy));   // meters per pixel
                  float crestD = 0.5;
                  if (footprint < 4.0) {
                      vec3 pw = v_world_position.xyz;
                      pw.xy *= coslat;
                      float w0 = 1.0 - smoothstep(1.0, 3.0, footprint);
                      float w1 = 1.0 - smoothstep(0.4, 1.2, footprint);
                      float w2 = 1.0 - smoothstep(0.15, 0.5, footprint);
                      crestD = 0.5 + 0.55 * w0 * (rockVNoise(pw / 5.0) - 0.5)
                                   + 0.30 * w1 * (rockVNoise(pw / 1.9 + 7.1) - 0.5)
                                   + 0.15 * w2 * (rockVNoise(pw / 0.8 + 3.3) - 0.5);
                  }
                  vec3 gradD = vec3(0.0);
                  // Gradients wrt world meters: un-rotate each plane's gradient into its
                  //  own two world axes, then reassemble the 3D gradient by component.
                  //  This is the bump normal's entire source - same analytic-derivatives
                  //  argument as round 13, now per plane.
                  vec2 gXY = RXYT * rXY.yz;   // d/d(x,y)
                  vec2 gXZ = RXZT * rXZ.yz;   // d/d(x,z)
                  vec2 gZY = RZYT * rZY.yz;   // d/d(z,y)
                  vec3 gradWorld = (w3.x * vec3(gXY.x, gXY.y, 0.0)
                               +  w3.y * vec3(gXZ.x, 0.0, gXZ.y)
                               +  w3.z * vec3(0.0, gZY.y, gZY.x)) / u_rock_scale;

                  // --- material/color blend -------------------------------------------
                  // Weathering keyed to the REAL DEM curvature (concave gully/crack
                  //  microsites are damper/darker) - deliberately independent of the
                  //  fractal field below (real rock gullies are BOTH geometrically
                  //  self-shadowed (lighting) AND materially different (damper/darker -
                  //  albedo), not the same signal twice).
                  float weathered = clamp(u_rock_curv_strength * clamp(-curv01, 0.0, 1.0), 0.0, 1.0)
                                  * (1.0 - 0.7 * cliffE);   // DEM curvature is column-constant on walls
                  vec3 materialColor = mix(color.rgb, u_rock_shadow_color.rgb, weathered);
                  // Fractal structure in the albedo: crest lines read fresher/lighter,
                  // hollows darker. Same field the lighting below uses, so color and
                  // shading always agree about where the forms are - no albedo/lighting
                  // mismatch to read as "pasted-on". Darkening rounds 2026-08-23: range was
                  // [0.82, 1.18] -> [0.74, 1.18] -> [0.72, 1.18]; round 14's wider floor
                  // also compensates the triplanar blend diluting crest variance (blending
                  // three independent fields shrinks spread by ~sum w_i^2).
                  // on walls the albedo field is calmed (cliff weight 0.7): at the contrast boost
                  //  below it otherwise reads as camouflage blotches; structure there comes from the
                  //  lighting, cavities and streaks instead
                  materialColor *= mix(0.72 + 0.46 * crest, 0.88 + 0.24 * crest, 0.7 * cliffE);
                  materialColor *= 0.82 + 0.36 * crestD;

                  // lichen/moss crust: common on exposed alpine rock worldwide regardless
                  //  of geology - a strong "this is real rock" cue no flat palette color
                  //  or synthetic pattern supplies (it's tied to THIS mountain's actual
                  //  shape and dampness, not to a generic noise field). Restricted to
                  //  low-slope + concave (damp)
                  //  microsites, patchy via a cheap noise tap. u_rock_lichen_strength: 0
                  //  disables for arid contexts. ROUND 9: scale decoupled from
                  //  u_rock_scale (was implicitly 4x whatever the rock texture scale was
                  //  set to, so round 7/8 raising that from 15->50m also - unintentionally
                  //  - quadrupled the lichen patch size to 200m, coarse enough at zoom-12
                  //  overview scale to read as hard blocky blotches rather than patchy
                  //  texture) and the smoothstep band widened considerably (soft blob
                  //  edges instead of a near-binary on/off threshold).
                  float lichenSite = (1.0 - slope01) * clamp(-curv01, 0.0, 1.0);
                  // PERF (2026-08-23): skip the lichen noise taps whenever the mask is
                  //  already EXACTLY zero - strength 0 (slider off / arid presets) or a
                  //  zero site factor (slope fully "ragged" at >= ~56deg, or convex
                  //  ground). Steep faces are most bare-rock screen area, and
                  //  mix(x,y,0)==x bit-for-bit: pure dead-work elimination. ROUND 14:
                  //  the patch field is triplanar now too - an XY-only lichen mask
                  //  streaks down cliffs exactly like the main field did.
                  float lichenPatch = 0.0;
                  if (u_rock_lichen_strength > 0.0 && lichenSite > 0.0) {
                      float lichenN =
                          w3.x * rockNoise01(RXY * v_world_position.xy / 60.0 + vec2(17.13, 3.71))
                        + w3.y * rockNoise01(RXZ * v_world_position.xz / 60.0 + vec2(53.29, 91.7))
                        + w3.z * rockNoise01(RZY * v_world_position.zy / 60.0 + vec2(127.4, 61.3));
                      lichenPatch = smoothstep(0.15, 0.85, lichenN);
                  }
                  float lichenMask = u_rock_lichen_strength * lichenSite * lichenPatch;
                  materialColor = mix(materialColor, u_rock_lichen_color.rgb, lichenMask);

                  // ROUND 11 (Sebastian: "patches that are just gray with no texture...
                  //  I think it's the shadow"): confirmed against hillshade.yaml - in 3D,
                  //  hillshade composites a translucent flat-gray macro-shading layer OVER
                  //  every land-cover polygon (`color = vec4(vec3(gain*L-(gain-1.0)),
                  //  alpha)`, default alpha 0.55 at full tilt - see HILLSHADE_BLEND_OVER).
                  //  Alpha-blending a flat color over a detailed one mathematically
                  //  attenuates the detail underneath by (1-alpha) - ~45% of our contrast
                  //  survives - and that's compounded perceptually in shadow, where the
                  //  same absolute contrast reads as more washed out against a darker
                  //  backdrop. This is the existing, established, heavily-tuned 3D
                  //  compositing architecture (every land-cover type is blended under it
                  //  the same way), not a rock-texture bug - it's just the first land
                  //  cover with fine spatial detail worth losing to it. Can't fix this
                  //  from rock-texture's side (hillshade is a separate style/pass, and
                  //  retuning its alpha globally would affect every other land-cover type
                  //  too) - instead, pre-boost contrast here so more of it survives the
                  //  attenuation on the other side.
                  // --- CLIFF READABILITY: normal-direction cavity, ledges, ribs -------------
                  //  Depth of the center behind the mean of its ring, measured ALONG THE FACE
                  //  NORMAL: for symmetric taps the g.d term cancels, leaving
                  //  (mean(ring) - hc) / sqrt(1+|g|^2) - the slope-corrected curvature, in meters,
                  //  then divided by the ring radius so it is a dimensionless "how deep is the
                  //  groove for its width" (1 ~ 45 deg walls). >0 concave (crack, chimney,
                  //  couloir), <0 convex (rib, arete, ledge lip). Two scales: 1 texel + ~50 m.
                  float mpt1 = dxy_elev.x * coslat;
                  float invN = inversesqrt(1.0 + slopeMag * slopeMag);
                  float cn1 = (0.25 * (hn + hs + he + hw) - hc) * invN / mpt1;
                  float cn4 = (0.25 * (hn4 + hs4 + he4 + hw4) - hc) * invN / (ringR * mpt1);
                  // coarse-scale slope (the ring's own central difference) vs fine slope:
                  //  a LEDGE is flatter locally than the steep wall around it
                  float slopeC = length(vec2(he4 - hw4, hn4 - hs4)) / (2.0 * ringR * mpt1);
                  float steep = u_rock_geo_mode > 0.5 ? max(slopeMag, min(geoSlope, 12.0)) : slopeMag;
                  float cliff = smoothstep(0.7, 1.6, steep);
                  float ledge = smoothstep(0.7, 1.2, slopeC)
                              * (1.0 - smoothstep(0.45, 0.85, slopeMag / max(slopeC, 1e-3)))
                              * (u_rock_geo_mode > 0.5 ? 1.0 - smoothstep(1.5, 2.5, geoSlope) : 1.0);
                  float rib = smoothstep(0.02, 0.3, -cn4);
                  float occ = clamp(0.65 * smoothstep(0.03, 0.35, cn4)
                                  + 0.35 * smoothstep(0.05, 0.45, cn1), 0.0, 1.0);
                  // On pixels whose DRAWN triangle is a wall, the DEM-derived terms (cavity, ledge,
                  //  rib) are constant down a texel column - vertical thread - so they hand over to
                  //  a WORLD-keyed cavity taken from the ridged field itself: its hollows (the
                  //  veins between ridges) darken, smoothly and at low contrast. (A thresholded
                  //  blob mask here read as leopard spots; nothing on a wall is thresholded now.)
                  float geoW = smoothstep(1.2, 2.2, geoSlope);
                  float occWorld = clamp(0.9 * (0.55 - crest), 0.0, 1.0);
                  occ = mix(occ, occWorld, geoW);
                  rib *= (1.0 - geoW);
                  ledge *= (1.0 - geoW);
                  // cavities darken everywhere on rock, more on faces (gentle-ground gullies
                  //  already get the `weathered` albedo shift)
                  materialColor *= 1.0 - u_rock_cavity_strength * occ * (0.5 + 0.5 * cliff);
                  // light catching ledges and ribs: a brightening of albedo (NOT a specular term -
                  //  a sheen on interpolated DEM faces reads as vacuum-formed plastic)
                  materialColor *= 1.0 + u_rock_ledge_light * (0.6 * rib + 0.8 * ledge) * (0.4 + 0.6 * cliff);

                  materialColor = mix(vec3(dot(materialColor, vec3(0.3333))), materialColor, u_rock_contrast);

                  // u_rock_strength keeps its original semantics: 0 = flat original
                  //  palette color, 1 = full effect (procedural material + weathering +
                  //  lichen).
                  color.rgb = mix(color.rgb, materialColor, u_rock_strength * rockFade);


                  // --- bump-perturbed lighting ----------------------------------------
                  // A REAL surface normal perturbed by the fractal's own ANALYTIC
                  // gradient - zero extra noise evaluations - dotted against the shared
                  // screen-anchored sun. Relief scale: treat the fractal as a pseudo-
                  // heightfield ROCK_RELIEF*u_rock_scale meters tall; coupling relief to
                  // feature size keeps the look coherent across the scale slider.
                  // ROUND 14: gradWorld is now the true 3D surface gradient, so the tilt
                  // vector is tangential on ANY slope - round 13's vec3(-g,0) was only a
                  // small-perturbation approximation valid near-horizontal (and cliffs
                  // were exactly where it mattered). Same combine otherwise: plain
                  // additive tilt on macroNormal. 0.12 -> 0.15: blending three planes'
                  // gradients shrinks their variance (~sum w_i^2), the extra relief
                  // restores the round-13 bump read.
                  const float ROCK_RELIEF = 0.15;
                  vec3 detailTilt = -(gradWorld + gradD * 0.5) * (u_rock_scale * ROCK_RELIEF * (1.0 + u_rock_cliff_relief * cliffE));
                  vec3 fullPerturbed = normalize(macroNormal + detailTilt);
                  // mix (not a direct scale of the detail tilt by strength) so
                  //  u_rock_normal_strength = 0 is an EXACT no-op (perturbedNormal ==
                  //  macroNormal bit-for-bit), same invariant as every round before this.
                  vec3 perturbedNormal = normalize(mix(macroNormal, fullPerturbed, u_rock_normal_strength));

                  // Fixed to match hillshade's own default sun (135deg azimuth / 35.264deg
                  //  elevation) via the shared screenAnchoredSunDir (elevation.yaml) - not
                  //  independently GUI-tunable: this is a small micro-facet accent, not the
                  //  macro shading knob Sebastian actually tunes via hillshade's sliders.
                  // Tilt swing mirrors hillshade's u_sun_azimuth_3d / u_sun_elev_3d defaults (200 / 38).
                  vec3 sunDir = tiltedSunDir(135.0, 35.264, 200.0, 38.0, terrainTiltMorph());
                  float nDotLMacro = clamp(dot(macroNormal, sunDir), 0.0, 1.0);
                  float nDotLBump = clamp(dot(perturbedNormal, sunDir), 0.0, 1.0);
                  // DELTA from the unperturbed macro normal, not the absolute dot product -
                  //  this is what keeps the term a pure micro-facet accent instead of a
                  //  second, redundant macro-slope relight (hillshade's translucent
                  //  blend-over already owns macro directional shading - see the plan's
                  //  "Key architectural finding"). ROUND 12 (Sebastian: "same shit as
                  //  before" after rounds 10-11 targeted the wrong mechanism - tracing the
                  //  actual formula instead of guessing again this time): delta has a
                  //  structural range of [-1, 1] (each nDotL independently clamped to
                  //  [0,1]), so round 7's 2x amplification + [0.1, 2.5] clamp could crush
                  //  microLight all the way to 0.1 - a 10x darkening - whenever the
                  //  bump-perturbed normal swings away from the sun relative to the macro
                  //  normal. On real, steep, backlit terrain, combined with the real
                  //  photographic normal-map detail (marble grain/veining) at
                  //  u_rock_normal_strength 1.8, this was very plausibly the actual source
                  //  of BOTH complaints at once: crushed-black patches (not "darker,
                  //  still texture" the way real shadow should read), and - since the
                  //  normal map's own fine photographic variation was being amplified this
                  //  hard - a chaotic high-contrast pattern that read as "torn", not a
                  //  triplanar-blend seam at all (rounds 9-10 fixed a real but secondary
                  //  issue). Floor raised structurally (0.1 -> 0.5, so AT MOST 2x
                  //  darkening regardless of how high u_rock_normal_strength is dialed -
                  //  texture survives by construction, not by picking a "safe" default),
                  //  delta amplification reverted to 1x, ceiling trimmed slightly to match.
                  //  Default strength also pulled back 1.8 -> 1.0 - deeper relief should
                  //  come from dialing the (now much safer) slider up, not from a
                  //  structurally unsafe default.
                  float microLight = clamp(1.0 + (nDotLBump - nDotLMacro), 0.5, 2.0);
                  // Snow dusting: seasonal snow line from latitude (~2800 m at 45 deg, ~1700 m at
                  //  60 deg). Snow lies where the FINAL (detail-perturbed) surface is gentle: that
                  //  is gentle ground AND the up-facing tops of ledges on a wall - the physical
                  //  reason Berann's ledges read, and it follows the invented cliff relief too.
                  //  Favors hollows and is broken up by the fractal so edges are ragged. Applied
                  //  before the micro-light multiply so bump relief still models it.
                  vec3 dbg = vec3(0.0);
                  if (u_rock_snow_strength > 0.0 || u_rock_debug > 0.5) {
                      float latDeg = degrees(atan(0.5 * (unproj - 1.0 / unproj)));
                      float northSign = latDeg >= 0.0 ? 1.0 : -1.0;
                      bool geo2 = u_rock_geo_mode > 1.5;
                      float snowLine = 5000.0 - 55.0 * abs(latDeg)
                                     - (geo2 ? 400.0 * geoN.y * northSign : 0.0);
                      float gate = smoothstep(snowLine - 150.0, snowLine + 350.0, geo2 ? v_world_position.z : hc);
                      float nzp = clamp(perturbedNormal.z, 0.0, 1.0);
                      float tanP = sqrt(max(1.0 - nzp * nzp, 0.0)) / max(nzp, 0.05);
                      // the DRAWN triangle's slope also vetoes snow (a ramp triangle that the DEM
                      //  neighborhood calls "ledge top" is geometrically a wall - it must stay
                      //  rock, so snow ends cleanly at the lip and resumes on the shelf below)
                      float tanG = u_rock_geo_mode > 0.5 ? max(tanP, min(geoSlope, 12.0)) : tanP;
                      float accum = max(1.0 - smoothstep(0.5, 1.3, tanG), 0.9 * ledge);
                      accum *= 0.7 + 0.6 * clamp(cn4 * 4.0, 0.0, 1.0);
                      float snowAmt = smoothstep(0.2, 0.8, clamp(accum * gate, 0.0, 1.0) + (crest - 0.5) * 0.8);
                      snowAmt *= step(0.001, gate);
                      color.rgb = mix(color.rgb, vec3(0.93, 0.95, 0.99), clamp(snowAmt * u_rock_snow_strength, 0.0, 1.0) * rockFade);
                      dbg = vec3(gate, accum, snowAmt);
                  }
                  if (u_rock_debug > 1.5) { dbg = vec3(clamp(steep * 0.5, 0.0, 1.0), clamp(cn4 * 4.0 + 0.5, 0.0, 1.0), ledge); }
                  color.rgb *= mix(1.0, microLight, rockFade);
                  if (u_rock_debug > 0.5) { color.rgb = dbg; }
              }
              #ifdef SNOW_MODE
              color.rgb = applySnow(color.rgb, 1.0);
              #endif
              #ifdef TANGRAM_TERRAIN_3D
              color.rgb = terrainSlopeShade(color.rgb, 1.0);     // macro slope lighting (the veil no longer does it at tilt)
              #endif
              #ifdef SHOW_CONTOURS
              // Land-cover-colored contours (Wanderkarte style): bare rock carries the
              //  default grayish brown. Drawn LAST, outside the rockFade gate above
              //  (contours have their own zoom ladder from z10) and after the material +
              //  micro-lighting so the "ink" is never washed by either - contour lines
              //  are printed cartography on top of the shaded surface, not part of it.
              color.rgb = mix(color.rgb, u_contour_default.rgb, terrainContourCoverage());
              #endif
          }

  # Forest of whole trees (v9). Every tree is real geometry: the tile builder scatters trees on a world-anchored jittered
  #  grid inside the forest polygon (style param tree_scatter, Builders::buildTreeScatter) - one cross of 3 vertical quads per
  #  tree, 12 vertices - and the vertex shader stands them up (height, width, rotation from per-tree randoms). The fragment
  #  shader cuts a spruce silhouette (pointed spire with drooping tiers) out of each quad and shades it by sun side and
  #  height. Trees are opaque with depth write: real height, real silhouettes from the side, the asterisk from above. The tile
  #  carries at most 128^2 trees: spacing is constant in metres from zoom 15 in and doubles per zoom out (so crowns keep a
  #  similar size on screen). Per-tree density thinning near the outline: whole trees, no seam, no shimmer.
  #  The ground between the trees is forest-ground (below): the meadow darkened by canopy shade.
  forest-trees:
    mix: unlit-polygons
    # the hillshade veil does not draw over the crowns (stencil, see hillshade.yaml)
    stencil_write: true
    texcoords: true            # (random, spacing) per tree
    tree_scatter: 20           # projected metres of outline feather: density ramps 0 -> 1 over this
    shaders:
      defines:
        FOREST_TREES: true
      uniforms:
        u_tree_mode: 1.0
        u_tree_spacing: 12.0
        u_tree_height: 26.0    # metres at zoom 15 and closer; trees scale up with the grid spacing when zoomed out
        u_tree_slope_shade: 0.8
        # palette (optometrist-tunable): *_f = top-down value, *_t = fully tilted; blended by terrainTiltMorph()
        u_pf_val_f: 1.04
        u_pf_val_t: 0.92
        u_pf_sat_f: 0.9
        u_pf_sat_t: 1.15
        u_pf_lift_f: 0.2
        u_pf_lift_t: 0.04
        u_pf_hue_f: 0.5
        u_pf_hue_t: 0.7
        u_pf_gap_f: 0.0     # no ambient tint under the forest: the ground is the meadow, unchanged
        u_pf_gap_t: 0.0
        u_pf_shadow_f: 0.2
        u_pf_shadow_t: 0.4
        u_pf_tone_f: 0.7
        u_pf_tone_t: 1.2
        u_pf_haze: 0.5
        u_pf_feather: 20.0
        u_tree_grain: 0.45
        u_tree_min_px: 5.0
        u_tree_max_scale: 4.0
        u_tree_max_aspect: 3.0
        u_tree_contrast: 0.5
        u_tree_conifer: 0.5
        u_tree_lean_cos: 0.35
        u_tree_canopy_contrast: 0.4
        u_tree_canopy_stroke: 1.0
        u_treeline_offset: 0.0
      blocks:
        position: |
          #ifdef FOREST_TREES
          {
              // a_position = the tree's BASE (same for all 12 vertices, so the terrain draping above gives them its elevation);
              //  a_normal = (corner u -1/+1, corner v 0/1, plane index), a_texcoord = (random, grid spacing / 256 m)
              float cu = a_normal.x, cv = a_normal.y;
              float pl = floor(a_normal.z * 127.0 / 40.0 + 0.5);
              float r = a_texcoord.x;
              float sp = a_texcoord.y * 256.0;
              float th = (r + pl) * 1.0472;                                   // 3 planes, 60 degrees apart, random start
              vec2 dir = vec2(cos(th), sin(th));
              // the grid spacing doubles per zoom out (sp0 = 7.64 m from zoom 15 in): crowns grow in proportion, but height only as sp^0.45
              //  and never above 42 m - otherwise the far tiles carry 100 m spires
              float Hh = min(u_tree_height * pow(sp / 7.64, 0.45), 42.0) * (0.7 + 0.6 * fract(r * 13.7));
              float hw = 0.31 * sp * (0.75 + 0.5 * fract(r * 7.3));
              position.xy += dir * (cu * hw);
              position.z += cv * Hh;
              v_tree_a = vec4(cu, cv, pl, r);
              v_tree_dir = dir;
          }
          #endif
        global: |
          // ---- Forest trees v9 (see the style comment above) --------------------------------------------------------------
          varying vec4 v_tree_a;     // (corner u -1..1 across the plane, v 0..1 up, plane, random)
          varying vec2 v_tree_dir;   // the plane's horizontal direction
          const float EDGE_CAP_M = 240.0;                       // keep in sync with edge_distance on forest-ground
          #ifdef TANGRAM_FRAGMENT_SHADER

          // Forest palette + terrain light, expressed in the colour range (dark green .. saturated green), not as a veil.
          //  Flat/tilted pairs (u_pf_*_f / _t) are the optometrist-tunable knobs.
          vec3 treeShade(vec3 col) {
              float tm = terrainTiltMorph();
              vec4 ml = terrainForestLight();
              float k = u_tree_slope_shade;
              vec3 c = col * mix(vec3(1.0), ml.rgb, k);
              float l = dot(c, vec3(0.299, 0.587, 0.114));
              c = max(mix(vec3(l), c, 1.0 + 0.8 * k * (ml.a - 1.0)), 0.0);
              // Niehues/Berann: sunlit slopes drift yellow-green, shaded ones blue-green
              float sunk = clamp(0.5 + 2.0 * (ml.a - 1.0), 0.0, 1.0);
              vec3 tint = mix(vec3(0.90, 1.0, 1.10), vec3(1.08, 1.04, 0.88), sunk);
              c *= mix(vec3(1.0), tint, mix(u_pf_hue_f, u_pf_hue_t, tm));
              c *= mix(u_pf_val_f, u_pf_val_t, tm);
              l = dot(c, vec3(0.299, 0.587, 0.114));
              c = mix(vec3(l), c, mix(u_pf_sat_f, u_pf_sat_t, tm));
              float lift = mix(u_pf_lift_f, u_pf_lift_t, tm);
              return c * (1.0 - lift) + lift;
          }

          // One tree plane's fragment: spruce silhouette cut out of the quad; (colour before the palette grade, keep 0/1).
          vec4 forestTrees(vec3 fill) {
              float u = v_tree_a.x, v = v_tree_a.y, r = v_tree_a.w;
              // pointed spire, drooping tiers: each tier flares at its lower edge and notches above it
              float tier = fract(v * 8.0 + r * 5.0);
              float w = pow(max(1.0 - v, 0.0), 0.85) * (0.60 + 0.40 * (1.0 - tier));
              w = max(w, 0.18 * step(v, 0.1));                       // a trunk stub at the bottom
              float keep = step(abs(u), w);
              float tm = terrainTiltMorph();
              vec3 sunW = normalize(tiltedSunDir(135.0, 35.264, 200.0, 38.0, tm));
              vec2 sunH = normalize(sunW.xy + 1e-5);
              float side = u * dot(v_tree_dir, sunH);                // + on the flank facing the sun
              float lit = smoothstep(-0.7, 0.7, side * 1.3 + 0.2);
              float toneK = mix(u_pf_tone_f, u_pf_tone_t, tm);
              float tone = 1.0 + (r - 0.5) * 0.35 * toneK;
              vec3 g = fill * tone * mix(0.80, 1.06, lit) * mix(0.55, 1.0, smoothstep(0.0, 0.7, v)) * mix(0.9, 1.0, tier);
              g = mix(g * vec3(0.95, 0.99, 1.04), g, lit);           // cool shadow flank
              #ifdef SNOW_MODE
              g = mix(g, vec3(0.95, 0.97, 1.0), snowAmount() * 0.35 * lit * smoothstep(0.3, 0.8, v));
              #endif
              return vec4(mix(fill, g, min(u_tree_contrast * 1.6, 1.0)), keep);
          }

          // Ground pass (forest-ground underlay, a normal meadow polygon): the meadow darkened by the canopy's shade, fading out
          //  toward the outline. v_texcoord.x = distance to the outline / EDGE_CAP_M (baked into the vertices by the tile builder).
          vec4 forestGroundShade() {
              float sUn = exp(u_map_position.y / 6378137.0);
              float cosLat = 2.0 / (sUn + 1.0 / sUn);
              float tm = terrainTiltMorph();
              float feather = min(u_pf_feather / cosLat, 0.95 * EDGE_CAP_M);
              float d0 = v_texcoord.x * EDGE_CAP_M;
              float wM = 1.0 - smoothstep(0.0, 0.6 * feather, d0);
              float snowAmt = 0.0;
              #ifdef SNOW_MODE
              snowAmt = snowAmount();
              #endif
              float sA = mix(u_pf_gap_f, u_pf_gap_t, tm) * (1.0 - wM) * (1.0 - 0.6 * snowAmt) * step(0.5, u_tree_mode);
              return vec4(0.05, 0.08, 0.11, clamp(sA, 0.0, 1.0));
          }
          #endif

  # The meadow below a forest: a normal (opaque, veiled) meadow polygon, darkened by the canopy shade. Same edge distance
  #  as the fade; forest-trees then draws only the trees over it.
  forest-ground:
    mix: forest-trees
    blend: opaque
    stencil_write: false
    tree_scatter: 0
    terrain_grid: 128
    texcoords: true
    edge_distance: 240
    shaders:
      defines:
        FOREST_TREES: false
        FOREST_GROUND: true

  ocean-polygons:
    base: polygons
    # Curved world: the terrain mesh sinks with distance (terrain-3d position block), but this style used
    #  to be plain flat geometry at z=0, so in tilted views the ocean floated above the bent horizon.
    #  The terrain mixin (empty/undefined in 2D-only scenes) applies the same drop; terrain_grid
    #  tessellates the big ocean polygons because the drop is nonlinear (chords would sag).
    mix: global.terrain_3d_mixin
    terrain_grid: 128
    lighting: false
    # need to match depth_shift in raster style or ocean will be placed under terrain
    shaders:
      blocks:
        position: |
          #ifdef TANGRAM_TERRAIN_3D
          depth_shift = -0.02*u_proj[2][3];
          #endif

  # Ski runs, lifts: draped features that z-fought the terrain. The translucent hillshade veil gets a
  #  slope-aware depth shift toward the camera (terrain_depth_slope, up to 5x) while draped geometry
  #  only gets the flat terrain_depth_shift, so on slopes the veil (and the terrain) won the depth
  #  test over the feature. Same fix as the trail style: scale the feature's own shift.
  lifted-lines:
    mix: unlit-lines
    shaders:
      defines:
        LIFT_DEPTH_BOOST: global.lift_depth_boost
      blocks:
        position: |
          #ifdef TANGRAM_TERRAIN_3D
          depth_shift *= float(LIFT_DEPTH_BOOST);
          #endif
  # Piste areas overlap forest/scrub polygons (the run IS cleared forest); the shift also makes them
  #  win against those coplanar polygons whatever the draw order, instead of z-fighting them.
  lifted-polygons:
    mix: unlit-polygons
    # terrain_grid is NOT inherited through mix (see rock-texture's comment): without it the
    #  polygons are not tessellated to the terrain lattice and cut across relief
    terrain_grid: 128
    shaders:
      defines:
        LIFT_DEPTH_BOOST: global.lift_depth_boost
      blocks:
        position: |
          #ifdef TANGRAM_TERRAIN_3D
          depth_shift *= float(LIFT_DEPTH_BOOST);
          #endif

  # dash only supported for styles, not draw block because each dash pattern requires separate shader
  dashed-border: { mix: unlit-lines, dash: [2.0, 0.5] }
  dashed-path: { mix: unlit-lines, dash: [3.0, 0.5] }
  # Hiking trails: continuous lines (scrambles use trail-dashed). Two things beyond unlit-lines:
  #  1. Far-field cull. In tilted views distant trails shrink to sub-pixel aliased spiderweb that
  #     costs fill/overdraw for nothing. The criterion is the fragment's ground sample distance
  #     relative to the view center, expressed as an "effective zoom" (view zoom minus log2 of
  #     how much coarser this fragment is than the center): trails fade out between
  #     global.trail_far_zoom +/- 0.5. Top-down views have effective zoom ~= view zoom, so they
  #     are never culled (the zoom ladder in the layer handles those); a tilted view keeps
  #     trails as far as the map would still show them at that zoom, however distance and
  #     camera height combine.
  #  2. Depth boost. Trails sat UNDER the translucent hillshade veil on slopes, which reads as
  #     patches of lighter, washed-out trail: the veil mesh gets a slope-aware depth shift
  #     toward the camera (terrain_depth_slope, up to 5x) while draped lines only get the flat
  #     terrain_depth_shift. Boosting the trails' shift keeps them in front of the veil.
  trail:
    mix: unlit-lines
    shaders:
      defines:
        TRAIL_DEPTH_BOOST: global.trail_depth_boost
      uniforms:
        u_trail_far_zoom: global.trail_far_zoom
      blocks:
        position: |
          #ifdef TANGRAM_TERRAIN_3D
          depth_shift *= float(TRAIL_DEPTH_BOOST);
          #endif
        filter: |
          #ifdef TANGRAM_TERRAIN_3D
          {
              float tGsd = max(length(dFdx(v_world_position.xy)), length(dFdy(v_world_position.xy)));
              float tZeff = u_map_position.z - log2(max(tGsd / u_meters_per_pixel, 1e-3));
              color.a *= smoothstep(u_trail_far_zoom - 0.5, u_trail_far_zoom + 0.5, tZeff);
              if (color.a <= 0.003) { discard; }
          }
          #endif
  trail-dashed: { mix: trail, dash: [2.0, 1.0] }
  dashed-track: { mix: unlit-lines, dash: [2.5, 1.0] }
  dashed-steps: { mix: unlit-lines, dash: [0.5, 0.5] }
  dashed-bike: { mix: unlit-lines, dash: [1.0, 1.0] }
  dashed-rail: { mix: unlit-lines, dash: [4.0, 4.0] }
  #rail-sleepers: { mix: unlit-lines, dash: [0.15, 7.0] }
  # double dashed ... looks nice, but hard to see on lighter backgrounds
  #    blocks.color: if(abs(v_texcoord.x - 0.5) < 0.20) { discard; }

  aerialway:
    mix: unlit-lines
    # both approaches have issue w/ circles being stretched due to change of line width w/ zoom
    #blend: nonopaque; texcoords: true; shaders: defines: { dotSize: 0.2 }; blocks.color: |
    #  vec2 st = vec2(v_texcoord.x, 4.0*fract(v_texcoord.y / 4.0)) - 0.5;
    #  color.a = 1. - step(dotSize, dot(st,st)*2.);
    texture: |
      data:image/svg+xml;utf8,<svg width="10pt" height="40pt" viewBox="-5 -20 10 40">
        <g fill="#fff"> <circle cx="0" cy="0" r="4"/> </g>
      </svg>

  piste-direction:
    mix: lifted-lines
    texture: |
      data:image/svg+xml;utf8,<svg width="10pt" height="80pt" viewBox="-5 -40 10 80">
        <g fill="#fff"> <path d="M-5 -40 L-5 0 L0 -4 L5 0 L5 -40Z M-5 40 L-5 6 L0 2 L5 6 L5 40Z"/> </g>
      </svg>

  inner-lines:
    mix: unlit-lines
    blend: nonopaque
    texcoords: true
    shaders:
      blocks:
        color: |
          if (v_texcoord.x < 0.5) { discard; }

  # Park / protected-area edge band (Builders::buildPolygonEdgeBand): a polygon rule with
  #  `outline: width` makes the polygon builder emit a soft strip along the INSIDE of the edge,
  #  every vertex draped on the terrain; v_texcoord.x = 0 on the boundary, 1 at the inner edge.
  # Protected-area edge band. Geometry: Builders::buildPolygonEdgeBand, whose vertices sit on the
  #  boundary and are pushed inward in polygon.vs (TANGRAM_EDGE_BAND) by EDGE_BAND_PX screen pixels.
  #  Colour: the rule's colour inside, a darker solid line on the boundary itself, both switching to
  #  blue where the boundary runs over water (a_normal.z < 0).
  park-edge-base:
    base: polygons
    mix: global.terrain_3d_mixin
    lighting: false
    blend: inlay   # no depth write: overlapping bands / tile fragments must not occlude each other
    texcoords: true
    terrain_grid: 256
    shaders:
      defines:
        TANGRAM_EDGE_BAND: true
        EDGE_BAND_PX: 16.0
      uniforms:
        u_edge_line_land: global.color.park_edge_line_u
        u_edge_band_water: global.color.park_edge_water_band_u
        u_edge_line_water: global.color.park_edge_water_line_u
      blocks:
        global: |
          varying float v_water;   // 1 where the boundary runs over water
          varying float v_edge;    // boundary line thickness as a fraction of the band depth
        position: |
          #ifdef TANGRAM_TERRAIN_3D
          depth_shift *= 3.0;   // an overlay on the ground: never lose the depth test to it
          #endif
          v_water = a_normal.z < 0.0 ? 1.0 : 0.0;
          {
              float lineUnits = clamp(0.8 + 0.1 * (u_map_position.z - 8.0), 0.8, 2.0) * u_meters_per_pixel / u_model[0][0];
              v_edge = clamp(lineUnits / max(edgeBandExtent(), 1e-9), 0.0, 1.0);
          }
        color: |
          // solid boundary line over a soft band; blue instead of green over water
          vec3 band = mix(color.rgb, u_edge_band_water.rgb, v_water);
          vec3 edge = mix(u_edge_line_land.rgb, u_edge_line_water.rgb, v_water);
          float onLine = 1.0 - smoothstep(0.6 * v_edge, v_edge, v_texcoord.x);
          color.rgb = mix(band, edge, onLine);
          color.a = mix(color.a, 0.95, onLine);

  park-edge-fade:
    mix: park-edge-base
    shaders:
      blocks:
        color: |
          float f = 1.0 - v_texcoord.x;
          color.a *= smoothstep(0.0, 1.0, f);

  park-edge-hatch:
    mix: park-edge-base
    shaders:
      blocks:
        color: |
          // 45 degree hatching in screen space, 2 px strokes every 6 px, fading inward
          float h = mod(gl_FragCoord.x + gl_FragCoord.y, 6.0);
          color.a *= (1.0 - 0.7 * v_texcoord.x) * smoothstep(0.0, 1.0, 2.5 - abs(h - 2.0) * 1.2);

layers:
  landuse:
    data: { source: osm, layer: landuse }
    enabled: global.show_land_polygons
    draw:
      polygons:
        visible: false
        style: global.earth_style
        order: global.landcover_order_fn
        color: global.color.landuse
    forest:
      filter: [{ landuse: forest }, { natural: wood }]
      draw:
        polygons: { visible: true, color: global.color.forest, style: global.forest_style }
        # meadow colour below the trees (forest-trees leaves the ground between the crowns transparent), one order lower
        ground:
          visible: function() { return global.forest_style === 'forest-trees'; }
          style: forest-ground
          color: global.color.grass
          order: function() { return 589 - Math.log(feature.area || 1); }
    scrub:
      filter: { natural: [scrub, fell, heath] }
      draw: { polygons: { visible: true, color: global.color.scrub } }
    grass:
      filter:
        - landuse: [grass, allotments, meadow]
        - natural: [grassland, grass]
      draw: { polygons: { visible: true, color: global.color.grass } }
    wetland:
      filter: [{ natural: wetland }]
      draw: { polygons: { visible: true, color: global.color.wetland } }
    beach:
      filter: [{ natural: [beach, sand] }]
      draw: { polygons: { visible: true, color: global.color.beach } }
    ice:
      filter: [{ natural: glacier }]
      draw: { polygons: { visible: true, color: global.color.ice, style: unlit-polygons-alpine } }
    rock:
      filter: [{ natural: [bare_rock] }]
      draw: { polygons: { visible: true, color: global.color.rock, style: rock-texture } }
    scree:
      filter: [{ natural: [scree] }]
      draw: { polygons: { visible: true, color: global.color.scree, style: unlit-polygons-alpine } }
    farmland:
      filter:
        landuse:
          [
            farmland,
            farmyard,
            farm,
            orchard,
            vineyard,
            plant_nursery,
            greenhouse_horticulture,
          ]
      draw: { polygons: { visible: true, color: global.color.farmland } }
    # golf course can be inside park, so make sure it is drawn on top
    golf:
      filter: { leisure: [golf_course, pitch] }
      draw:
        {
          polygons:
            {
              visible: true,
              order: global.order.golf,
              color: global.color.golf,
            },
        }
    park:
      filter:
        - landuse: [recreation_ground, village_green]
        - leisure: [park, garden]
      draw:
        {
          polygons:
            {
              visible: true,
              order: global.order.parks,
              color: global.color.parks,
            },
        }
    green:
      filter:
        [
          { tourism: zoo },
          { landuse: cemetery },
          { leisure: [playground, pitch] },
        ]
      draw:
        {
          polygons:
            {
              visible: true,
              order: global.order.park_detail,
              color: global.color.park_detail,
            },
        }
    # landuse polygons - default order is global.order.landuse (draws under landcover)
    retail:
      filter: { landuse: [retail] } #industrial, commercial
      draw:
        {
          polygons:
            {
              visible: true,
              order: global.order.retail,
              color: global.color.retail,
            },
        }
    commercial:
      filter: { landuse: [commercial, industrial] }
      draw:
        {
          polygons:
            {
              visible: true,
              order: global.order.commercial,
              color: global.color.industry,
            },
        }
    civic:
      filter: { amenity: [university, college] }
      draw:
        {
          polygons:
            {
              visible: true,
              order: global.order.civic,
              color: global.color.civic,
            },
        }
    military:
      filter: [{ landuse: military }, { amenity: prison }]
      draw:
        {
          polygons:
            {
              visible: true,
              order: global.order.civic,
              color: global.color.military,
            },
        }
    #urban:
    #    filter: { kind: urban_area }
    #    draw: { polygons: { color: [[7, global.color.urban_7], [9, global.color.urban_9]] } }

  protected_area:
    data: { source: osm, layer: landuse }
    #enabled: global.show_polygons
    filter:
      - { boundary: national_park, $zoom: { min: 8 } }
      - { protect_class: ["1", "1a", "1b", "2", "3", "4", "5"], $zoom: { min: 10 } } #boundary: protected_area,
      # unclassed nature reserves (ecological reserves etc.); working/utility classes excluded
      - { leisure: nature_reserve, not: { protect_class: ["6", "7", "12", "14", "22", "97", "98"] }, $zoom: { min: 10 } }
      #- { leisure: nature_reserve, protect_class: ['1', '1a', '1b', '2', '3'], $zoom: { min: 10 } }
    selected:
      draw:
        lines:
          visible: global.is_selected_fn
          style: dashed-border #unlit-lines
          order: global.order.border
          color: global.color.selected
          width: 1.5px
    default:
      # (This used to require global.show_land_polygons or tile zoom <= 11, which hid the
      #  edge at every useful zoom on the 3D terrain scene, where land polygons are off.)
      filter: { name: true }
      draw:
        # Cartographic park edge: a darker solid line on the true boundary plus a wide, soft,
        #  semi-transparent green band on the INSIDE (fading out / hatched, see global.park_edge_style).
        band:
          style: global.park_edge_style
          order: global.order.border_inner
          color: global.color.park_edge_band
          alpha: 0.7
          # 1.4 x the park name's letter size (11.5px); screen px at the zoom the tile was built at
          outline: { width: 16px }

  # Phase 5 (docs/label-placement-plan.md): national-park / protected-area / forest labels,
  # drawn from the actual `landuse` polygon geometry so TextStyleBuilder can curve the
  # label along an elongated shape's principal axis. This replaces the pre-baked centroid
  # point that `pois > landuse` used to draw for most of these types (now disabled there,
  # see the comment at that rule) -- filter conditions mirror it exactly for visual parity
  # otherwise. Exception: glacier, which stays on the old centroid-point path (see the
  # glacier rule under pois > landuse) because the tile schema doesn't put a name on the
  # glacier polygon, only on the centroid point.
  landuse_name:
    data: { source: osm, layer: landuse }
    exclusive: true
    filter:
      name: true
      area: { min: 1500px2 }
      # give park POI (w/ icon) priority
      not: { leisure: [park, golf_course] }
      any:
        - { boundary: national_park, $zoom: { min: 8 }, none: [global.world_area_labels] }
        - {
            protect_class: ["1", "1a", "1b", "2", "3", "4", "5"],
            $zoom: { min: 10 },
            none: [global.world_area_labels],
          }
        - { leisure: nature_reserve, $zoom: { min: 10 }, none: [global.world_area_labels] }
        - { protect_class: ["6", "7", "12", "14", "22", "97", "98"], $zoom: { min: 10 } }
        - { landuse: [commercial, retail, winter_sports], $zoom: { min: 12 } }
        - {
            landuse: [industrial, military],
            area: { min: 5000px2 },
            $zoom: { min: 10 },
          }
        - { amenity: prison, area: { min: 5000px2 }, $zoom: { min: 12 } }
    draw:
      text:
        interactive: true
        text_source: global.names_one_line
        transition: { show: { time: 0s }, hide: { time: 1s } }
        max_lines: 4
        priority: global.priority.forest
        # Protected land: small tracked capitals in park green, stretched to fill the
        #  area ("N A T I O N A L   P A R K" across the park, along its spine when it is
        #  elongated). Medium weight - at 10-11px tracked caps in a light weight dissolve
        #  into the land-cover tint behind them.
        font:
          family: global.natural_font
          weight: 500
          size: [[8, 10.5px], [11, 11.5px], [13, 12.5px]]
          transform: uppercase
          # Area label (see docs/label-typography.md): the engine picks 1-3 lines or a line
          #  along the spine, stretches tracking (min..max em) and line spacing to the room,
          #  and drops the label when it does not fit INSIDE the park.
          letter_spacing: 0.14
          letter_spacing_fit: 0.85
          letter_spacing_max: 1.8
          fill: global.color.park_name
          stroke: { color: global.color.park_halo, width: 3.8 }
    commercial:
      filter:
        - { landuse: [commercial, retail, industrial, military, winter_sports] }
        - { amenity: prison }
      draw:
        text:
          # Man-made land use: condensed grey, still tracked a little as an area name,
          #  but visibly a different voice from the green natural-area names above.
          font:
            family: global.condensed_font
            weight: 400
            size: 10px
            letter_spacing: 0.1
            letter_spacing_fit: 0.0
            fill: global.color.landuse_name
            stroke: { color: global.color.default_halo, width: 2 }
    # Working / utility protected land (watersheds, managed forest, historic sites): named, but
    #  in the quiet grey voice of other land use rather than park green (and no green edge).
    utility_protected:
      filter: { protect_class: ["6", "7", "12", "14", "22", "97", "98"] }
      draw:
        text:
          font:
            family: global.condensed_font
            weight: 400
            size: 10px
            letter_spacing: 0.1
            letter_spacing_fit: 0.5
            fill: global.color.landuse_name
            stroke: { color: global.color.default_halo, width: 2 }
    national_park:
      filter: { boundary: national_park }
      draw:
        text:
          priority: global.priority.national_park
          font:
            weight: 600
            size: [[7, 10.5px], [10, 12px], [13, 14px]]
            letter_spacing: 0.2
            letter_spacing_max: 2.0
    # glacier is deliberately absent here: process.lua never sets a name attribute on
    # the glacier *polygon* written to the landuse layer (only on the pois>landuse
    # centroid point), so this filter can never match a glacier feature -- see the
    # glacier rule under pois > landuse, which is the real (non-superseded) label source.
    # don't show label for huge area (where boundries may be offscreen) beyond z12
    hide:
      filter:
        [
          { access: [no, private] },
          { area: { min: 350000px2 }, $zoom: { min: 12 } },
        ]
      draw: { text: { visible: false } }

  # Glacier names as AREA labels (off until the tile server puts `name` on glacier polygons,
  # see global.glacier_polygon_labels): the engine breaks the name into lines / bends it along
  # the ice, tracks it out, and drops it if it would spill off the glacier. Italic like water.
  # Debug aid (global.debug_area_outlines): the polygons the area-label planner sees.
  debug_outline_landuse:
    enabled: global.debug_area_outlines
    data: { source: osm-areas, layer: landuse }
    filter:
      $geometry: polygon
      any:
        - { natural: glacier }
        - { name: true }
    glacier:
      filter: { natural: glacier }
      draw: { lines: { style: unlit-lines, order: 900, color: "#00bcd4", width: 1.5px } }
    named:
      filter: { not: { natural: glacier } }
      draw: { lines: { style: unlit-lines, order: 900, color: "#e91e63", width: 1.5px } }

  debug_outline_water:
    enabled: global.debug_area_outlines
    data: { source: osm-areas, layer: water }
    filter: { $geometry: polygon, name: true }
    draw: { lines: { style: unlit-lines, order: 900, color: "#ff9800", width: 1.5px } }

  # --- world-space area labels ------------------------------------------------------------
  # Tile side: the `area-labels` style emits no label here, it deposits each named polygon
  #  fragment (world meters) into the scene's AreaRegistry. Not zoom dependent: a data tile is
  #  deposited once. `area` is in m2 (whole feature).
  area_fragments_water:
    enabled: global.world_area_labels
    data: { source: osm-areas, layer: water }
    filter: { $geometry: polygon, name: true, area: { min: 30000 } }
    draw: { fragments: { style: area-labels, order: 1 } }

  area_fragments_glacier:
    enabled: global.world_area_labels
    data: { source: osm-areas, layer: landuse }
    filter: { $geometry: polygon, name: true, natural: glacier, area: { min: 30000 } }
    draw: { fragments: { style: area-labels, order: 1 } }

  area_fragments_park:
    enabled: global.world_area_labels
    data: { source: osm-areas, layer: landuse }
    filter:
      $geometry: polygon
      name: true
      not: { leisure: [park, golf_course] }
      any:
        - { boundary: national_park }
        - { protect_class: ["1", "1a", "1b", "2", "3", "4", "5"] }
        - { leisure: nature_reserve }
    draw: { fragments: { style: area-labels, order: 1 } }

  # Marker side: draw rules AreaLabelManager's markers are styled with
  #  (layers.area_label_<kind>.draw.text). The layer matches no real data (the `area_label_marker`
  #  MVT layer does not exist); it only carries the rule. The marker feature is a part's spine.
  area_label_water:
    data: { source: osm-areas, layer: area_label_marker }
    draw:
      text:
        style: area-labels
        interactive: true
        text_source: global.names_one_line
        transition: { show: { time: 0s }, hide: { time: 0.15s } }
        priority: global.priority.water
        font:
          family: global.natural_font
          weight: 400
          style: italic
          size: |
            function() {
                var a = feature.area || 0;
                return a > 4e8 ? 19 : a > 4e7 ? 16 : a > 4e6 ? 14 : a > 4e5 ? 12.5 : 11.5;
            }
          letter_spacing: 0.06
          letter_spacing_fit: 0.8
          letter_spacing_max: 1.2
          fill: global.color.water_name
          stroke: { color: global.color.water_halo, width: 3 }

  area_label_park:
    data: { source: osm-areas, layer: area_label_marker }
    draw:
      text:
        style: area-labels
        interactive: true
        text_source: global.names_one_line
        transition: { show: { time: 0s }, hide: { time: 0.15s } }
        priority: global.priority.forest
        font:
          family: global.natural_font
          weight: 500
          size: [[8, 10.5px], [11, 11.5px], [13, 12.5px]]
          transform: uppercase
          letter_spacing: 0.14
          letter_spacing_fit: 0.85
          letter_spacing_max: 1.8
          fill: global.color.park_name
          stroke: { color: global.color.park_halo, width: 3.8 }

  area_label_park_national:
    data: { source: osm-areas, layer: area_label_marker }
    draw:
      text:
        style: area-labels
        interactive: true
        text_source: global.names_one_line
        transition: { show: { time: 0s }, hide: { time: 0.15s } }
        priority: global.priority.national_park
        font:
          family: global.natural_font
          weight: 600
          size: [[7, 10.5px], [10, 12px], [13, 14px]]
          transform: uppercase
          letter_spacing: 0.2
          letter_spacing_fit: 0.85
          letter_spacing_max: 2.0
          fill: global.color.park_name
          stroke: { color: global.color.park_halo, width: 3.8 }

  area_label_glacier:
    data: { source: osm-areas, layer: area_label_marker }
    draw:
      text:
        style: area-labels
        interactive: true
        transition: { show: { time: 0s }, hide: { time: 0.15s } }
        text_source: |
          function() {
              var n = (global.show_name_en && feature.name_en ? feature.name_en : feature.name) || "";
              return n.split(" / ")[0];
          }
        priority: global.priority.water
        font:
          family: global.natural_font
          weight: 400
          style: italic
          size: |
            function() {
                var a = feature.area || 0;
                return a > 5e7 ? 16 : a > 1e7 ? 14.5 : a > 2e6 ? 13 : 12;
            }
          letter_spacing: 0.1
          letter_spacing_fit: 0.8
          letter_spacing_max: 1.2
          fill: global.color.glacier_name
          stroke: { color: global.color.glacier_halo, width: 3.5 }

  landuse_glacier_name:
    enabled: global.glacier_polygon_labels
    data: { source: osm, layer: landuse }
    exclusive: true
    filter: { name: true, natural: glacier, area: { min: 9000px2 }, $zoom: { min: 10 }, none: [global.world_area_labels] }
    draw:
      text:
        interactive: true
        # First of the "A / B" names; a compound "...gletscher" gets a soft hyphen (the "\n"),
        #  used by the area label planner only if it has to break the name.
        text_source: |
          function() {
              var n = (global.show_name_en && feature.name_en ? feature.name_en : feature.name) || "";
              n = n.split(" / ")[0];
              return n.replace(/([A-Za-zäöüÄÖÜß]{4,})(gletscher|ferner|kees|firn)$/i, "$1\n$2");
          }
        priority: global.priority.water
        smooth: 30px
        font:
          family: global.natural_font
          weight: 400
          style: italic
          size: |
            function() {
                var a = feature.area || 0;
                return a > 5e7 ? 16 : a > 1e7 ? 14.5 : a > 2e6 ? 13 : 12;
            }
          letter_spacing: 0.1
          letter_spacing_fit: 0.8
          letter_spacing_max: 1.2
          fill: global.color.glacier_name
          stroke: { color: global.color.glacier_halo, width: 3.5 }

  landuse_misc:
    data: { source: osm, layer: landuse }
    glacier:
      # show glacier outline for 3d (since we want to still show name); too busy at low zooms
      enabled: global.show_polygons
      filter:
        {
          natural: glacier,
          $zoom: { min: 10 },
          none: [global.show_land_polygons],
        }
      draw:
        lines:
          style: dashed-border
          color: global.color.ice
          order: global.order.pier
          width: 1.5px
    pier_areas:
      enabled: global.show_polygons
      filter: { man_made: [pier, breakwater, groyne], $geometry: polygon }
      draw:
        polygons:
          style: unlit-polygons
          order: global.order.pier
          color: global.color.breakwater
      pier:
        filter: { man_made: pier }
        draw: { polygons: { color: global.color.pier } }
    pier_lines:
      enabled: global.show_polygons
      filter: { man_made: [pier, breakwater, groyne], $geometry: line }
      pier:
        {
          filter: { man_made: pier },
          draw: { lines: { color: global.color.pier } },
        }
      draw:
        lines:
          style: unlit-lines
          order: global.order.pier
          color: global.color.breakwater
          width:
            [
              [13, 0px],
              [14, 0.5px],
              [15, 1.5px],
              [16, 2.5px],
              [17, 3px],
              [18, 3m],
            ]
    # Relief names that are *lines* in the tile data (natural=valley/gorge, mountain_range
    #  spines; `area` is the square of the line's length): set along the feature, smoothed so
    #  the type follows the large-scale shape of the ridge/valley and not its digitizing
    #  noise, and tracked out so the name reads as extent, not as a point.
    valley:
      filter:
        {
          natural: [valley, gorge],
          name: true,
          $zoom: { min: 9 },
          area: { min: 40000px2 },
        }
      draw:
        text:
          text_source: global.names_one_line
          transition: { show: { time: 0s }, hide: { time: 1s } }
          priority: global.priority.valley
          repeat_distance: 420px
          smooth: 36px
          font:
            family: global.natural_font
            weight: 400
            size: [[9, 11px], [12, 12px], [14, 13px]]
            letter_spacing: 0.22
            fill: global.color.valley_name
            stroke: { color: global.color.valley_halo, width: 3.5 }
      gorge:
        filter: { natural: gorge }
        draw:
          text:
            font: { weight: 500, letter_spacing: 0.12 }
    # Ranges: the biggest type on the physical map and the lightest touch. UPPERCASE,
    #  Light weight at display size, tracked wide - the Imhof/Swisstopo "Gebirgsname".
    #  Spine lines and (rarely) polygons both occur; polygons fall through to the polygon
    #  spine path in TextStyleBuilder.
    mountain_range:
      filter:
        {
          natural: mountain_range,
          name: true,
          $zoom: { min: 7, max: 14 },
        }
      draw:
        text:
          text_source: global.names_one_line
          transition: { show: { time: 0s }, hide: { time: 1s } }
          # a range name outranks peaks while zoomed out, yields to them once the peaks
          #  are the point of the view (function: priority has no zoom stops)
          priority: |
            function() { return $zoom < 11 ? 13.5 : 14.9; }
          repeat_distance: 560px
          smooth: 48px
          font:
            family: global.natural_font
            weight: 300
            size: [[7, 13px], [9, 16px], [11, 21px], [13, 26px]]
            transform: uppercase
            letter_spacing: 0.42
            letter_spacing_fit: 0.75
            letter_spacing_max: 0.9
            fill: global.color.range_name
            stroke: { color: global.color.range_halo, width: 3.5 }

  water:
    data: { source: osm, layer: water }
    enabled: global.show_polygons
    filter: { $geometry: polygon }
    draw:
      polygons:
        style: unlit-polygons
        order: global.order.water
        color: global.color.water
    ocean:
      # world map tiles (z7 and below) still use class: ocean
      filter: [{ water: ocean }, { class: ocean }]
      # ensure that ocean has elevation = 0 (by not writing elevation)
      draw: { polygons: { style: ocean-polygons } }
    intermittent:
      filter: { intermittent: true }
      hide:
        filter: { $zoom: { max: 10 } }
        draw: { polygons: { visible: false } }
      draw:
        polygons:
          # draw border line instead of polygon (probably should rename draw group)
          style: dashed-track
          width: 2px #[[10,0px],[11,1px],[15,2px]]

  water_name:
    data: { source: osm, layer: water }
    # Phase 5 (docs/label-placement-plan.md): read the actual water polygon geometry (not
    # just the legacy point layer) so TextStyleBuilder can curve the label along an
    # elongated lake's principal axis; $geometry: point stays as a fallback for the rare
    # cases (e.g. natural=bay tagged on a single node) where only a point exists.
    filter:
      name: true
      all:
        - any: [{ $zoom: { min: 17 } }, { area: { min: 500px2 } }]
        - any:
            # the centroid point is the old planner's fallback; with world-space labels it only
            #  names the ponds too small to be in the registry (area < 30000 m2)
            - { $geometry: point, any: [{ none: [global.world_area_labels] }, { area: { max: 30000 } }] }
            - { $geometry: polygon, none: [global.world_area_labels] }
    draw:
      text:
        interactive: true
        text_source: global.names_one_line
        transition: { show: { time: 0s }, hide: { time: 1s } }
        priority: global.priority.water
        smooth: 22px
        font:
          family: global.natural_font
          weight: 400
          style: italic
          # Hydrography is the one place Imhof wants italic: the slant echoes flow. Water
          #  names scale with the water body (a pond is not set like a lake): size by
          #  area, and a lake name is tracked to span its water -- "L a c   L é m a n".
          size: |
            function() {
                var a = feature.area || 0;
                return a > 4e8 ? 19 : a > 4e7 ? 16 : a > 4e6 ? 14 : a > 4e5 ? 12.5 : 11.5;
            }
          letter_spacing: 0.06
          letter_spacing_fit: 0.8
          letter_spacing_max: 1.2
          fill: global.color.water_name
          stroke: { color: global.color.water_halo, width: 3 }
    oceans:
      filter: { water: ocean, $zoom: { min: 1, max: 8 } }
      draw:
        text:
          font:
            size: 14px
            weight: 300
            letter_spacing: 0.5
            letter_spacing_fit: 0.0
    intermittent:
      filter: { intermittent: true, $zoom: { max: 10 } }
      draw: { text: { visible: false } }

  waterway:
    data: { source: osm, layer: water }
    enabled: global.show_polygons
    filter: { $geometry: line }
    draw:
      lines:
        style: unlit-lines
        order: global.order.waterway
        color: global.color.water
        width: [[10, 0px], [11, 1px], [15, 2px]]
    unnamed:
      # very large number of unnamed streams in, e.g., Italy (many that should be tagged intermittent?)
      filter: { name: false }
      draw: { lines: { width: [[12, 0px], [12, 0.5px], [14, 1px], [16, 2px]] } }
    river:
      filter: { waterway: river }
      draw: { lines: { width: [[7, 0.5px], [8, 1px], [12, 2px], [15, 4px]] } }
    tunnel:
      filter: { tunnel: true }
      draw: { lines: { style: dashed-track, color: global.color.water_tunnel } }
    intermittent:
      filter: { intermittent: true }
      draw: { lines: { style: dashed-bike } }
      stream:
        filter: { waterway: stream }
        draw:
          { lines: { width: [[15, 0px], [15, 0.5px], [16, 1.5px], [19, 2px]] } }

  waterway_name:
    data: { source: osm, layer: water }
    filter:
      name: true
      #waterway: true
      $geometry: line
      any: [{ $zoom: { min: 17 } }, { waterway: river }]
    draw:
      text:
        text_source: global.names_one_line
        priority: global.priority.waterway
        #buffer: 3px
        # Rivers meander and the data has a vertex every few metres: smooth the path so
        #  the italic follows the river's course, not its jitter. Slight tracking keeps
        #  small italic type from clotting on the curves.
        smooth: 18px
        # Beside the river, not across its banks: the label path is shifted up/left of the
        #  reading direction by about half the cap height plus a gap.
        path_offset: 8px
        font:
          family: global.natural_font
          weight: 500
          fill: global.color.water_name
          stroke: { color: global.color.water_halo, width: 3 }
          style: italic
          letter_spacing: 0.08
          size: [[11, 0px], [12, 11.5px], [14, 12.5px], [16, 13.5px], [17, 15px]]

  transportation:
    data: { source: osm, layer: transportation }
    filter: { aeroway: false }
    draw:
      lines:
        style: unlit-lines
        color: global.color.road
        width: 0
        order: global.order.transportation
        outline:
          visible: global.show_polygons
          color: [[16, global.color.casing_16], [18, global.color.casing_18]]
          width: 0 #[[15, 0], [16, 2]]
          order: global.order.transportation_casing # put all outlines below all roads
    rounded:
      filter: { $zoom: { min: 18 } }
      draw: { lines: { cap: round } }
    # layers are evaluated in order of incr priority, with default being INT_MAX, so for exclusive layers
    #  smallest number wins, but for non-exclusive largest number wins (overwrites others), so to override
    #  layer w/ equal (e.g., default) priority, we have to use reverse alphabetical sort
    "!bridge":
      filter: { brunnel: bridge }
      draw:
        lines:
          order: global.order.bridge
          outline: { order: global.order.bridge_casing }
    "!tunnel":
      filter: { brunnel: tunnel, $zoom: { min: 12 } }
      draw:
        lines:
          order: global.order.tunnel
          color: global.color.tunnel
          outline:
            {
              order: global.order.tunnel_casing,
              color: global.color.tunnel_casing,
            }

    motorway:
      filter: { highway: [motorway, motorway_link] }
      draw:
        lines:
          order: global.order.motorway
          color: global.color.motorway_muted
          width: [[4, 0], [5, 1px], [8, 1.5px], [14, 2px], [15, 12]]
          outline: { width: [[14, 0], [14, 1]] }
      unmute:
        enabled: global.show_motorways
        draw: { lines: { color: global.color.motorway } }
      "!tunnel":
        filter: { brunnel: tunnel, $zoom: { min: 12 } }
        draw:
          {
            lines:
              {
                order: global.order.tunnel,
                color: global.color.motorway_tunnel,
              },
          }
      link:
        filter: [{ highway: motorway_link }, { ramp: true }]
        draw: { lines: { width: [[13, 0], [13, 1.5px], [15, 9]] } } #color: global.color.motorway_link

    trunk:
      filter: { highway: [trunk, trunk_link], $zoom: { min: 8 } } # z7 would be better for US
      draw:
        lines:
          order: global.order.major_road
          width: [[8, 1px], [13, 2.5px], [14, 3px], [16, 14]]
          outline: { width: [[16, 0], [16, 1]] }
      link:
        filter: [{ highway: trunk_link }, { ramp: true }]
        draw: { lines: { width: [[14, 0], [14, 1.5px], [16, 8]] } }

    primary_road:
      filter: { highway: primary, $zoom: { min: 8 } }
      draw:
        lines:
          order: global.order.major_road
          width: [[10, 0], [10, 0.75px], [13, 2px], [14, 2.5px], [16, 12]]
          outline: { width: [[16, 0], [16, 1]] }
      primary_ref:
        filter: { ref: true }
        draw:
          {
            lines:
              {
                width: [[8, 0.5px], [9, 1px], [13, 2px], [14, 2.5px], [16, 12]],
              },
          }

    major_road:
      filter:
        {
          highway: [primary_link, secondary, secondary_link],
          $zoom: { min: 10 },
        }
      draw:
        lines:
          order: global.order.major_road
          width: [[10, 0], [10, 0.5px], [13, 1.75px], [14, 2px], [16, 10]]
          outline: { width: [[16, 0], [16, 1]] }
      link:
        filter: [{ highway: [primary_link, secondary_link] }, { ramp: true }]
        draw: { lines: { width: [[14, 0], [14, 1.5px], [16, 8]] } }
      secondary_ref:
        filter: { highway: secondary, ref: true }
        draw:
          {
            lines:
              {
                width:
                  [
                    [9, 0],
                    [9, 0.5px],
                    [10, 1px],
                    [13, 1.75px],
                    [14, 2px],
                    [16, 10],
                  ],
              },
          }

    medium_road:
      filter:
        # unclassified is a specific type of road, does not mean unknown - see OSM wiki
        highway: [tertiary, tertiary_link, unclassified]
        $zoom: { min: 12 }
      unpaved:
        filter: { surface: unpaved }
        draw: { lines: { style: dashed-track } }
      draw:
        lines:
          order: global.order.medium_road
          width: [[12, 0.75px], [13, 1.5px], [14, 1.75px], [15, 8]]
          outline: { width: [[17, 0], [17, 1]] }

    minor_road:
      filter:
        highway: [residential, road, living_street, service]
        $zoom: { min: 13 }
      draw:
        lines:
          order: global.order.minor_road
          width: [[13, 0.75px], [14, 1px], [15, 8]]
          outline: { width: [[17, 0], [17, 1]] }
      service:
        filter: { highway: service }
        draw:
          { lines: { width: [[15, 0px], [15, 0.75px], [16, 4px], [17, 5]] } }
      parking:
        filter: { service: parking_aisle }
        draw:
          { lines: { width: [[15, 0px], [15, 0.75px], [16, 2px], [17, 3]] } }

    paths:
      filter: { highway: [footway, path, steps, pedestrian] }
      draw:
        lines:
          order: global.order.path
          style: dashed-path
          color: global.color.path
          width: [[14, 0px], [14, 0.5px], [15, 1px], [18, 3px]]
      steps:
        filter: { highway: steps }
        draw:
          {
            lines:
              {
                style: dashed-steps,
                width: [[14, 0px], [14, 0.5px], [15, 3px], [18, 6px]],
              },
          }
      # declared BEFORE unpaved so that, with trails on, unpaved's solid trail style wins
      poor:
        filter: { trail_visibility: [bad, very_bad, horrible, no, none, poor] }
        draw: { lines: { style: dashed-bike } }
      unpaved:
        enabled: global.show_trails
        filter:
          $zoom: { min: 12 }  # trails appear from z12.5: tile zoom is an integer, so the width ramp below does the half step
          any:
            - highway: path
            - { highway: footway, surface: unpaved }
        default:
          #filter: [ { $zoom: { min: 12 } }, { name: true }, { ref: true }, { has_name: true } ]
          draw:
            {
              lines:
                {
                  style: trail,
                  color: global.color.unpaved_trail,
                  width: [[12.4, 0px], [12.5, 1px], [15, 1.5px], [18, 3px]],
                },
            }
        scramble:
          # what about demanding_mountain_hiking and alpine_hiking levels?
          filter:
            { sac_scale: [demanding_alpine_hiking, difficult_alpine_hiking] }
          draw: { lines: { style: trail-dashed } }

    tracks:
      filter:
        highway: [cycleway, byway, bridleway, track]
        $zoom: { min: 13 }
      draw:
        lines:
          order: global.order.path
          style: dashed-track
          color: global.color.path
          width: [[13, 0.75px], [14, 1px], [15, 2px], [18, 4px]]

    rail:
      filter: { railway: [rail, narrow_gauge] } #$zoom: { min: 10 }
      draw:
        lines:
          style: dashed-rail
          order: global.order.rail
          color: global.color.dashed_rail_core
          width: [[12, 1px], [14, 1px], [16, 2px]]
          outline:
            # outline drawn w/o dashed style provides background for dashes!
            visible: true
            style: unlit-lines
            color: global.color.dashed_rail
            width: [[12, 0.5px], [14, 1px]]
      service:
        filter: { service: true }
        draw:
          lines:
            width: [[15, 0px], [15, 0.75px], [16, 1px], [17, 2px]]
            outline: { color: global.color.service_rail }
      tunnel:
        filter: { brunnel: tunnel }
        draw: { lines: { outline: { color: global.color.dashed_rail_tunnel } } }

    light_rail:
      filter:
        railway: [light_rail, subway, tram, funicular]
        $zoom: { min: 10 }
      draw:
        lines:
          order: global.order.rail
          color: global.color.rail
          width: [[12, 1px], [14, 1px], [16, 2px]]
      service:
        filter: { service: true }
        draw:
          { lines: { width: [[15, 0px], [15, 0.75px], [16, 1px], [17, 2px]] } }
      tunnel:
        filter: { brunnel: tunnel }
        draw: { lines: { color: global.color.rail_tunnel } }

    ferry:
      filter: { route: ferry }
      draw:
        lines:
          style: dashed-track
          color: global.color.ferry
          width: [[14, 1px], [18, 2px]]

    aerialway:
      filter:
        aerialway: true
        not: { aerialway: [explosive, proposed, razed, no] }
        $zoom: { min: 10 }
      draw:
        lines:
          style: lifted-lines
          order: global.order.aerialway # aerialway would more often be over bridge vs under
          color: global.color.aerialway
          width: [[14, 0.5px], [15, 1.0px], [16, 2m]]
        points:
          visible: false
          style: aerialway
          order: global.order.aerialway
          color: global.color.aerialway
          width: [[14, 50], [16, 25], [18, 10], [20, 4]]
          #width: [[14, 6px], [15, 8px], [16, 10px]]
          #width: [[14, 50m], [15, 30m], [16, 20m]]
      show_points:
        filter:
          {
            $zoom: { min: 13 },
            aerialway: [gondola, cable_car, mixed_lift, chair_lift],
          }
        draw: { points: { visible: true } }
      gondola:
        filter: { aerialway: [gondola, cable_car, mixed_lift] }
        draw:
          lines:
            {
              width:
                [
                  [10, 0.5px],
                  [11, 1px],
                  [12, 1.5px],
                  [13, 1.5px],
                  [14, 2px],
                  [15, 2.5px],
                ],
            }
          #points: { size: [[12, 4px], [13, 4px], [14, 5px], [15, 7px], [16, 7px]] }
      chair_lift:
        filter: { aerialway: chair_lift }
        draw:
          lines:
            {
              width:
                [
                  [10, 0.5px],
                  [11, 1px],
                  [12, 1.5px],
                  [13, 1.5px],
                  [14, 2px],
                  [15, 2.5px],
                ],
            }
          #points: { size: [[12, 4px], [13, 4px], [14, 5px], [15, 7px], [16, 7px]] }

    piste:
      enabled: global.show_ski_runs
      filter: { route: piste, $zoom: { min: 10 } }
      piste_areas:
        filter: { $geometry: polygon, $zoom: { min: 13 } }
        enabled: global.show_land_polygons
        draw:
          polygons:
            #visible: global.show_ski_runs
            style: lifted-polygons
            order: global.order.piste_area
            color: global.piste_color_fn
      piste_lines:
        filter: { $geometry: line }
        draw:
          lines:
            #visible: global.show_ski_runs
            style: lifted-lines
            order: global.order.piste
            color: global.piste_color_fn
            width:
              [[10, 0.5px], [11, 0.75px], [12, 1.0px], [13, 1.5px], [18, 3m]]
            outline:
              style: lifted-lines
              color: global.color.piste_halo
              width: [[13, 0px], [14, 2px]]
        default:
          filter: { $zoom: { min: 12 } }
          draw: { lines: { visible: true } }
        direction:
          filter: { $zoom: { min: 16 } }
          draw: { lines: { style: piste-direction } }

    selected-route:
      filter: { route: [hiking, bicycle, mtb], $zoom: { min: 10 } }
      draw:
        lines:
          visible: global.is_selected_fn
          style: dashed-border
          order: global.order.border
          color: global.color.selected
          width: 1.5px

    road-icons:
      # ideally, we'd show oneway arrows for major roads at z16, but we need to show for every road (since
      #  absence implies not oneway) and don't want to hide names, so we need to join road segments for better placement
      arrows:
        filter:
          oneway: 1
          not: { service: parking_aisle }
          any:
            - {
                $zoom: { min: 17 },
                highway:
                  [
                    motorway_link,
                    trunk,
                    primary,
                    secondary,
                    tertiary,
                    residential,
                  ],
              }
            - { $zoom: { min: 18 } }
        draw:
          points:
            #collide: false
            priority: global.priority.oneway_arrow
            style: poi-points
            texture: pois
            sprite: arrow
            color: global.color.oneway_arrow
            flat: true
            size: [[16, 12px], [17, 18px], [18, 20px], [20, 32px]]
            placement: spaced
            placement_min_length_ratio: 0
            placement_spacing: [[17, 70px], [20, 175px]]
            repeat_distance: 150px
            repeat_group: oneway
            angle: auto

  shields:
    enabled: global.show_motorways
    data: { source: osm, layer: transportation }
    filter:
      #aeroway: false
      ref: true
      any:
        - { highway: motorway, $zoom: { min: 6 } }
        - { highway: trunk, $zoom: { min: 8 } }
        - { highway: primary, $zoom: { min: 9 } }
        - { highway: [secondary, tertiary], $zoom: { min: 13 } }
        - { highway: true, $zoom: { min: 14 } }
        - { ref: global.show_trails, route: hiking, $zoom: { min: 10 } }
        - { ref: global.show_bike, route: [bicycle, mtb], $zoom: { min: 10 } }
    motorway:
      #function() { const s = feature.maxspeed.split(" "); return parseInt(s[0]) >= (s[1] == "mph" ? 50 : 80); }
      filter: { highway: motorway }
      draw:
        {
          points:
            {
              priority: global.priority.motorway_ref,
              color: global.color.motorway_shield,
            },
        }
    hike:
      filter: { route: hiking }
      draw: { points: { interactive: true, color: global.color.hike_shield } }
    bike:
      filter: { route: [bicycle, mtb] }
      draw: { points: { interactive: true, color: global.color.bike_shield } }
    zoomed:
      # at high zoom, give line labels priority over shields
      filter: { $zoom: { min: 16 }, not: { highway: motorway } }
      draw: { points: { priority: global.priority.zoomed_ref } }
    draw:
      points:
        visible: function() { return feature.ref.split(";")[0].length <= 8; }
        style: poi-points
        texture: pois
        sprite: shield #function() { return feature.network; }
        color: global.color.shield
        #sprite_default: shield
        priority: global.priority.highway_ref
        # faster roads get higher priority
        #priority: function() { return global.priority.motorway_ref - parseInt(feature.maxspeed)/200; }
        size: |
          function() {
              const str = feature.ref.split(";")[0];
              var w = 0;
              // exact values will depend on font
              for (var ii = 0; ii < str.length; ii++) { w += (str[ii] == " ") ? 3.5 : 7.5; }
              return [w, 14];
          }
        # midpoint generates too many labels (overwhelming label collider)
        placement: spaced
        placement_spacing: 30px
        placement_min_length_ratio: 0
        repeat_distance: 150px
        repeat_group: shields
        text:
          anchor: center
          text_source: function() { return feature.ref.split(";")[0]; }
          font:
            family: global.primary_font
            size: 10px
            fill: black

  transportation_name:
    data: { source: osm, layer: transportation }
    filter: { name: true } #railway: false, aeroway: false
    draw:
      text:
        text_source: global.road_name_abbrev_fn
        transition: { show: { time: 0s }, hide: { time: 1s } }
        # Street names run along curves and are read in motion: Condensed keeps a name
        #  short enough to fit the segment, a hair of tracking keeps the small sizes open.
        font:
          family: global.condensed_font
          weight: 400
          letter_spacing: 0.03
          fill: global.color.road_name
          stroke: { color: global.color.road_halo, width: 4 }
          # 0px to hide by default
          size: 0px

    motorway:
      exclusive: true
      filter: { highway: motorway, $zoom: { min: 13 } }
      draw:
        text:
          visible: global.show_motorways
          repeat_distance: 200px
          repeat_group: road_labels
          priority: global.priority.motorway_name
          font:
            # shield is generally more important than name for motorway
            weight: 500
            size: 12px
            stroke: { width: 4 }

    primary:
      exclusive: true
      filter:
        - { highway: trunk, $zoom: { min: 13 } }
        - { highway: primary, $zoom: { min: 14 } }
      draw:
        text:
          repeat_distance: 100px
          repeat_group: roads
          priority: global.priority.road_primary
          font: { size: 14px, weight: 500 }

    secondary:
      exclusive: true
      filter: { highway: secondary, $zoom: { min: 14 } }
      draw:
        text:
          repeat_distance: 100px
          repeat_group: roads
          priority: global.priority.road_secondary
          font: { size: 13px, weight: 500 }

    tertiary:
      exclusive: true
      filter: { highway: tertiary, $zoom: { min: 15 } }
      draw:
        text:
          priority: global.priority.road_tertiary
          font: { size: 12px }

    residential:
      exclusive: true
      filter: { highway: residential, $zoom: { min: 15 } }
      draw:
        text:
          priority: global.priority.road_residential
          font: { size: 11px }

    minor:
      exclusive: true
      filter:
        {
          highway: [unclassified, road, living_street, service],
          $zoom: { min: 16 },
        }
      draw:
        text:
          priority: global.priority.road_minor
          font: { size: 10px }

    paths:
      exclusive: true
      filter:
        { highway: [footway, path, steps, pedestrian], $zoom: { min: 15 } }
      draw:
        text:
          priority: global.priority.road_minor
          font: { size: 10px }

    tracks:
      exclusive: true
      filter:
        { highway: [cycleway, byway, bridleway, track], $zoom: { min: 15 } }
      draw:
        text:
          priority: global.priority.road_minor
          font: { size: 10px }

    aerialway:
      exclusive: true
      filter:
        aerialway: true
        not: { aerialway: [explosive, proposed, razed, no] }
        $zoom: { min: 14 }
      draw:
        text:
          text_source: name
          font:
            fill: global.color.aerialway_name
            stroke: { color: global.color.aerialway_halo, width: 3 }
            size: 12px

    routes:
      exclusive: true
      filter: { route: true }
      ferry:
        filter: { route: ferry, $zoom: { min: 12 } }
        draw:
          text:
            text_wrap: 20
            # Beside the dashed route line (never on it), strong enough to read on water.
            # Screen-space offset (constant px at every zoom, unlike tile-space path_offset).
            offset: [0px, -6px]
            font:
              family: global.natural_font
              size: 11.5px
              weight: 500
              fill: hsl(205, 52%, 44%)
              stroke: { color: "#e6f1f6", width: 3.5 }
              style: italic
              letter_spacing: 0.04

      piste:
        exclusive: true
        enabled: global.show_ski_runs
        filter: { route: piste, $zoom: { min: 13 } }
        draw:
          text:
            text_source: global.piste_name_fn
            font:
              fill: global.piste_color_fn
              stroke: { color: global.color.piste_halo, width: 3 }
              size: 12px

      hike_bike:
        exclusive: true
        enabled: global.show_trails
        filter: { route: [hiking, bicycle, mtb], $zoom: { min: 14 } }
        hiking:
          filter: { route: hiking }
          draw: { text: { font: { fill: global.color.unpaved_trail } } }
        draw:
          text:
            interactive: true
            priority: global.priority.route_minor
            font:
              fill: global.color.bike_path
              size: 10px

  airports:
    data: { source: osm, layer: transportation }
    enabled: global.show_polygons
    filter: { aeroway: true }

    footprint:
      filter: { aeroway: aerodrome }
      draw:
        polygons:
          visible: global.show_land_polygons
          style: global.earth_style
          order: global.order.airport
          color: global.color.airport

    taxiways:
      filter: { aeroway: taxiway, $zoom: { min: 13 } }
      draw:
        lines:
          style: unlit-lines
          color: global.color.taxiway
          order: global.order.taxiway
          width: [[13, 0px], [14, 2px], [17, 10px]]

    runways:
      filter: { aeroway: [runway, airstrip], $zoom: { min: 12 } }
      draw:
        lines:
          style: unlit-lines
          color: global.color.runway_13 #[[13, global.color.runway_13], [16, global.color.runway_16]]
          width: [[12, 3px], [13, 5px], [14, 10px], [15, 75]]
          order: global.order.runway
          cap: square
          #outline:
          #    color: global.color.runway_casing
          #    width: [[11, 0px], [12, 1px], [13, 2px], [15, 12.5]]

  airport_name:
    data: { source: osm, layer: transportation }
    filter:
      aeroway: aerodrome
      any:
        - { area: { min: 1500px2, max: 350000px2 } }
        - { area: { min: 1500px2 }, $zoom: { max: 12 } }
        - { area: false, $zoom: { min: 14 } } #aerodrome: international
    draw:
      text:
        interactive: true
        text_source: global.names_one_line
        priority: global.priority.airport
        transition: { show: { time: 0s }, hide: { time: 1s } }
        font:
          family: global.primary_font
          fill: global.color.airport_name
          stroke: { color: global.color.default_halo, width: 2 }
          size: [[12, 12px], [13, 14px]]

  bicycle:
    data: { source: osm, layer: transportation }
    enabled: global.show_bike
    filter:
      $zoom: { min: 10 }
      any:
        - bicycle: designated
        # higher road types default to bicycle=yes, so bicycle=yes doesn't indicate any special accomodation
        - { bicycle: yes, highway: [path, track, footway, pedestrian] }
        - highway: cycleway
        - cycleway: true
        - cycleway_right: true
        - cycleway_left: true
        - mtb_scale: true
    draw:
      lines:
        style: unlit-lines
        color: global.color.bike_lane
        width: [[10, 0.7px], [11, 1px], [13, 1.5px], [14, 2px]]
        order: global.order.bicycle
    track:
      exclusive: true
      priority: 1
      filter:
        - bicycle: [designated, yes]
        - highway: cycleway
        - cycleway: [track, opposite_track]
        - cycleway_left: [track, opposite_track]
        - cycleway_right: [track, opposite_track]
        - mtb_scale: true
      draw: { lines: { color: global.color.bike_path } }
      # assume highway=track is unpaved by default
      unpaved:
        filter:
          [
            { surface: unpaved },
            { mtb_scale: true },
            { highway: [path, track], surface: false },
          ]
        draw: { lines: { style: dashed-bike, color: global.mtb_color_fn } }
        #hide: { filter: { $zoom: { max: 12 } }, draw: { lines: { width: 0 } } }
    lane:
      exclusive: true
      priority: 2
      filter:
        - cycleway: [lane, opposite_lane]
        - cycleway_left: [lane, opposite_lane]
        - cycleway_right: [lane, opposite_lane]
      draw: { lines: { color: global.color.bike_lane } }
    shared:
      exclusive: true
      priority: 3
      filter:
        - cycleway: [shared_lane, shoulder]
        - cycleway_left: [shared_lane, shoulder]
        - cycleway_right: [shared_lane, shoulder]
      draw: { lines: { style: dashed-bike, color: global.color.bike_lane } }

  transit:
    data: { source: osm, layer: transit }
    enabled: global.show_transit
    filter:
      $zoom: { min: 8 }
      any:
        - { route: train }
        - { route: subway, $zoom: { min: 10 } }
        - { route: [light_rail, tram, monorail], $zoom: { min: 12 } }
        - { route: [bus, trolleybus], $zoom: { min: 14 } }
    draw:
      lines:
        width: [[10, 2px], [13, 3px], [14, 4px]]
        order: global.transit_order_fn
        #style: transit-lines
        style: unlit-lines
        color: global.transit_color_fn
      text:
        interactive: true
        priority: global.priority.transit_ref
        text_source: ref #'function() { return feature.ref.length < 6 ? feature.ref : ''; }'
        # non-zero offset bypasses addCurvedTextLabels, which generates massive number of label
        #  objects, resulting in label collider pegging CPU
        offset: [0px, -0.5px]
        repeat_distance: 400px
        font:
          family: global.primary_font
          fill: white #'function() { return feature.color == "yellow" ? "#555": "white"; }'
          stroke:
            color: global.transit_color_fn
            width: 3
          size: 14px
    secondary:
      filter: { route: [light_rail, tram, monorail] }
      draw:
        lines: { width: [[13, 2px], [14, 3px]] }
        text: { priority: global.priority.transit_ref_tram }
    bus:
      filter: { route: [bus, trolleybus] }
      draw:
        lines: { width: [[14, 1px], [16, 2px]] }
        text: { priority: global.priority.transit_ref_bus }
    selected:
      draw:
        sel-lines:
          visible: global.is_selected_fn
          style: dashed-border
          order: global.order.border
          color: global.color.selected
          width: 4px
          outline:
            style: unlit-lines
            color: white
            width: 2px

  buildings:
    data: { source: osm, layer: building }
    filter: { $zoom: { min: 14 } }
    enabled: global.show_polygons
    draw:
      polygons:
        style: heightglow
        order: global.order.bldg
        color: global.color.bldg

    # extrude 3d buildings ... change to min_height and height attrs once tiles updated
    extruded:
      filter: { $zoom: { min: 15 } }
      draw:
        polygons:
          extrude: ["min_height", "height"]
          color: global.color.bldg_3d
          order: global.order.bldg_3d
        lines:
          style: heightglowline
          width: [[15, 1px], [17, 2px]]
          color: global.color.bldg_3d_line
          order: global.order.bldg_3d_line
          extrude: ["min_height", "height"]
      default:
        filter: { height: false }
        draw:
          polygons: { extrude: 3.66 }
          lines: { extrude: 3.66 }

  housenumber:
    data: { source: osm, layer: building }
    filter: { $zoom: { min: 19 } }
    #enabled: false
    draw:
      text:
        priority: global.priority.housenumber
        text_source: housenumber
        font:
          family: global.primary_font
          size: 11px
          fill: global.color.housenumber
          stroke: { color: global.color.housenumber_halo, width: 2px }

  pois:
    data: { source: osm, layer: poi }
    draw:
      points:
        texture: pois
        interactive: true
        collide: true
        transition: { show: { time: 0s }, hide: { time: 1s } }
        text:
          interactive: true
          text_source: global.names_one_line
          font:
            family: global.primary_font
            weight: 400
            size: 12px
            fill: global.color.default_label
            stroke: { color: global.color.default_halo, width: 3 }
      text:
        visible: false
        interactive: true
        text_source: global.names_one_line
        transition: { show: { time: 0s }, hide: { time: 1s } }
        max_lines: 4
        font:
          family: global.primary_font
          weight: 400
          size: 12px
          style: italic
          fill: global.color.default_label
          stroke: { color: global.color.default_halo, width: 3 }

    # Peaks are drawn by the `peaks` layer (osm-peaks source) - consume them here so no
    # other pois rule draws a second marker/label for the same feature.
    peak:
      exclusive: true
      filter:
        natural: [peak, volcano]
      draw:
        points: { visible: false }
        text: { visible: false }
    saddle:
      exclusive: true
      filter:
        name: true
        any:
          - {
              natural: saddle,
              any: [{ $zoom: { min: 17 } }, global.show_trails],
            }
          - { natural: cape, $zoom: { min: 15 } }
      saddle:
        filter: { natural: saddle }
        draw: { text: { font: { size: 9.5px } } }
      draw:
        points: { visible: false }
        text:
          visible: true
          priority: global.priority.saddle
          font: { family: global.natural_font }

    landuse:
      exclusive: true
      filter:
        name: true
        area: { min: 1500px2 }
        # give park POI (w/ icon) priority
        not: { leisure: [park, golf_course] }
        any:
          - { boundary: national_park, $zoom: { min: 8 } }
          - {
              protect_class: ["1", "1a", "1b", "2", "3", "5"],
              $zoom: { min: 10 },
            }
          - { natural: [glacier], $zoom: { min: 10 } }
          - { landuse: [commercial, retail, winter_sports], $zoom: { min: 12 } }
          - {
              landuse: [industrial, military],
              area: { min: 5000px2 },
              $zoom: { min: 10 },
            }
          - { amenity: prison, area: { min: 5000px2 }, $zoom: { min: 12 } }
      draw:
        points: { visible: false }
        # Phase 5 (docs/label-placement-plan.md): this pre-baked centroid-point label is
        # superseded by the `landuse_name` layer below, which draws from the actual
        # landuse polygon geometry (curving the label along its principal axis when
        # elongated) -- kept here, disabled, as the documented fallback path rather than
        # deleted outright. Left enabled, this would duplicate every label, since the tile
        # source emits a same-named point here *and* a same-named polygon in `landuse`
        # for every one of these features (see scripts/tilemaker/process.lua's
        # LayerAsCentroid("poi")/LayerAsCentroid("poi_detail") calls).
        text:
          visible: false
          priority: global.priority.forest
          font:
            family: global.natural_font
            fill: global.color.park_name
            stroke: { color: global.color.park_halo, width: 3 }
      commercial:
        filter:
          - {
              landuse:
                [commercial, retail, industrial, military, winter_sports],
            }
          - { amenity: prison }
        draw:
          {
            text:
              {
                font:
                  {
                    family: global.primary_font,
                    fill: global.color.landuse_name,
                    stroke: { color: global.color.default_halo },
                  },
              },
          }
      national_park:
        filter: { boundary: national_park }
        draw: { text: { priority: global.priority.national_park } }
      glacier:
        filter: { natural: glacier, area: { min: 9000px2 }, $zoom: { min: 10 } }
        enabled: global.glacier_point_labels
        # Unlike national_park/protect_class/commercial etc., the OSM tile schema
        # (scripts/tilemaker/process.lua) never puts a name attribute on the glacier
        # *polygon* written to the landuse layer -- only on this pre-baked centroid
        # point. So glacier can't use the landuse_name polygon-curving path below (it
        # would just never match); this stays as the real (non-superseded) label source.
        # Glacier names: ice-blue italic (water and ice share the italic), tracked wide,
        #  sized by the ice's area so a valley glacier reads bigger than a cirque
        #  glacier. This is a point at the polygon's label position; if the tile schema ever
        #  carries the name on the glacier polygon too, the landuse_name rule picks it up
        #  and sets it along the glacier's flow axis with no style change.
        draw:
          text:
            visible: true
            priority: global.priority.water
            # First of the "A / B" names; compound German names broken at "-gletscher" with a
            #  hyphen, never mid-word.
            text_source: |
              function() {
                  var n = (global.show_name_en && feature.name_en ? feature.name_en : feature.name) || "";
                  n = n.split(" / ")[0];
                  return n.replace(/([A-Za-zäöüÄÖÜß]{4,})(gletscher|ferner|kees|firn)$/i, "$1-\n$2");
              }
            max_lines: 3
            text_wrap: 16
            font:
              family: global.natural_font
              weight: 400
              style: italic
              size: |
                function() {
                    var a = feature.area || 0;
                    return a > 5e7 ? 16 : a > 1e7 ? 14.5 : a > 2e6 ? 13 : 12;
                }
              letter_spacing: 0.2
              fill: global.color.glacier_name
              stroke: { color: global.color.glacier_halo, width: 3.5 }
      # don't show label for huge area (where boundries may be offscreen) beyond z12
      hide:
        filter:
          [
            { access: [no, private] },
            { area: { min: 350000px2 }, $zoom: { min: 12 } },
          ]
        draw: { text: { visible: false } }

    traffic_signal:
      exclusive: true
      filter: { $zoom: { min: 19 }, highway: traffic_signals }
      draw:
        points:
          interactive: false
          sprite: traffic_light
          priority: global.priority.traffic_light
          text: { visible: false }

    cave:
      exclusive: true
      filter:
        - { $zoom: { min: 15 }, natural: cave_entrance }
        - { $zoom: { min: 15 }, historic: mine }
      draw:
        points:
          sprite: cave
          size: 20px
          priority: global.priority.cave
          text:
            { font: { family: global.natural_font, size: 11px, style: italic } }
      mine:
        filter: { historic: mine }
        draw: { points: { sprite: abandoned_mine } }
      hide_text:
        filter: { $zoom: { max: 16 } }
        draw: { points: { text: { visible: false } } }

    spring:
      exclusive: true
      filter:
        { $zoom: { min: 15 }, natural: [spring, hot_spring, fumarole, geyser] }
      draw:
        points:
          style: poi-points
          sprite: spring
          color: global.color.spring
          size: 24px #[[16, 14px], [18, 18px]]
          priority: global.priority.spring
          text:
            font:
              family: global.natural_font
              weight: 400
              size: 11px
              style: italic
              fill: global.color.spring
              stroke: { color: global.color.default_halo, width: 2 }
      hot:
        filter: { not: { natural: spring } }
        draw: { points: { color: global.color.hot_spring } }
      hide_text:
        filter: { $zoom: { max: 17 } }
        draw: { points: { text: { visible: false } } }

    waterfall:
      exclusive: true
      filter: { $zoom: { min: 14 }, waterway: waterfall }
      draw:
        points:
          style: poi-points
          sprite: waterfall
          color: global.color.spring
          size: 20px
          priority: global.priority.spring
          text:
            font:
              family: global.natural_font
              size: 11px
              style: italic
              fill: global.color.spring
              stroke: { color: global.color.default_halo, width: 2 }
      hide_unnamed:
        filter: { $zoom: { max: 16 }, name: false }
        draw: { points: { visible: false } }

    icon_pois:
      # not exclusive, so lower priority than above
      draw:
        points:
          style: poi-points
          size: [[13, 16px], [16, 18px]]
          text:
            anchor: [right, left, bottom, top]
            max_lines: 2

      park:
        exclusive: true
        priority: 10
        filter:
          - { leisure: [park, golf_course], name: true }
          - { amenity: grave_yard }
          - { landuse: cemetery }
          - { tourism: zoo, name: true }
        draw:
          points:
            visible: false
            color: global.poi_color.outdoor
            text:
              # Icon above, name centred below it (not off to the side, where it spilled over
              #  the neighbours). Upright medium in a dark green: italic is for water and ice.
              anchor: bottom
              text_wrap: 12
              font:
                size: 12px
                weight: 500
                fill: global.color.park_name
                stroke: { color: global.color.park_halo, width: 3 }
        park:
          filter: [{ leisure: park }, { tourism: zoo }]
          draw:
            points:
              sprite: tree
              priority: global.priority.park
              text: { font: { size: 12.5px } }
        golf:
          filter: { leisure: golf_course }
          draw: { points: { sprite: golf, priority: global.priority.golf } }
        cemetery:
          filter: [{ amenity: grave_yard }, { landuse: cemetery }]
          draw:
            { points: { sprite: cemetery, priority: global.priority.cemetery } }
        # Show icon + name only where they fit on the park itself: its area on screen must
        #  clearly exceed the box of icon + (up to two-line) name, ~100 x 45 px.
        show:
          filter: { $zoom: { min: 14 }, area: { min: 2500px2 } }
          draw: { points: { visible: true } }

      natural:
        exclusive: true
        priority: 15
        filter:
          name: true
          $zoom: { min: 10 }
          area: { min: 1500px2 }
          tourism: false
          leisure: false
          amenity: false
          historic: false
          any:
            - {
                natural:
                  [
                    wood,
                    grassland,
                    grass,
                    scrub,
                    fell,
                    heath,
                    wetland,
                    beach,
                    sand,
                  ],
              }
            - { landuse: [forest, meadow, grass] }
        draw:
          points: { visible: false }
          text:
            visible: true
            priority: global.priority.park
            font:
              family: global.natural_font
              size: 9.5px
              fill: global.color.park_name
              stroke: { color: global.color.park_halo, width: 3 }
        hide:
          filter:
            [
              { access: [no, private] },
              { area: { min: 350000px2 }, $zoom: { min: 12 } },
            ]
          draw: { text: { visible: false } }

      station:
        exclusive: true
        priority: 20
        filter:
          - railway: [station, halt, tram_stop]
          - amenity: [ferry_terminal, bus_station]
        # show_transit: stations at 13, station labels at 14; default: stations at 15, station labels at 16
        # - trying to implement this logic w/o using JS functions was a horrible disaster
        draw:
          points:
            visible: "function() { return $zoom >= (global.show_transit ? 13 : 14); }"
            priority: "function() { return global.show_transit ? global.priority.station_transit : global.priority.station_default; }"
            sprite: train
            color: global.poi_color.public
            size: [[13, 12px], [15, 18px]]
            text:
              optional: "function() { return !global.show_transit; }"
        ferry:
          filter: { amenity: [ferry_terminal] }
          draw:
            points:
              # ferry route lines indicate ferry terminals, so we can wait to show poi
              visible: "function() { return $zoom >= (global.show_transit ? 14 : 15); }"
              sprite: ferry
        # some stations have railway=station, station=light_rail, so we need this sublayer to override parent
        tram:
          filter:
            [
              { railway: tram_stop },
              { station: light_rail },
              { amenity: bus_station },
            ]
          bus:
            filter: { amenity: [bus_station] }
            draw: { points: { sprite: bus } }
          draw:
            points:
              sprite: tram
              priority: |
                function() {
                    if(global.show_transit) { return 1 + global.priority.station_transit; }
                    return 1 + global.priority.station_default;
                }
              size: [[13, 10px], [15, 16px]]
              visible: "function() { return $zoom >= (global.show_transit ? 15 : 17); }"
              text:
                visible: "function() { return $zoom >= (global.show_transit ? 17 : 19); }"

      bus_stop:
        exclusive: true
        priority: 40
        filter: { highway: bus_stop }
        draw:
          points:
            sprite: bus
            color: global.poi_color.public
            size: [[16, 12px], [18, 16px]]
            visible: false
            priority: global.priority.bus_stop
            text: { visible: false }
        show:
          enabled: global.show_transit
          filter: { $zoom: { min: 16 } }
          draw: { points: { visible: true } }
        default:
          filter: { $zoom: { min: 19 } }
          draw: { points: { visible: true, text: { visible: true } } }

      subway_entrance:
        exclusive: true
        priority: 50
        filter: { railway: subway_entrance }
        draw:
          points:
            sprite: entrance
            style: points
            size: 22px
            visible: false
            priority: global.priority.bus_stop
            text: { visible: false }
        hasref:
          filter: { ref: true }
          draw: { points: { text: { text_source: ref } } }
        show:
          enabled: global.show_transit
          filter: { $zoom: { min: 18 } }
          draw: { points: { visible: true } }
        default:
          filter: { $zoom: { min: 19 } }
          draw: { points: { visible: true, text: { visible: true } } }

      # these POIs will be hidden by search results (while those above will not)
      not_landuse:
        exclusive: true
        priority: 60
        filter:
          all:
            - any:
                - $zoom: { min: 14 }
                - { wikipedia: true, $zoom: { min: 12 } }
                - { wikidata: true, $zoom: { min: 12 } }
                - { heritage_operator: whc, $zoom: { min: 11 } } # UNESCO
            - any:
                - name: true
                - tourism: [viewpoint, camp_site, information]
                - highway: [trailhead]
                - amenity:
                    [
                      parking,
                      bicycle_rental,
                      drinking_water,
                      water_point,
                      toilets,
                    ]
        draw:
          points:
            sprite: global.poi_sprite_fn
            color: global.poi_color_fn
            priority: global.poi_priority_fn
            # transition.selected < 0 to indicate label should be hidden when search results shown
            transition: { selected: { time: -1s } }
        # make label optional at higher zoom to show more POI icons
        labels:
          filter: { $zoom: { min: 17 } }
          draw: { points: { text: { optional: true } } }
        # add generic icon at high zoom; also allow longer label
        generic:
          filter: { $zoom: { min: 18 }, name: true }
          draw: { points: { sprite_default: generic, text: { max_lines: 3 } } }
        special:
          heritage:
            exclusive: true
            priority: 1
            filter: { heritage: [1, 2], $zoom: { max: 18 } }
            draw: { points: { priority: global.poi_priority.heritage } }
            default:
              filter: [{ heritage: 1 }, { $zoom: { min: 15 } }]
              draw: { points: { sprite_default: ruins } }
          hike_camp_view:
            exclusive: true
            priority: 2
            filter:
              $zoom: { max: 17 } # hide below z17 if !show_trails
              any:
                [{ tourism: [viewpoint, camp_site] }, { highway: [trailhead] }]
            draw: { points: { visible: global.show_trails } }
          vistor_center:
            exclusive: true
            priority: 3
            filter: { information: [office, vistor_centre] }
            draw: { points: { sprite: ranger_station } }
          information:
            exclusive: true
            priority: 4
            filter: { tourism: information, $zoom: { max: 17 } }
            draw: { points: { visible: false } }
          special_culture:
            exclusive: true
            priority: 5
            filter:
              $zoom: { max: 18 }
              all:
                - any: [{ wikipedia: true }, { heritage: 1 }]
                - any:
                    - { historic: [archaeological_site, castle] }
                    - { tourism: museum }
            draw: { points: { priority: global.priority.special_culture } }
          # too many churches with wikipedia/wikidata
          special_church:
            exclusive: true
            priority: 6
            filter:
              amenity: place_of_worship
              any:
                [{ historic: true }, { tourism: true }, { building: cathedral }]
            draw: { points: { priority: global.poi_priority.museum } }
          other_church:
            exclusive: true
            priority: 7
            filter: { amenity: place_of_worship, $zoom: { max: 16 } }
            draw: { points: { visible: false } }
          parking:
            # hide parking below z18 if !show_parking
            exclusive: true
            filter: { amenity: parking, $zoom: { max: 18 } }
            draw: { points: { visible: global.show_parking } }
          bike_rental:
            exclusive: true
            filter: { amenity: bicycle_rental, $zoom: { max: 18 } }
            draw: { points: { visible: global.show_bike } }
          nowiki: # hide hospital even w/ wikipedia/wikidata
            exclusive: true
            filter: { amenity: [cinema, hospital], $zoom: { max: 14 } }
            draw: { points: { visible: false } }
          school:
            exclusive: true
            filter:
              { amenity: [university, school, college, kindergarten, library] }
            # we want to suppress small schools and libraries
            draw: { points: { visible: false } }
            show:
              filter: { $zoom: { min: 16 } }
              draw: { points: { visible: true } }
            college:
              filter: { amenity: [college, library], area: { min: 1500px2 } }
              draw:
                {
                  points:
                    { visible: true, priority: global.poi_priority.university },
                }
            university:
              filter:
                {
                  amenity: university,
                  area: { min: 500px2 },
                  $zoom: { max: 18 },
                }
              draw:
                { points: { visible: true, priority: global.priority.campus } }
            campus:
              filter: { amenity: university, area: { min: 4000px2 } }
              draw:
                points:
                  text:
                    anchor: [bottom, right, left]
                    max_lines: 4
                    font: { size: [[12, 12px], [16, 14px]] }
          toilet:
            exclusive: true
            filter:
              {
                amenity: [drinking_water, water_point, toilets],
                $zoom: { max: 18 },
              }
            draw: { points: { visible: false } }

  # Mountain peaks: own layer + source (was a sublayer of `pois`). The standard `osm`
  # source drops to coarse tiles with distance - and the tile server only emits
  # mountain_peak from z11 - so under tilt everything past the first few km had no peak
  # data at all. `osm-peaks` always resolves to z11 tiles where visible; density is then
  # controlled by distance and dominance (dominance_gate below), not by tile LOD.
  peaks:
    data: { source: osm-peaks, layer: poi }
    exclusive: true
    filter:
      natural: [peak, volcano]
      ele: { min: 1 }
      all:
        # docs/label-placement-plan.md Task 3 (revised after user feedback 2026-07-15:
        # the original version of this comment described peak_prominence_ele_min as a
        # "prominence proxy" gating candidacy -- that was wrong and is NOT what this does
        # anymore; see the corrected explanation below).
        #
        # A peak below z12 becomes a label CANDIDATE if it has a real OSM prominence/
        # wikipedia tag, OR is at or above global.peak_candidacy_ele_floor. That floor is
        # NOT a prominence signal and must never be read as "taller = more likely to be
        # labeled" -- it exists purely to bound how many candidates get built per tile for
        # performance (every real peak on Earth would otherwise become a below-z12
        # candidate, including countless unremarkable bumps with an OSM node), set low
        # enough that it essentially never excludes a genuinely prominent peak (most named
        # summits worldwide clear it) -- see the global's own comment for the full
        # reasoning and why elevation can't be a real gate here at all.
        #
        # Actual salience selection happens entirely via PRIORITY + collision, below:
        # peaks without a real prominence tag get a deliberately bad PROVISIONAL priority
        # (worse than anything else on the map) so they display *nothing* until
        # Label::refinePriority() confirms real texture-shading prominence, on the main
        # thread, once the elevation mosaic loads -- see the priority: function below and
        # its comment for the full mechanism. This is what actually answers "does this
        # peak look spiky/salient from far away" -- not this filter.
        - any:
            # Block (dash-per-item) list, not a flow `[...]` sequence, so the JS
            # function's literal `{`/`}` can't be mistaken for YAML flow-mapping
            # syntax.
            - { wikipedia: true }
            - { prominence: true }
            - function() { return feature.ele >= global.peak_candidacy_ele_floor; }
            - { $zoom: { min: 12 } }
        # 2026-10-13 (user: "too many unnamed elevation points are shown, they're not
        # really needed"): anonymous OSM elevation nodes are dropped unless
        # global.peak_show_unnamed is set. (A peak with only a name_en counts as named.)
        - any:
            - { name: true }
            - { name_en: true }
            - function() { return global.peak_show_unnamed; }
        # REMOVED 2026-07-16 (real bug, found via user report "many peaks aren't showing
        # at all unless super zoomed in, even with no other peaks around"): this used to
        # be `all: [ any: [{$zoom:{min:17}}, global.show_trails], any: [{$zoom:{min:15}},
        # {name:true}] ]` -- two SEPARATE any: blocks under `all:`, i.e. ANDed together,
        # not the single OR the neighboring comment ("named peaks from z15, all from
        # z17") actually described. Expanding the boolean algebra: (zoom>=17 OR
        # show_trails) AND (zoom>=15 OR name) reduces to zoom>=17 OR (show_trails AND
        # (zoom>=15 OR name)) -- with global.show_trails defaulting to false (see its own
        # definition above), that's just "zoom>=17", full stop, for every peak on the
        # default (non-Hike) map style, regardless of name/prominence/how empty the
        # surrounding area is. Confirmed via headless screenshot: identical view, same
        # peaks, same zoom -- 5+ named peaks with elevations under stylus-bike-hike
        # (show_trails: true), zero peaks of any kind under the default stylus-osm-terrain
        # source. This predates the current texture-shading candidacy/priority system
        # above (it was a leftover simple zoom-tier heuristic from before that existed),
        # and directly defeated this whole project's point: peaks are already gated by
        # the OR-candidacy filter just above and by priority + collision (refined from
        # real texture-shading prominence, see the priority: function below) -- that's
        # the intended sole salience gate per this rule's own comment ("Actual salience
        # selection happens entirely via PRIORITY + collision"), so a second, blunt,
        # zoom>=17-in-practice gate on top of it was both redundant and the actual reason
        # peaks were invisible at any normal browsing zoom.
    draw:
      points:
        sprite: peak
        size: 14px
        # Formerly inherited from the `pois` layer this rule used to be a sublayer of (it is
        # its own layer now, fed by the `osm-peaks` source - see sources: and the stub
        # `peak:` rule left in `pois`).
        texture: pois
        interactive: true
        collide: true
        transition: { show: { time: 0s }, hide: { time: 1s } }
        # Distance-aware density (Label::Options::dominanceGate): label a peak only while its
        # DEM dominance radius is at least this fraction of its distance from the camera.
        # Needs dominance >= ratio * d * d / (d + 10 km): ~8% of the distance far away,
        # much less up close - a 130 m knoll at 5 km, a 1 km-dominant summit out to 19 km,
        # only a ~4 km massif at 60 km.
        dominance_gate: global.peak_dominance_gate
        # docs/label-placement-plan.md Task 3, revised 2026-07-16 (real bug, user report:
        # "a whole range doesn't show the label for the most prominent peak; it shows
        # maybe just one for a small foothill, but nothing for the big peak until I
        # really zoom in, with no other labels or trails interfering"): this used to be
        # `repeat_distance: 40px`, shrunk down from the default full-tile-width radius but
        # still a mutual-suppression radius applied by LabelCollider::process() at
        # TILE-BUILD TIME (TileWorker thread), using only PROVISIONAL priority (name +
        # weak height tie-break -- see priority: below) since the texture-shading-refined
        # value doesn't exist yet at this point (main-thread only, later). Any nonzero
        # repeat_distance risks exactly the reported symptom: two real, distinct nearby
        # summits sharing a repeat group, with the provisional signal (which can't see
        # true visual/texture-shading prominence) picking the WRONG one to permanently
        # kill (Label::State::dead -- irreversible, not reconsidered once real refinement
        # would have ranked them correctly) -- worse at low zoom, where real-world
        # peak-to-peak spacing maps to fewer screen pixels, exactly matching "shows only
        # once I zoom in a lot." Disabled entirely (0 = opts out, see
        # TextStyleBuilder::applyRule's `if (repeatDistance > 0.f)` gate, same mechanism
        # already used to opt text2/elevation out of this for the same class of reason --
        # see its own comment). Deduplicating genuinely-coincident sprites (the same
        # summit double-tagged in OSM) is left entirely to the real per-frame OBB
        # collision pass (LabelManager::handleOcclusions()) instead, which runs AFTER
        # texture-shading refinement and correctly favors the truly more prominent peak
        # rather than guessing from a crude provisional signal.
        repeat_distance: 0
        # docs/label-placement-plan.md Phase 2/Task 3, revised 2026-07-16 after user
        # report ("main peak with a label name isn't showing... but elevations are
        # showing... in the same big font"): a NAMED peak must always outrank an unnamed/
        # elevation-only one, full stop, regardless of texture-shading timing -- prior to
        # this, both shared the exact same priority band (worst-in-tier 0.999 until
        # texture-shading refinement), so an anonymous OSM elevation node could easily
        # beat (or simply refine faster than) a genuinely famous named summit nearby.
        #
        # Two disjoint HALF-integer bands within the peak tier: named peaks get
        # [global.priority.peak, +0.4], unnamed ones get [global.priority.peak+0.5, +0.9].
        # Real OSM prominence (rare) or, failing that, a weak height-based tie-break (per
        # user request -- "prioritize... based on prominence, height, and the fact that
        # they have a name"; NOT a real prominence proxy on its own, see
        # peak_candidacy_ele_floor's comment on why elevation can't stand in for
        # prominence -- just a same-band nudge until texture shading provides the real
        # signal) place each peak within its band via `badness` (0 = best, kMaxFraction =
        # worst-in-band). kMaxFraction=0.4 leaves a comfortable margin below the 0.5 gap
        # to the other band, so even a maximally-refined unnamed peak (see below) can
        # never cross into named territory. Label::refinePriority() (main thread, once
        # the elevation mosaic loads) replaces the fractional part with a texture-shading-
        # derived one, but recovers the HALF-tier floor via floor(priority*2)/2, not
        # floor(priority) -- see its own comment -- which is what actually preserves this
        # named/unnamed separation through refinement instead of collapsing both bands
        # back together. A peak that's never refined (e.g. no terrain data for this map
        # style) simply stays at its band's provisional value, worst-in-band but still
        # correctly ranked relative to the other band -- an acceptable, expected steady
        # state, not a bug (mirrors Phase 2's original fallback contract).
        priority: |
          function() {
              var name = global.show_name_en && feature.name_en ? feature.name_en : feature.name;
              var base = name ? global.priority.peak : global.priority.peak + 0.5;
              var kMaxFraction = 0.4;
              var badness;
              if (feature.prominence) {
                  badness = 1 - Math.sqrt(Math.min(1, feature.prominence/3000));
              } else {
                  var eleFrac = Math.min(1, feature.ele/6000);
                  badness = 1 - 0.3 * eleFrac;
              }
              return base + Math.round(badness * kMaxFraction * 65536)/65536;
          }
        priority_texture_shading: true
        # docs/label-placement-plan.md Task 1, redesigned 2026-07-16 after user review:
        # name (semibold) + elevation (regular) in two different font weights. Confirmed
        # there is NO per-line/per-glyph-run font override anywhere in the text pipeline
        # -- FontContext::layoutText shapes an entire label's text (including embedded
        # "\n") with exactly one alfons::Font -- so a single combined "name\nele" string,
        # as this used to be, can only ever render in one weight. Fixed by splitting into
        # two separate TextLabels (see the "text2:" block below).
        #
        # The two labels are placed INDEPENDENTLY, each via its own Imhof/Yoeli-ranked +
        # ridge/vector-avoidance anchor selection (TextStyleBuilder::salienceOrderedAnchors
        # / Label::refineAnchor) -- real topo maps (and OSM) don't require a peak's name
        # and elevation to be adjacent, so this scene doesn't force it either. No coupling
        # between the two anymore (revised 2026-07-16, user report of inconsistent
        # icon-to-elevation distance: an earlier "prefer stacking directly under the name"
        # fallback, setStackFallbackTarget(), was removed -- see Label::refineAnchor()'s
        # header comment in label.h for why): both labels always use the SAME
        # icon-relative anchor formula (icon radius + own half-extent + anchor_gap_scale
        # gap below), so they end up the same fixed distance from the icon regardless of
        # which anchors they land on. A "name, elevation stacked right below" look can
        # still happen when both independently pick vertically-adjacent anchors, but it's
        # no longer a distinct mode with its own offset math.
        #
        # anchor_gap_scale below halves the default icon<->label gap (per feedback the
        # default -- "clear of the icon's full dimension, halved already" -- still read
        # as too far from the peak dot); the elevation label uses the SAME value (see its
        # own font block below) so it sits exactly as close to the icon as the name does.
        #
        # optional: true here (revised 2026-07-16, user report: "peak dots shouldn't be
        # shown unless at least an elevation number is shown... or an elevation AND a
        # name"): the icon<->text "die together" cascade (LabelCollider::killOccludedLabels
        # / LabelManager::handleOcclusions, both keyed on Label::Options::optional) used to
        # run the other way -- THIS (the name) was the non-optional label, so a dot could
        # end up on screen with only a bare elevation number, or even with nothing at all
        # if the name failed to place while the (optional) elevation simply never got a
        # chance to try. Marking the name optional and text2/elevation NOT optional (see
        # its own block below) flips the gate to what's actually wanted: the icon requires
        # a successfully-placed ELEVATION to show at all; the name is free extra context
        # that can fail independently without hiding the dot+elevation.
        text:
          optional: true
          # 2026-10-13 (user: peak name and elevation "too far from their dot markers, should
          # be at half of their current distance"). Two knobs, and 0 for the gap alone is
          # NOT possible: a name above and an elevation below the dot are separated only by
          # this gap (each label box ends at the dot centre +- gap*14px/2), so at 0 the two
          # boxes touch, count as colliding, and the name always loses (seen live: nearly
          # every name gone). So the label box buffer (default 0.25*font size on every side,
          # which is most of the visible gap) is zeroed instead and the gap kept slightly
          # positive: 0.15 -> boxes 2.1px apart. Elevation inherits both from this block.
          anchor_gap_scale: 0.15
          buffer: 0px
          # Phase 7 round 13 (2026-07-17, docs/label-placement-v2-spec.md's "shared
          # repeatGroup across every same-draw-rule peak" risk): unlike this rule's own
          # icon (repeat_distance: 0, see the points: block's own comment) and text2/
          # elevation (zeroed in PointStyleBuilder::addFeature(), pointStyleBuilder.cpp),
          # the name label itself was never given the same treatment -- it was still
          # defaulting to the ~256px repeatDistance and a repeatGroup shared by literally
          # every peak using this rule (TextStyleBuilder::applyRule()'s fallback,
          # `_rule.getParamSetHash()`, is over style parameters, not per-feature
          # content). That means any two peaks' NAMES within 256 screen px of each other
          # mutually excluded unconditionally, using only provisional pre-refinement
          # priority at tile-build time (LabelCollider::filterRepeatGroups()) -- the exact
          # same class of bug already fixed for the icon and elevation sub-label, just
          # never applied to the label most likely to actually collide (it's the widest
          # of the three). Disabled for the same reason round 5 disabled it for the icon:
          # deduplicating genuinely-overlapping labels is left entirely to the real
          # per-anchor OBB collision pass (LabelManager::handleOcclusions()), which runs
          # AFTER texture-shading refinement and correctly favors the truly more prominent
          # peak, instead of a crude provisional-priority guess.
          text_repeat_distance: 0
          text_source: |
            function() {
                // Revised 2026-07-16 after user report: this used to fall back to
                // showing the elevation number here when there's no name -- but that
                // rendered it in THIS label's big/semibold 12px font, indistinguishable
                // from an actual peak name (reasonably read as "is this a bug, or did
                // someone tag a peak's elevation as its name in OSM?" -- neither: it was
                // this scene's own fallback). An elevation-only OSM node is not a named
                // summit and shouldn't look like one. Now: no name means no primary label
                // at all (PointStyleBuilder::addFeature independently builds text2 below
                // regardless of whether this one produced anything -- see its own
                // comment), so the elevation, when there's no name, shows ONLY via
                // text2's small/regular 9px font.
                var name = global.show_name_en && feature.name_en ? feature.name_en : feature.name;
                if(!name) { return ""; }
                if(name.slice(-9) == " Mountain") { name = name.slice(0, -9) + " Mt."; }
                else if(name.slice(0, 6) == "Mount ") { name = "Mt. " + name.slice(6); }
                return name;
            }
          text_wrap: 100
          # docs/label-placement-plan.md Task 4: steer this label's anchor away from a
          # strong ridge/canyon texture-shading response, main-thread only, once the
          # elevation mosaic is available at this peak's position (Label::refineAnchor(),
          # called from LabelManager::processLabelUpdate next to refinePriority() above) --
          # mirrors that same "can't run at tile-build time on a TileWorker thread, so
          # refine later on the main thread" pattern, this time for anchor choice instead
          # of priority. This is the ridge-avoidance term Phase 3's anchorCandidateCost()
          # (textStyleBuilder.cpp) left as a documented, permanent limitation for -- it
          # turned out not to be permanent, just needing the same main-thread deferral
          # Phase 2 already established for priority.
          anchor_texture_shading: true
          # Peak names (docs/label-typography.md): IBM Plex Sans CONDENSED, upright, sentence
          # case, barely tracked. Condensed because a summit label sits on an icon in the
          # most crowded part of the map and is read at a glance -- narrow letterforms keep
          # the box (and so the collision footprint) small. Upright because italic is
          # reserved for water and ice. The *hierarchy among peaks* is typographic, like a
          # printed topo: weight and size step up with the REAL OSM prominence tag
          # (prominence >= 900 m: semibold 13px; >= 350 m or a Wikipedia entry: medium
          # 11.5px; the rest: regular 10.5px). Prominence is the only signal used - elevation
          # alone never makes a label heavier, same rule as for label selection (see the
          # priority: function above).
          font:
            family: global.condensed_font
            weight: |
              function() {
                  var pr = feature.prominence || 0;
                  return pr >= 900 ? "700" : "600";
              }
            size: |
              function() {
                  var pr = feature.prominence || 0;
                  return pr >= 900 ? 15 : (pr >= 350 || feature.wikipedia) ? 13.5 : 12.5;
              }
            letter_spacing: 0.03
            fill: global.color.peak_name
            # 1.5px, down from the inherited 3px: with the background-adaptive halo (sdf.fs,
            # TextStyle::onBeginDrawFrame) now confined to near-black backgrounds this is a
            # light touch, not the old white smear on dim terrain.
            stroke: { color: global.color.peak_halo, width: 3.2 }
        text2:
          text_source: |
            function() {
                // Elevation sub-label, always the small/regular font, regardless of
                // whether this peak has a name -- revised 2026-07-16: this used to skip
                // itself when there's no name (on the theory that the primary label above
                // already showed the elevation by itself in that case), but that meant an
                // unnamed elevation-only peak's number rendered in the PRIMARY label's
                // big/semibold font, indistinguishable from an actual peak name. The
                // primary above now returns "" when there's no name instead, so this is
                // unconditionally the only place elevation ever renders, in a font that
                // reads as "just a data point," not a summit name.
                //
                // Guard added 2026-07-17 (Phase 7 round 10 follow-up, "naked dot"
                // investigation): a peak can pass this rule's own candidacy filter via a
                // real `wikipedia`/`prominence` tag alone, with no `ele` tag at all -- for
                // such a feature `feature.ele` is undefined, and calling `.toFixed()` on
                // it used to throw (caught, but silently, one EvalFilterFn error log per
                // candidate, every frame). Return "" explicitly instead, matching the
                // primary label's own no-content pattern above -- PointStyleBuilder::
                // addFeature() (pointStyleBuilder.cpp) now kills the icon outright when
                // this label ends up with no content, so a naked dot can no longer result.
                if (feature.ele === undefined || feature.ele === null) { return ""; }
                const ele = global.metric_units ? feature.ele : feature.ele*3.2808399;
                return ele.toFixed(0);
            }
          # The elevation figure: a datum, not a name. Condensed regular, a step smaller
          # and a step lighter in colour than the name, slightly tracked so small numerals
          # keep their counters open.
          font:
            family: global.condensed_font
            weight: 600
            size: 11px
            letter_spacing: 0.05
            fill: global.color.peak_elevation


  boundaries:
    data: { source: osm, layer: boundary }
    filter:
      # admin_level=3 is for special divisions, not present for most countries
      any:
        - { admin_level: 2, $zoom: { min: 2 } } # country
        - { admin_level: 4, $zoom: { min: 6 } } # state/province
        - { admin_level: 4, $zoom: { min: 5 }, ISO3166_2: [US, CA, CN] } # large countries
      not:
        - maritime: true
        - natural: coastline
    draw:
      lines:
        style: dashed-border
        order: global.order.border
        width: 1px
        color: global.color.border

    country:
      filter: { admin_level: 2 }
      draw:
        lines:
          style: unlit-lines
          color: global.color.border_country
          width: 1.5px
      disputed:
        filter: { disputed: true }
        draw: { lines: { style: dashed-border } }

    labels:
      filter:
        $zoom: { min: 8 }
      draw:
        text:
          priority: global.priority.boundary
          text_source: global.names_one_line #{ left: "", right: global.names_one_line } -- need to fix tilemaker
          font:
            family: global.primary_font
            weight: 400
            size: 10px
            letter_spacing: 0.22
            fill: global.color.place_name
            stroke: { color: global.color.place_halo, width: 4 }
            transform: uppercase
      country:
        filter: { admin_level: 2 }
        draw:
          text: { font: { size: 12px, weight: 500, letter_spacing: 0.3 } }

  places:
    data: { source: osm, layer: place }

    # city labels with points - there may be some strange behavior due to proxy tiles w/ z < 9 when
    #  tiles with z >= 9 are missing
    city-points:
      filter:
        place: city
        $zoom: { max: 9 }
        any:
          [
            { place_CN: false },
            { place_CN: "prefecture-level_city" },
            { population: { min: 5000000 } },
          ]
      draw:
        points:
          visible: false
          size: 6px
          color: global.color.city_point
          priority: global.priority.place_fn
          interactive: true
          outline: { color: global.color.city_point_halo, width: 1px }
          text:
            text_source: global.names_one_line
            priority: global.priority.place_fn
            font:
              family: global.primary_font
              weight: 500
              fill: global.color.place_name
              stroke: { color: global.color.place_halo, width: 4 }
              size: [[8, 10px], [12, 16px]]
      capital:
        filter: { capital: "yes" }
        draw:
          {
            points:
              {
                size: 10px,
                texture: pois,
                sprite: capital,
                priority: 6.5,
                text: { priority: 6.5 },
              },
          }
      city-1m:
        filter: { population: { min: 1000000 } }
        draw: { points: { text: { font: { weight: 600 } } } }
      city-500k:
        filter: [{ capital: "yes" }, { population: { min: 500000 } }]
        draw:
          {
            points:
              {
                visible: true,
                text: { font: { weight: 700, size: [[6, 12px], [8, 14px], [12, 20px]] } },
              },
          }
      city-100k:
        filter: { $zoom: { min: 6 }, population: { min: 100000, max: 500000 } }
        draw:
          {
            points:
              {
                visible: true,
                text: { font: { weight: 600, size: [[8, 12px], [12, 18px]] } },
              },
          }
      default:
        filter: { $zoom: { min: 7 } }
        draw: { points: { visible: true } }
      special: # San Jose has higher population than SF
        filter: { name: "San Francisco" }
        draw: { points: { priority: 8, text: { priority: 8 } } }

    # places w/text-only labels (not accompanying point)
    text-only:
      draw:
        text:
          visible: false
          interactive: true
          text_source: global.names_one_line
          priority: global.priority.place_fn
          font:
            family: global.primary_font
            weight: 400
            size: 12px
            fill: global.color.place_name
            stroke: { color: global.color.place_halo, width: 4 }

      islands:
        exclusive: true
        filter: { place: [island, islet, archipelago] }
        # an island is surrounded by water and named like it: italic, lightly tracked
        draw:
          text:
            font:
              family: global.natural_font
              style: italic
              weight: 400
              letter_spacing: 0.12
              fill: global.color.water_name
              stroke: { color: global.color.water_halo, width: 3 }
        archipelago:
          filter: { place: archipelago }
          draw: { text: { font: { transform: uppercase, letter_spacing: 0.25 } } }
        show:
          filter:
            - { area: { min: 1500px2, max: 350000px2 } }
            - { area: { min: 1500px2 }, $zoom: { max: 12 } }
          draw: { text: { visible: true } }

      continents:
        exclusive: true
        filter: { place: continent, $zoom: { min: 2, max: 3 } }
        draw: { text: { font: { transform: uppercase, weight: 300, letter_spacing: 0.5 } } }

      countries:
        exclusive: true
        filter:
          place: country
          any:
            - { $zoom: { max: 8 }, population: { min: 10000000 } }
            - { $zoom: { min: 5, max: 8 }, population: false }
            - { $zoom: { min: 5, max: 8 }, population: { min: 1000000 } }
            - { $zoom: { min: 6, max: 8 }, population: { min: 200000 } }
            - { $zoom: { min: 7, max: 9 } }
        draw:
          text:
            visible: true
            # country names: light tracked capitals - big, quiet, spread across the land
            font:
              weight: 300
              size: [[6, 14px], [8, 20px]]
              transform: uppercase
              letter_spacing: 0.34

      regions:
        exclusive: true
        filter:
          place: [state, province]
          $zoom: { min: 6, max: 9 }
        draw:
          text:
            visible: true
            font:
              weight: 400
              size: [[6, 10px], [8, 12px]]
              letter_spacing: 0.24
              transform: uppercase
        big:
          filter: { ISO3166_2: [US, CA, CN] }
          draw: { text: { font: { size: [[6, 11px], [8, 12.5px]] } } }
        # use short name when available at low-zooms
        short:
          filter: { $zoom: { max: 7 }, not: { ISO3166_2: [CN, PH] } }
          draw: { text: { text_source: ["ref", "name"] } }

      cities:
        exclusive: true
        filter:
          place: [city, town, village, hamlet]
          not:
            { place_CN: [county, district, banner, subdistrict, neighbourhood] }
          $zoom: { min: 9 } # show city point labels below z11
        draw:
          text:
            text_source: global.names_two_lines
        city:
          filter: { place: city, $zoom: { min: 9, max: 14 } }
          draw:
            {
              text:
                {
                  visible: true,
                  font:
                    {
                      weight: 600,
                      size: [[8, 10px], [12, 16px]],
                      letter_spacing: 0.01,
                    },
                },
            }
          city-100k:
            filter: { population: { min: 100000, max: 500000 } }
            draw: { text: { font: { size: [[8, 12px], [12, 18px]] } } }
          city-500k:
            filter: { population: { min: 500000 } }
            draw: { text: { font: { weight: 700, size: [[8, 14px], [12, 20px]] } } }
        town:
          filter: { place: town, $zoom: { min: 9, max: 14 } }
          draw:
            {
              text:
                {
                  visible: true,
                  font: { weight: 500, size: [[8, 10px], [12, 14px]] },
                },
            }
        village:
          filter: { place: village, $zoom: { min: 11, max: 15 } }
          draw:
            { text: { visible: true, font: { weight: 400, size: [[8, 9px], [12, 12px]] } } }
        hamlet:
          filter: { place: hamlet, $zoom: { min: 13, max: 15 } }
          # smallest settlements: Condensed, a notch lighter in ink, opened up slightly
          draw:
            {
              text:
                {
                  visible: true,
                  font:
                    {
                      family: global.condensed_font,
                      weight: 400,
                      size: [[8, 8px], [12, 10px]],
                      letter_spacing: 0.04,
                      fill: global.color.hamlet_name,
                    },
                },
            }
        # most towns in China have place:CN, but many villages do not, so this is the best we can do
        "!china":
          filter: { place: town, place_CN: true, $zoom: { max: 10 } }
          draw: { text: { visible: false } }

      neighborhoods:
        exclusive: true
        filter:
          - { place: borough, $zoom: { min: 12, max: 15 } }
          - { place: suburb, $zoom: { min: 13, max: 16 } }
          - { place: [neighbourhood, quarter], $zoom: { min: 14, max: 19 } }
          - {
              place_CN: [subdistrict, neighbourhood],
              $zoom: { min: 13, max: 17 },
            }
          - { place_CN: [district], $zoom: { min: 11, max: 14 } } # usually tagged with place=city
          #- { class: microhood, $zoom: { min: 15 } }
        draw:
          text:
            visible: false
            #priority: global.priority.neighborhood - use place_fn
            interactive: false
            font:
              weight: 500
              size: [[14, 10.5px], [16, 12.5px]]
              letter_spacing: 0.16
              fill: global.color.hood_name
              stroke: { color: global.color.hood_halo }
              transform: uppercase
        borough:
          filter: { place: borough }
          draw: { text: { font: { size: [[12, 12px], [14, 14px]] } } }
        suburb:
          filter: { place: suburb }
          draw: { text: { font: { size: [[13, 11px], [15, 13px]] } } }
        japan_chome:
          # Japan "chome" districts tagged as neighborhoods in OSM - much smaller than neighborhoods
          #  in other countries, so adjust zoom level range
          exclusive: true
          priority: 1
          filter: global.japan_bounds
          shown:
            filter: { $zoom: { min: 17, max: 19 } }
            draw: { text: { visible: true, font: { size: 12px } } }
        china_district:
          exclusive: true
          priority: 2
          filter: { place_CN: [district] }
          draw:
            text:
              visible: true
              priority: global.priority.district_CN
              font:
                fill: global.color.place_name
                size: [[11, 11px], [12, 11px], [13, 13px]]
        default:
          # by default, show neighborhoods between z13 and z17
          filter: { $zoom: { min: 13, max: 17 } }
          draw: { text: { visible: true } }
